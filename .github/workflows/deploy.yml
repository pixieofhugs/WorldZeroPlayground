name: Deploy

# main -> prod, develop -> dev, same box, same pipeline. Both images are built
# and pushed in one job, so a deploy never lands half a version: if either
# build fails, the SSH step never runs and the server keeps what it has.
on:
  push:
    branches: [main, develop]

# Never let two deploys of the same environment race each other onto the box.
# No cancel-in-progress: a half-finished deploy is worse than a queued one.
concurrency: deploy-${{ github.ref }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve the target environment
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "TAG=prod" >> "$GITHUB_ENV"
            echo "VITE_API_URL=https://api.worldzero.org" >> "$GITHUB_ENV"
          else
            echo "TAG=dev" >> "$GITHUB_ENV"
            echo "VITE_API_URL=https://api.dev.worldzero.org" >> "$GITHUB_ENV"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Both images carry the moving tag the server pulls AND the commit sha,
      # which is the whole rollback story: edit TAG= in the server's .env to a
      # sha and `docker compose up -d`.
      - name: Build and push the backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/worldzero-backend:${{ env.TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/worldzero-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push the frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          build-args: VITE_API_URL=${{ env.VITE_API_URL }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/worldzero-frontend:${{ env.TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/worldzero-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinned host key, not StrictHostKeyChecking=no — otherwise anything
          # that can answer on that IP gets handed the deploy session.
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

          scp deploy/docker-compose.yml "deploy@$SSH_HOST:/srv/worldzero/$TAG/docker-compose.yml"
          # `up -d` and not `down && up`: compose recreates only what changed,
          # so Postgres never bounces and the API is down for a second or two
          # rather than the length of a database start.
          ssh "deploy@$SSH_HOST" "cd /srv/worldzero/$TAG && docker compose pull && docker compose up -d && docker image prune -af --filter until=168h"
