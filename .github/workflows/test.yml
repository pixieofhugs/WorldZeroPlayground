name: Test

on:
  push:
    branches: [main]
  pull_request:

# One run per ref. A superseded push cancels its own in-flight jobs rather
# than racing them to completion. main is exempt — see below.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: worldzero
          POSTGRES_PASSWORD: test
          POSTGRES_DB: worldzero_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://worldzero:test@localhost/worldzero_test
      TEST_DATABASE_URL: postgresql+asyncpg://worldzero:test@localhost/worldzero_test
      SECRET_KEY: ci-test-secret-key-not-for-production
      GOOGLE_CLIENT_ID: dummy-client-id
      GOOGLE_CLIENT_SECRET: dummy-client-secret
      GOOGLE_REDIRECT_URI: http://localhost:8000/auth/google/callback
      DISCORD_CLIENT_ID: dummy-discord-client-id
      DISCORD_CLIENT_SECRET: dummy-discord-client-secret
      DISCORD_REDIRECT_URI: http://localhost:8000/auth/discord/callback
      MEDIA_BASE_URL: http://localhost:8000/media
      MEDIA_ROOT: /tmp/media

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run migrations
        run: python -m alembic upgrade head
        working-directory: backend

      - name: Run tests with coverage
        run: pytest --cov=. --cov-report=term-missing --cov-fail-under=92
        working-directory: backend

  # The API contract gate (#1400). `backend/openapi.json` and the TypeScript
  # types generated from it are committed artifacts, and this job is what keeps
  # them honest: regenerate, then refuse a diff. Backend shape changes that the
  # frontend has not absorbed become a compile error instead of a runtime
  # surprise — but only for as long as the committed schema is the one the app
  # actually serves.
  #
  # It calls the same script a developer calls. Inlining the two generation
  # commands here instead would mean the gate tested whether CI's copy of the
  # recipe still matched the developer's, and the day they diverged the failure
  # would land on whoever's PR was open.
  api-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      # openapi-typescript is a devDependency; `npm ci` pins it from the
      # lockfile. The generator version is part of the artifact's identity —
      # an unpinned one would move the output from under this gate.
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Regenerate the schema and the generated types
        run: python scripts/regen_api_client.py

      - name: Fail if the committed artifacts are stale
        run: |
          if ! git diff --exit-code; then
            echo "::error::The committed API artifacts do not match the code."
            echo "Run 'python scripts/regen_api_client.py' from the repo root and"
            echo "commit both backend/openapi.json and"
            echo "frontend/src/api/generated/schema.d.ts."
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint (blocks raw user-facing strings — ADR-0032)
        run: npm run lint
        working-directory: frontend

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck
        working-directory: frontend

      # The /design-sync preview kit lives outside `frontend/`, so the main
      # tsconfig's `include: ["src"]` never saw it and it drifted invisibly
      # (#1328). Separate config, separate step — a preview whose props go
      # stale now fails the build like anything else.
      - name: Typecheck the /design-sync preview kit
        run: npm run typecheck:design-sync
        working-directory: frontend

      - name: Run tests
        run: npm test
        working-directory: frontend

      - name: Build (catches import/resolution errors eslint & vitest miss)
        run: npm run build
        working-directory: frontend

      - name: Initial-load byte budget (warns on growth, fails past the ceiling)
        run: npm run budget
        working-directory: frontend
