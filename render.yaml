services:
  - type: web
    name: worldzero-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    branch: main
    autoDeploy: true
    # NO instance count is declared here, and that is deliberate: this service
    # must run as exactly ONE instance. A praxis is co-edited in a "room" whose
    # CRDT document lives in this process's memory (ADR-0073), so two instances
    # would hold two divergent documents for one praxis and flush both to
    # `body_text`. ADR-0012's lazy-on-access timeout leans on the same fact.
    #
    # The rule is enforced, not merely written down: the app takes a Postgres
    # session-level advisory lock at boot and a second instance exits loudly
    # (`services/praxis_room.acquire_single_instance_lock`). Scaling out needs a
    # broker, or advisory-lock room ownership, BEFORE the second instance —
    # turning it on here just fails the new instance's deploy.
    disk:
      name: media-storage
      mountPath: /app/media
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: worldzero-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://api.worldzero.org/auth/google/callback
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_REDIRECT_URI
        value: https://api.worldzero.org/auth/discord/callback
      - key: MEDIA_ROOT
        value: /app/media
      - key: MEDIA_BASE_URL
        value: https://api.worldzero.org/media
      - key: FRONTEND_URL
        value: https://worldzero.org
      - key: CORS_ORIGINS
        value: https://worldzero.org,https://www.worldzero.org
      - key: ENVIRONMENT
        value: production
      # COOKIE_DOMAIN is deliberately UNSET, so the session cookie is host-only
      # on api.worldzero.org.
      #
      # It used to be `.worldzero.org`, which attaches a live 7-day JWT to every
      # request to every host under the domain — present and future, including
      # any preview/CDN/status subdomain and any dangling DNS record someone
      # else can claim. A wildcard here buys nothing: the browser decides what
      # to send from the REQUEST host, and the frontend's credentialed XHR goes
      # to api.worldzero.org, which a host-only cookie still covers.
      # worldzero.org and api.worldzero.org share a registrable domain, so
      # SameSite=Lax treats them as same-site and does not block it either.
      #
      # Changing this logs everyone out once — the old `.worldzero.org` cookie
      # and the new host-only one are different cookies. That is expected and
      # was accepted deliberately.

  - type: web
    name: worldzero-frontend
    runtime: static
    rootDir: frontend
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://api.worldzero.org
    headers:
      # Vite content-hashes everything under /assets, so a changed file is a
      # changed URL. These can be cached forever; the blanket no-cache below
      # was costing every visitor a revalidation round-trip before first paint,
      # and a full re-download of the bundle on any 200.
      #
      # This does NOT affect how fresh votes or points are: those come from the
      # separate worldzero-backend service at api.worldzero.org, which these
      # headers do not touch.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # index.html stays uncached so a deploy is picked up immediately — it is
      # what points at the new hashed bundle.
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: worldzero-db
    databaseName: worldzero
    user: worldzero
    plan: pro
