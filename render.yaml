services:
  - type: web
    name: worldzero-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    branch: main
    autoDeploy: true
    disk:
      name: media-storage
      mountPath: /app/media
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: worldzero-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://api.worldzero.org/auth/google/callback
      - key: MEDIA_ROOT
        value: /app/media
      - key: MEDIA_BASE_URL
        value: https://api.worldzero.org/media
      - key: FRONTEND_URL
        value: https://worldzero.org
      - key: CORS_ORIGINS
        value: https://worldzero.org,https://www.worldzero.org
      - key: ENVIRONMENT
        value: production
      - key: COOKIE_DOMAIN
        value: .worldzero.org

  - type: web
    name: worldzero-frontend
    runtime: static
    rootDir: frontend
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://api.worldzero.org
    headers:
      # Vite content-hashes everything under /assets, so a changed file is a
      # changed URL. These can be cached forever; the blanket no-cache below
      # was costing every visitor a revalidation round-trip before first paint,
      # and a full re-download of the bundle on any 200.
      #
      # This does NOT affect how fresh votes or points are: those come from the
      # separate worldzero-backend service at api.worldzero.org, which these
      # headers do not touch.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # index.html stays uncached so a deploy is picked up immediately — it is
      # what points at the new hashed bundle.
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: worldzero-db
    databaseName: worldzero
    user: worldzero
    plan: pro
