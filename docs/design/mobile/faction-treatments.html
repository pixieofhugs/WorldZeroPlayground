x;color:var(--text-1);display:block}\n.prow2 .ppts2 span{font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-3)}\n/* ---- profile / segmented ---- */\n.segtabs{display:flex;border-bottom:1px solid var(--border);margin-top:4px}\n.segtab{flex:1;text-align:center;padding:12px 0;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-3);border-bottom:2px solid transparent;cursor:pointer}\n.segtab.on{color:var(--text-1);border-bottom-color:var(--accent)}\n.screen[data-treatment=&quot;na&quot;][data-theme=&quot;light&quot;] .segtab.on{border-bottom-color:#c2541f}\n.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}\n.thumbs .media{aspect-ratio:1}\n/* ---- factions grid ---- */\n.fgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}\n.ftile{border-radius:var(--card-radius);overflow:hidden;border:1px solid var(--border);cursor:pointer;position:relative;min-height:118px;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;color:#fff}\n.ftile .fsig{position:absolute;top:11px;right:11px;width:20px;height:20px;border-radius:5px;background:rgba(255,255,255,.3)}\n.ftile .fn{font-family:var(--headline);font-style:var(--headline-style);font-weight:var(--headline-weight);font-size:17px;line-height:1.05;position:relative}\n.ftile .fm{font-size:9px;letter-spacing:.14em;text-transform:uppercase;opacity:.9;margin-top:3px;position:relative}\n.fhero{border-radius:var(--card-radius);padding:20px 16px;color:#fff;position:relative;overflow:hidden}\n.fhero .fh-name{font-family:var(--headline);font-style:var(--headline-style);font-weight:var(--headline-weight);font-size:26px}\n.fhero .fh-tag{font-size:11px;letter-spacing:.05em;opacity:.92;margin-top:5px;line-height:1.5}\n.fhero .fh-stat{display:flex;gap:20px;margin-top:15px}\n.fhero .fh-stat div b{font-family:var(--headline);font-style:var(--headline-style);font-size:18px;display:block}\n.fhero .fh-stat div span{font-size:8px;letter-spacing:.16em;text-transform:uppercase;opacity:.85}\n/* ---- composer ---- */\n.seg{display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:3px}\n.seg button{flex:1;border:0;background:none;border-radius:999px;padding:8px;font-family:var(--label-font);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-2);cursor:pointer}\n.seg button.on{background:var(--surface);color:var(--text-1);box-shadow:var(--shadow);font-weight:700}\n.forrow{display:flex;align-items:center;justify-content:space-between;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--btn-radius);padding:11px 13px;font-size:11px;letter-spacing:.06em;color:var(--text-2)}\n.forrow b{font-family:var(--headline);font-style:var(--headline-style);color:var(--text-1);letter-spacing:0;font-size:13px}\n.ta{width:100%;min-height:120px;background:var(--surface);border:1px solid var(--border-2);border-radius:var(--btn-radius);padding:13px;font-family:var(--label-font);font-size:14px;line-height:1.55;color:var(--text-1);resize:none;outline:none;white-space:pre-wrap}\n.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}\n.mgrid .media{aspect-ratio:1}\n.madd{aspect-ratio:1;border:1.5px dashed var(--border-2);border-radius:var(--tile-radius);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--text-2);font-size:22px;cursor:pointer}\n.madd small{font-size:8px;letter-spacing:.12em;text-transform:uppercase}\n.kbd-acc{display:flex;gap:16px;padding:11px 18px;border-top:1px solid var(--border);background:var(--surface-2);color:var(--text-2);font-family:var(--label-font);font-size:16px;align-items:center;flex:none}\n.kbd-acc .ph{margin-left:auto;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}\n.screen[data-treatment=&quot;na&quot;][data-theme=&quot;light&quot;] .kbd-acc .ph{color:#c2541f}\n.kbd{height:172px;background:linear-gradient(180deg,var(--surface-2),var(--bg-page));border-top:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text-3);font-size:9px;letter-spacing:.24em;text-transform:uppercase;flex:none}\n.mdprev h3{font-family:var(--headline);font-style:var(--headline-style);font-weight:var(--headline-weight);font-size:17px;margin:0 0 7px;color:var(--text-1)}\n.mdprev p{font-size:14px;line-height:1.6;color:var(--text-2);margin:0 0 11px}\n.mdprev li{font-size:14px;line-height:1.55;color:var(--text-2);margin-left:18px}\n/* ---- settings ---- */\n.setrow{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--border);cursor:pointer}\n.setrow .si{width:32px;height:32px;border-radius:9px;background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text-2);flex:none;font-size:14px}\n.screen[data-treatment=&quot;everymen&quot;] .setrow .si{border-radius:4px}\n.setrow .sl{flex:1;font-size:14px;color:var(--text-1);font-family:var(--label-font)}\n.setrow .sv{font-size:11px;color:var(--text-3);letter-spacing:.04em}\n.toggle{width:42px;height:24px;border-radius:999px;background:var(--accent);position:relative;flex:none}\n.screen[data-treatment=&quot;na&quot;][data-theme=&quot;light&quot;] .toggle{background:#c2541f}\n.toggle.off{background:var(--border-2)}\n.toggle i{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3)}\n.toggle.off i{right:auto;left:2px}\n/* ---- search ---- */\n.searchbar{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--border-2);border-radius:999px;padding:11px 15px;color:var(--text-2);font-size:14px;font-family:var(--label-font)}\n.sug{display:flex;align-items:center;gap:11px;padding:12px 4px;border-bottom:1px solid var(--border);font-size:13px;color:var(--text-1)}\n.sug .sk{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);margin-left:auto}\n/* ---- level up ---- */\n.lu-scrim{position:absolute;inset:0;background:rgba(10,8,14,.72);z-index:5;display:flex;align-items:center;justify-content:center;border-radius:36px;overflow:hidden}\n.lu-card{width:78%;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:26px 20px;text-align:center;position:relative;z-index:2;box-shadow:0 20px 50px rgba(0,0,0,.5)}\n.lu-burst{width:88px;height:88px;border-radius:50%;margin:0 auto 15px;background:var(--ring);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(0,0,0,.3)}\n.lu-burst b{font-family:var(--headline);font-style:var(--headline-style);font-size:36px;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.35)}\n.lu-card h3{font-family:var(--headline);font-style:var(--headline-style);font-weight:var(--headline-weight);font-size:24px;margin:0 0 6px;color:var(--text-1)}\n.lu-card p{font-size:13px;line-height:1.5;color:var(--text-2);margin:0 0 18px}\n.confetti{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}\n.confetti i{position:absolute;width:8px;height:9px;border-radius:2px;top:-14px;animation:cfall linear infinite}\n@keyframes cfall{to{transform:translateY(620px) rotate(420deg)}}\n/* ---- sticky CTA (detail screens) ---- */\n.sticky-cta{padding:12px 16px 22px;background:var(--nav-bg);backdrop-filter:blur(12px);border-top:1px solid var(--border);display:flex;gap:10px;flex:none;align-items:center}\n\n@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}\n&lt;/style&gt;\n&lt;/head&gt;\n&lt;body&gt;\n&lt;template id=&quot;__bundler_thumbnail&quot;&gt;\n&lt;svg viewBox=&quot;0 0 400 400&quot; xmlns=&quot;http://www.w3.org/2000/svg&quot;&gt;\n  &lt;rect width=&quot;400&quot; height=&quot;400&quot; fill=&quot;#f4f3f0&quot;/&gt;\n  &lt;rect x=&quot;118&quot; y=&quot;90&quot; width=&quot;164&quot; height=&quot;228&quot; fill=&quot;#ffffff&quot; stroke=&quot;rgba(28,28,26,.1)&quot;/&gt;\n  &lt;circle cx=&quot;200&quot; cy=&quot;132&quot; r=&quot;15&quot; fill=&quot;none&quot; stroke=&quot;#1c1c1a&quot; stroke-width=&quot;0.6&quot; opacity=&quot;.3&quot;/&gt;\n  &lt;circle cx=&quot;200&quot; cy=&quot;132&quot; r=&quot;8&quot; fill=&quot;none&quot; stroke=&quot;#1c1c1a&quot; stroke-width=&quot;1&quot; opacity=&quot;.6&quot;/&gt;\n  &lt;circle cx=&quot;200&quot; cy=&quot;132&quot; r=&quot;1.4&quot; fill=&quot;#1c1c1a&quot;/&gt;\n  &lt;path d=&quot;M200 118 v4 M200 142 v4 M186 132 h4 M210 132 h4&quot; stroke=&quot;#1c1c1a&quot; stroke-width=&quot;1&quot;/&gt;\n  &lt;rect x=&quot;150&quot; y=&quot;168&quot; width=&quot;100&quot; height=&quot;1&quot; fill=&quot;rgba(28,28,26,.12)&quot;/&gt;\n  &lt;text x=&quot;200&quot; y=&quot;200&quot; font-family=&quot;Georgia,serif&quot; font-style=&quot;italic&quot; font-size=&quot;17&quot; fill=&quot;#1c1c1a&quot; text-anchor=&quot;middle&quot;&gt;The work is&lt;/text&gt;\n  &lt;text x=&quot;200&quot; y=&quot;222&quot; font-family=&quot;Georgia,serif&quot; font-style=&quot;italic&quot; font-size=&quot;17&quot; fill=&quot;#1c1c1a&quot; text-anchor=&quot;middle&quot;&gt;the work&lt;/text&gt;\n  &lt;rect x=&quot;140&quot; y=&quot;262&quot; width=&quot;120&quot; height=&quot;1&quot; fill=&quot;rgba(28,28,26,.1)&quot;/&gt;\n&lt;/svg&gt;\n&lt;/template&gt;\n&lt;div class=&quot;board&quot;&gt;\n\n  &lt;header class=&quot;board-head&quot;&gt;\n    &lt;p class=&quot;eyebrow&quot;&gt;World Zero · Albescent — hushed vellum&lt;/p&gt;\n    &lt;h1&gt;Join the Albescent and the app goes quiet: white paper, hairlines, an account set down without persuasion.&lt;/h1&gt;\n    &lt;p&gt;Same 375px layout, same markup — dressed in the Order's real restraint. Cards go to plain white (&lt;code style=&quot;color:#c8c4cd&quot;&gt;--faction-albescent-card-bg&lt;/code&gt; #fff) inside a single hairline (&lt;code style=&quot;color:#c8c4cd&quot;&gt;--faction-albescent-border&lt;/code&gt;), a soft shadow the only relief. Each opens with a small concentric &lt;b style=&quot;color:#e9e6df&quot;&gt;mark&lt;/b&gt;, a hairline rule, a mono eyebrow tracked to &lt;code style=&quot;color:#c8c4cd&quot;&gt;.32em&lt;/code&gt; (Courier Prime, &lt;code style=&quot;color:#c8c4cd&quot;&gt;--faction-albescent-mono&lt;/code&gt;), then a title in &lt;b style=&quot;color:#e9e6df&quot;&gt;Cormorant Garamond&lt;/b&gt; italic light. Near-black ink (&lt;code style=&quot;color:#c8c4cd&quot;&gt;#1c1c1a&lt;/code&gt;) held at low opacity for every tier — &lt;code style=&quot;color:#c8c4cd&quot;&gt;-ink&lt;/code&gt;, &lt;code style=&quot;color:#c8c4cd&quot;&gt;-card-muted&lt;/code&gt;, &lt;code style=&quot;color:#c8c4cd&quot;&gt;-text-faint&lt;/code&gt; — nothing shouts. Nothing invented — all &lt;code style=&quot;color:#c8c4cd&quot;&gt;--faction-albescent-*&lt;/code&gt;. Native mode: light.&lt;/p&gt;\n    &lt;span class=&quot;stage&quot;&gt;Albescent (hushed vellum) · hairlines + whitespace · Cormorant italic · native light&lt;/span&gt;\n  &lt;/header&gt;\n\n  &lt;!-- ============ THE IDIOM ============ --&gt;\n  &lt;div class=&quot;section-label&quot;&gt;&lt;span class=&quot;n&quot;&gt;01&lt;/span&gt;&lt;h2&gt;The idiom&lt;/h2&gt;&lt;span class=&quot;rule&quot;&gt;&lt;/span&gt;\n    &lt;p&gt;The Order's signature is &lt;b style=&quot;color:#e9e6df&quot;&gt;restraint&lt;/b&gt; — lifted from the real AlbescentTaskCard: a centred mark, a hairline, a mono eyebrow, an italic title, a mono account, a hairline footer. Anatomy, then the quiet kit.&lt;/p&gt;\n  &lt;/div&gt;\n\n  &lt;div class=&quot;grid&quot; style=&quot;grid-template-columns:1fr 1fr&quot;&gt;\n    &lt;div class=&quot;spec&quot;&gt;\n      &lt;h3&gt;Account-card anatomy&lt;/h3&gt;\n      &lt;p class=&quot;sub&quot;&gt;Centred mark → hairline → mono eyebrow → Cormorant italic title → mono account → mono acknowledge link → hairline footer (level · points). No colour, no weight — only rule and space.&lt;/p&gt;\n      &lt;div id=&quot;anatomy&quot; style=&quot;max-width:230px&quot;&gt;&lt;/div&gt;\n    &lt;/div&gt;\n    &lt;div class=&quot;spec&quot;&gt;\n      &lt;h3&gt;Quiet kit&lt;/h3&gt;\n      &lt;p class=&quot;sub&quot;&gt;The pieces every Albescent surface is built from — the concentric mark, the hairline rule, and the witness circles (the Albescent vote).&lt;/p&gt;\n      &lt;div id=&quot;albkit&quot; style=&quot;padding:22px 16px 14px;background:#f4f3f0;border-radius:3px;margin-top:8px&quot;&gt;&lt;/div&gt;\n      &lt;p class=&quot;pattern-note&quot; style=&quot;margin-top:12px&quot;&gt;&lt;b&gt;Mark&lt;/b&gt; concentric circles + cardinal ticks · &lt;b&gt;Rule&lt;/b&gt; single hairline at 7–9% ink · &lt;b&gt;Witness&lt;/b&gt; five circles, Unseeing → Inscribed, filled by degree of ink.&lt;/p&gt;\n    &lt;/div&gt;\n  &lt;/div&gt;\n\n  &lt;!-- ============ HOME ============ --&gt;\n  &lt;div class=&quot;section-label&quot;&gt;&lt;span class=&quot;n&quot;&gt;02&lt;/span&gt;&lt;h2&gt;FieldDesk — Home&lt;/h2&gt;&lt;span class=&quot;rule&quot;&gt;&lt;/span&gt;\n    &lt;p&gt;Your record and open work, each a white account on a paper desk. Actions keep their one-hand spot; the primary is quiet ink.&lt;/p&gt;\n  &lt;/div&gt;\n  &lt;div class=&quot;rail&quot; id=&quot;homeRail&quot;&gt;&lt;/div&gt;\n\n  &lt;!-- ============ TASKS ============ --&gt;\n  &lt;div class=&quot;section-label&quot;&gt;&lt;span class=&quot;n&quot;&gt;03&lt;/span&gt;&lt;h2&gt;Tasks&lt;/h2&gt;&lt;span class=&quot;rule&quot;&gt;&lt;/span&gt;\n    &lt;p&gt;Every task is open work — mark, eyebrow, italic title, mono account, a hairline footer. Detail keeps the sticky acknowledge bar, returned accounts and notes below.&lt;/p&gt;\n  &lt;/div&gt;\n  &lt;div class=&quot;rail&quot; id=&quot;tasksRail&quot;&gt;&lt;/div&gt;\n\n  &lt;!-- ============ PRAXIS ============ --&gt;\n  &lt;div class=&quot;section-label&quot;&gt;&lt;span class=&quot;n&quot;&gt;04&lt;/span&gt;&lt;h2&gt;Praxis&lt;/h2&gt;&lt;span class=&quot;rule&quot;&gt;&lt;/span&gt;\n    &lt;p&gt;The account, returned: a plain plate, an italic caption, the witness circles. Detail bears full witness; the composer keeps Write / Preview and the media grid.&lt;/p&gt;\n  &lt;/div&gt;\n  &lt;div class=&quot;rail&quot; id=&quot;praxisRail&quot;&gt;&lt;/div&gt;\n\n  &lt;!-- ============ UPDATES ============ --&gt;\n  &lt;div class=&quot;section-label&quot;&gt;&lt;span class=&quot;n&quot;&gt;05&lt;/span&gt;&lt;h2&gt;Updates&lt;/h2&gt;&lt;span class=&quot;rule&quot;&gt;&lt;/span&gt;\n    &lt;p&gt;The Register — accounts witnessed, inscriptions, notes, new work. A faint tick for unread, mono timestamps, a single hairline between days.&lt;/p&gt;\n  &lt;/div&gt;\n  &lt;div class=&quot;rail&quot; id=&quot;updatesRail&quot;&gt;&lt;/div&gt;\n\n  &lt;!-- ============ FACTION PAGE ============ --&gt;\n  &lt;div class=&quot;section-label&quot;&gt;&lt;span class=&quot;n&quot;&gt;06&lt;/span&gt;&lt;h2&gt;Faction page — Albescent&lt;/h2&gt;&lt;span class=&quot;rule&quot;&gt;&lt;/span&gt;\n    &lt;p&gt;The pre-join leaf: full Albescent hush — the mark, a Cormorant italic wordmark, the motto &lt;code style=&quot;color:#c8c4cd&quot;&gt;The work is the work&lt;/code&gt;, plain stat rules (Keepers · Open Work · Returned), &lt;code style=&quot;color:#c8c4cd&quot;&gt;Unranked · By design&lt;/code&gt; — while an unaffiliated viewer's chrome stays neutral. &lt;b style=&quot;color:#e9e6df&quot;&gt;Join the Order&lt;/b&gt; flips the whole app into this.&lt;/p&gt;\n  &lt;/div&gt;\n  &lt;div class=&quot;rail&quot; id=&quot;factionRail&quot;&gt;&lt;/div&gt;\n\n&lt;/div&gt;\n\n&lt;script&gt;\n/* ---------- icons ---------- */\nconst ICON = {\n  home:'&lt;svg viewBox=&quot;0 0 24 24&quot;&gt;&lt;path d=&quot;M4 11l8-6 8 6&quot;/&gt;&lt;path d=&quot;M6 10v9h12v-9&quot;/&gt;&lt;/svg&gt;',\n  tasks:'&lt;svg viewBox=&quot;0 0 24 24&quot;&gt;&lt;path d=&quot;M9 6h11M9 12h11M9 18h11&quot;/&gt;&lt;path d=&quot;M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2&quot;/&gt;&lt;/svg&gt;',\n  praxis:'&lt;svg viewBox=&quot;0 0 24 24&quot;&gt;&lt;path d=&quot;M12 4l2.3 4.9 5.2.7-3.8 3.6.9 5.3-4.6-2.6-4.6 2.6.9-5.3L5.5 9.6l5.2-.7z&quot;/&gt;&lt;/svg&gt;',\n  players:'&lt;svg viewBox=&quot;0 0 24 24&quot;&gt;&lt;circle cx=&quot;9&quot; cy=&quot;9&quot; r=&quot;3&quot;/&gt;&lt;path d=&quot;M4 19c0-2.8 2.2-5 5-5s5 2.2 5 5&quot;/&gt;&lt;path d=&quot;M16 7.5a3 3 0 010 5.4M15 14.6c2.3.5 4 2.3 4 4.4&quot;/&gt;&lt;/svg&gt;',\n  factions:'&lt;svg viewBox=&quot;0 0 24 24&quot;&gt;&lt;path d=&quot;M12 3l7 3v5c0 4.4-3 7.6-7 9-4-1.4-7-4.6-7-9V6z&quot;/&gt;&lt;/svg&gt;',\n  bell:'&lt;svg viewBox=&quot;0 0 24 24&quot; style=&quot;width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round&quot;&gt;&lt;path d=&quot;M6 9a6 6 0 1112 0c0 5 2 6 2 6H4s2-1 2-6&quot;/&gt;&lt;path d=&quot;M10 20a2 2 0 004 0&quot;/&gt;&lt;/svg&gt;',\n  search:'&lt;svg viewBox=&quot;0 0 24 24&quot; style=&quot;width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round&quot;&gt;&lt;circle cx=&quot;11&quot; cy=&quot;11&quot; r=&quot;6.5&quot;/&gt;&lt;path d=&quot;M20 20l-4.2-4.2&quot;/&gt;&lt;/svg&gt;'\n};\nconst TABS = [['home','Home'],['tasks','Tasks'],['praxis','Praxis'],['players','Players'],['factions','Factions']];\nfunction tabbar(active){ return TABS.map(([k,l],i)=&gt;`&lt;button class=&quot;tab&quot; aria-selected=&quot;${i===active}&quot; data-tab=&quot;${i}&quot;&gt;${ICON[k]}&lt;span class=&quot;l&quot;&gt;${l}&lt;/span&gt;&lt;/button&gt;`).join(''); }\n\n/* ---------- Albescent signature bits ---------- */\nfunction albMark(size){\n  size = size||20; const c=size/2, rO=size*.43, rI=size*.235, rD=size*.05, ts=rI+size*.03, te=ts+size*.14;\n  const tick=(deg)=&gt;{ const a=deg*Math.PI/180; return `&lt;line x1=&quot;${(c+ts*Math.cos(a)).toFixed(2)}&quot; y1=&quot;${(c+ts*Math.sin(a)).toFixed(2)}&quot; x2=&quot;${(c+te*Math.cos(a)).toFixed(2)}&quot; y2=&quot;${(c+te*Math.sin(a)).toFixed(2)}&quot; stroke=&quot;#1c1c1a&quot; stroke-width=&quot;${(size*.04).toFixed(2)}&quot;/&gt;`; };\n  return `&lt;svg width=&quot;${size}&quot; height=&quot;${size}&quot; viewBox=&quot;0 0 ${size} ${size}&quot; fill=&quot;none&quot; style=&quot;display:block&quot;&gt;&lt;circle cx=&quot;${c}&quot; cy=&quot;${c}&quot; r=&quot;${rO}&quot; stroke=&quot;#1c1c1a&quot; stroke-width=&quot;${(size*.022).toFixed(2)}&quot; opacity=&quot;.18&quot;/&gt;&lt;circle cx=&quot;${c}&quot; cy=&quot;${c}&quot; r=&quot;${rI}&quot; stroke=&quot;#1c1c1a&quot; stroke-width=&quot;${(size*.04).toFixed(2)}&quot; opacity=&quot;.5&quot;/&gt;${[0,90,180,270].map(tick).join('')}&lt;circle cx=&quot;${c}&quot; cy=&quot;${c}&quot; r=&quot;${rD.toFixed(2)}&quot; fill=&quot;#1c1c1a&quot;/&gt;&lt;/svg&gt;`;\n}\nfunction albMarkCenter(size){ return `&lt;div style=&quot;display:flex;justify-content:center&quot;&gt;${albMark(size)}&lt;/div&gt;`; }\n/* the Albescent witness circles (real AlbescentVote tiers) */\nfunction albVote(sel){\n  const tiers=[['Unseeing',1,.16],['Glimpsed',2,.30],['Witnessed',3,.48],['Verified',4,.66],['Inscribed',5,.84]];\n  return `&lt;div&gt;\n    &lt;div style=&quot;font-family:'Courier Prime',monospace;font-size:8px;letter-spacing:.26em;text-transform:uppercase;color:rgba(28,28,26,.22);text-align:center;margin-bottom:14px&quot;&gt;Bear Witness&lt;/div&gt;\n    &lt;div style=&quot;display:flex;gap:14px;flex-wrap:wrap;justify-content:center&quot;&gt;` + tiers.map(([lbl,v,pct])=&gt;{\n      const reached = sel&gt;=v, picked = sel===v; const ink=`rgba(28,28,26,${pct})`;\n      return `&lt;div style=&quot;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:44px&quot;&gt;\n        &lt;button style=&quot;width:32px;height:32px;border-radius:50%;padding:0;border:1.5px solid ${ink};background:${reached?ink:'transparent'};display:flex;align-items:center;justify-content:center&quot;&gt;${picked?'&lt;span style=&quot;width:8px;height:8px;border-radius:50%;background:#fff&quot;&gt;&lt;/span&gt;':''}&lt;/button&gt;\n        &lt;span style=&quot;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:9px;color:${reached?'#1c1c1a':'rgba(28,28,26,.4)'}&quot;&gt;${lbl}&lt;/span&gt;\n      &lt;/div&gt;`;\n    }).join('') + `&lt;/div&gt;&lt;/div&gt;`;\n}\n\n/* ---------- palette / helpers ---------- */\nconst FAC = { ua:'#c2541f', wow:'#ec5f99', snide:'#6fae00', ephemerists:'#1d6e72', singularity:'#2563eb', everymen:'#c1272d', albescent:'#8a8a86' };\nconst FACNAME = { ua:'UA', wow:'Wow', snide:'SNIDE', ephemerists:'Ephemerists', singularity:'Singularity', everymen:'Everymen', albescent:'Albescent' };\nconst AVC = ['#8a8a86','#6b6b66','#a0a09a','#57574f','#767670','#48483f'];\nfunction status(){ return `&lt;div class=&quot;statusbar&quot;&gt;&lt;span&gt;9:41&lt;/span&gt;&lt;span class=&quot;sig&quot;&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;span style=&quot;opacity:.55&quot;&gt;▮&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;`; }\nfunction appbar2(title,right){ return `&lt;div class=&quot;appbar&quot;&gt;&lt;div class=&quot;brand&quot;&gt;&lt;div class=&quot;brandmark&quot;&gt;&lt;/div&gt;&lt;div class=&quot;title-wrap&quot;&gt;&lt;div class=&quot;k&quot;&gt;Albescent&lt;/div&gt;&lt;div class=&quot;t&quot;&gt;${title}&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;${right||'&lt;span style=&quot;width:36px&quot;&gt;&lt;/span&gt;'}&lt;/div&gt;`; }\nfunction topbar(title,right){ return `&lt;div class=&quot;topbar&quot;&gt;&lt;div class=&quot;back&quot;&gt;‹&lt;/div&gt;&lt;div class=&quot;tt&quot;&gt;${title||''}&lt;/div&gt;${right||'&lt;span style=&quot;width:34px&quot;&gt;&lt;/span&gt;'}&lt;/div&gt;`; }\nconst searchBtn = `&lt;button class=&quot;iconbtn&quot;&gt;${ICON.search}&lt;/button&gt;`;\nconst moreBtn = `&lt;div class=&quot;back&quot; style=&quot;font-size:20px;line-height:0&quot;&gt;⋯&lt;/div&gt;`;\nfunction pav(bg,l,cls){ return `&lt;div class=&quot;pav${cls?' '+cls:''}&quot; style=&quot;background:#fff;color:#1c1c1a;border-radius:50%;border:1px solid rgba(28,28,26,.55);font-family:'Cormorant Garamond',serif;font-style:italic&quot;&gt;${l}&lt;/div&gt;`; }\nfunction sec(label,right){ return `&lt;div class=&quot;sechead&quot; style=&quot;margin:16px 2px 2px&quot;&gt;&lt;span class=&quot;k&quot; style=&quot;font-family:'Courier Prime',monospace;letter-spacing:.26em&quot;&gt;${label}&lt;/span&gt;&lt;span class=&quot;rule&quot;&gt;&lt;/span&gt;${right||''}&lt;/div&gt;`; }\nfunction albLevel(lv){ return `&lt;span style=&quot;font-family:'Courier Prime',monospace;font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:rgba(28,28,26,.34)&quot;&gt;Lvl ${lv}&lt;/span&gt;`; }\nfunction albPts(v){ return `&lt;span style=&quot;font-family:'Cormorant Garamond',serif;font-weight:300;font-size:15px;color:rgba(28,28,26,.6)&quot;&gt;${v}&lt;span style=&quot;font-family:'Courier Prime',monospace;font-size:8px;margin-left:3px;letter-spacing:.1em;text-transform:uppercase&quot;&gt;pts&lt;/span&gt;&lt;/span&gt;`; }\n\n/* ---------- HOME ---------- */\nconst VOICE = { charK:'Your record', tasksK:'Open work', link:'All', browse:'The Register', post:'File an Account', fac:'Albescent' };\nfunction home(){\n  const v = VOICE;\n  const activeTasks = [\n    { t:'A Very Human Thing', fac:'albescent', facName:'Albescent', pv:20, slots:'1 / 20', prog:35 },\n    { t:'Somewhere No One Needs To Be', fac:'ephemerists', facName:'Ephemerists', pv:15, slots:'3 slots', prog:null }\n  ];\n  const rows = activeTasks.map(t=&gt;`\n    &lt;div class=&quot;trow&quot; role=&quot;button&quot; tabindex=&quot;0&quot;&gt;\n      &lt;span class=&quot;dot&quot; style=&quot;background:${FAC[t.fac]}&quot;&gt;&lt;/span&gt;\n      &lt;div class=&quot;tmid&quot;&gt;\n        &lt;div class=&quot;tt&quot;&gt;${t.t}&lt;/div&gt;\n        &lt;div class=&quot;tm&quot;&gt;&lt;span class=&quot;fac&quot;&gt;${t.facName}&lt;/span&gt;&lt;span&gt;·&lt;/span&gt;&lt;span class=&quot;pv&quot;&gt;${t.pv} pts&lt;/span&gt;&lt;span&gt;·&lt;/span&gt;&lt;span&gt;${t.slots}&lt;/span&gt;&lt;/div&gt;\n        ${t.prog!=null?`&lt;div class=&quot;mini-bar&quot;&gt;&lt;i style=&quot;width:${t.prog}%&quot;&gt;&lt;/i&gt;&lt;/div&gt;`:''}\n      &lt;/div&gt;\n      &lt;span class=&quot;chev&quot;&gt;›&lt;/span&gt;\n    &lt;/div&gt;`).join('');\n  return `\n  ${status()}\n  &lt;div class=&quot;appbar&quot;&gt;\n    &lt;div class=&quot;brand&quot;&gt;&lt;div class=&quot;brandmark&quot;&gt;&lt;/div&gt;\n      &lt;div class=&quot;title-wrap&quot;&gt;&lt;div class=&quot;k&quot;&gt;Albescent&lt;/div&gt;&lt;div class=&quot;t&quot;&gt;FieldDesk&lt;/div&gt;&lt;/div&gt;\n    &lt;/div&gt;\n    &lt;button class=&quot;iconbtn&quot;&gt;${ICON.bell}&lt;/button&gt;\n  &lt;/div&gt;\n  &lt;div class=&quot;body&quot; style=&quot;gap:16px&quot;&gt;\n    &lt;section class=&quot;albcard&quot;&gt;\n      ${albMarkCenter(22)}\n      &lt;div class=&quot;alb-hair&quot; style=&quot;margin:14px 0 13px&quot;&gt;&lt;/div&gt;\n      &lt;div class=&quot;char-id&quot;&gt;\n        &lt;div class=&quot;ring&quot;&gt;&lt;div class=&quot;av&quot;&gt;M&lt;/div&gt;&lt;/div&gt;\n        &lt;div class=&quot;who&quot;&gt;\n          &lt;div class=&quot;name&quot;&gt;Molly &lt;span class=&quot;caret&quot;&gt;▾&lt;/span&gt;&lt;/div&gt;\n          &lt;div class=&quot;meta&quot;&gt;&lt;span style=&quot;color:rgba(28,28,26,.7)&quot;&gt;${v.fac}&lt;/span&gt; &lt;span class=&quot;sep&quot;&gt;·&lt;/span&gt; Unranked&lt;/div&gt;\n        &lt;/div&gt;\n        &lt;div class=&quot;pts&quot;&gt;&lt;b&gt;340&lt;/b&gt;&lt;span&gt;pts&lt;/span&gt;&lt;/div&gt;\n      &lt;/div&gt;\n      &lt;div class=&quot;stats&quot;&gt;\n        &lt;div class=&quot;stat&quot;&gt;&lt;b&gt;340&lt;/b&gt;&lt;span&gt;Points&lt;/span&gt;&lt;/div&gt;\n        &lt;div class=&quot;stat&quot;&gt;&lt;b&gt;12&lt;/b&gt;&lt;span&gt;Returned&lt;/span&gt;&lt;/div&gt;\n        &lt;div class=&quot;stat&quot;&gt;&lt;b&gt;III&lt;/b&gt;&lt;span&gt;Era&lt;/span&gt;&lt;/div&gt;\n      &lt;/div&gt;\n      &lt;div class=&quot;alb-hair&quot; style=&quot;margin:16px 0 12px&quot;&gt;&lt;/div&gt;\n      &lt;div class=&quot;sechead&quot;&gt;&lt;span class=&quot;k&quot; style=&quot;font-family:'Courier Prime',monospace;letter-spacing:.26em&quot;&gt;${v.charK}&lt;/span&gt;&lt;span class=&quot;rule&quot;&gt;&lt;/span&gt;&lt;span style=&quot;display:flex;gap:14px;flex:none&quot;&gt;&lt;a href=&quot;#&quot;&gt;Switch&lt;/a&gt;&lt;a href=&quot;#&quot;&gt;Edit&lt;/a&gt;&lt;/span&gt;&lt;/div&gt;\n    &lt;/section&gt;\n\n    &lt;section class=&quot;albcard&quot;&gt;\n      &lt;div class=&quot;alb-eyebrow&quot;&gt;${v.tasksK} · 2&lt;/div&gt;\n      &lt;div class=&quot;alb-hair&quot; style=&quot;margin:11px 0 4px&quot;&gt;&lt;/div&gt;\n      &lt;div class=&quot;tasks&quot;&gt;${rows}&lt;/div&gt;\n    &lt;/section&gt;\n\n    &lt;div class=&quot;actions&quot;&gt;\n      &lt;button class=&quot;btn primary&quot;&gt;${v.browse}&lt;/button&gt;\n      &lt;button class=&quot;btn ghost&quot;&gt;&lt;span class=&quot;plus&quot;&gt;+&lt;/span&gt; ${v.post}&lt;/button&gt;\n    &lt;/div&gt;\n  &lt;/div&gt;\n  &lt;div class=&quot;tabbar&quot;&gt;${tabbar(0)}&lt;/div&gt;`;\n}\n\n/* ---------- TASKS ---------- */\nconst TASKS = [\n  { t:'A Very Human Thing', fac:'albescent', desc:'Do something quietly kind for a stranger. Then set down, in plain words, exactly what was done — no more.', pv:20, lv:1, slots:'1 / 20' },\n  { t:'Somewhere No One Needs To Be', fac:'albescent', desc:'Attend a place with no purpose. Return a plain account of the nothing you found there.', pv:15, lv:2, slots:'3 slots' },\n  { t:'Knowledge Is Free', fac:'ephemerists', desc:'Teach a real skill to someone for free. The proof is their words, not yours.', pv:25, lv:2, slots:'5 / 12' },\n  { t:'Lacunae', fac:'singularity', desc:'Find a gap in a system everyone trusts, and set down the map of it.', pv:40, lv:3, slots:'2 / 6' }\n];\nfunction taskCard(t){\n  return `&lt;div class=&quot;albcard&quot;&gt;\n    ${albMarkCenter(20)}\n    &lt;div class=&quot;alb-hair&quot; style=&quot;margin:16px 0 13px&quot;&gt;&lt;/div&gt;\n    &lt;div class=&quot;alb-eyebrow&quot;&gt;Albescent&lt;/div&gt;\n    &lt;div class=&quot;alb-title&quot; style=&quot;margin:10px 0 11px&quot;&gt;${t.t}&lt;/div&gt;\n    &lt;div class=&quot;alb-desc&quot; style=&quot;margin-bottom:16px&quot;&gt;${t.desc}&lt;/div&gt;\n    &lt;button class=&quot;alb-link&quot; style=&quot;margin-bottom:14px&quot;&gt;acknowledge&lt;/button&gt;\n    &lt;div class=&quot;alb-hair&quot; style=&quot;margin-bottom:11px&quot;&gt;&lt;/div&gt;\n    &lt;div style=&quot;display:flex;justify-content:space-between;align-items:center&quot;&gt;${albLevel(t.lv)}${albPts(t.pv)}&lt;/div&gt;\n  &lt;/div&gt;`;\n}\nfunction tasksBrowse(){\n  return status() + appbar2('Tasks', searchBtn) +\n  `&lt;div class=&quot;body&quot; style=&quot;gap:16px&quot;&gt;\n    &lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip2 on&quot;&gt;All&lt;/span&gt;&lt;span class=&quot;chip2&quot;&gt;Solo&lt;/span&gt;&lt;span class=&quot;chip2&quot;&gt;Concord&lt;/span&gt;&lt;span class=&quot;chip2&quot;&gt;Open&lt;/span&gt;&lt;span class=&quot;sortbtn&quot;&gt;⇅ Sort&lt;/span&gt;&lt;/div&gt;\n    ${TASKS.map(taskCard).join('')}\n  &lt;/div&gt;` + `&lt;div class=&quot;tabbar&quot;&gt;${tabbar(1)}&lt;/div&gt;`;\n}\nfunction taskDetail(){\n  const proofs = [ { a:'Wren', av:AVC[1], r:5 }, { a:'Ida', av:AVC[3], r:4 }, { a:'Bo', av:AVC[5], r:4 } ];\n  return status() + topbar('', moreBtn) +\n  `&lt;div class=&quot;body&quot; style=&quot;padding-top:0;gap:14px&quot;&gt;\n    &lt;div class=&quot;albcard&quot; style=&quot;margin-top:6px&quot;&gt;\n      ${albMarkCenter(24)}\n      &lt;div class=&quot;alb-hair&quot; style=&quot;margin:16px 0 13px&quot;&gt;&lt;/div&gt;\n      &lt;div class=&quot;alb-eyebrow&quot;&gt;Albescent · Open work&lt;/div&gt;\n      &lt;div class=&quot;alb-title&quot; style=&quot;font-size:24px;margin:10px 0 14px&quot;&gt;A Very Human Thing&lt;/div&gt;\n      &lt;div class=&quot;alb-hair&quot; style=&quot;margin-bottom:11px&quot;&gt;&lt;/div&gt;\n      &lt;div s ot; style=&quot;background:#fff;color:#1c1c1a;border:1px solid rgba(28,28,26,.5);font-family:'Cormorant Garamond',serif;font-style:italic&quot;&gt;W&lt;/div&gt;&lt;div class=&quot;cb&quot;&gt;&lt;div class=&quot;cn&quot;&gt;Wren &lt;span style=&quot;color:var(--text-3);font-weight:400&quot;&gt;· 3d&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ct&quot;&gt;The work is the work. Nothing to add.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;\n  &lt;/div&gt;\n  &lt;div class=&quot;sticky-cta&quot;&gt;&lt;button class=&quot;btn primary&quot; style=&quot;flex:1&quot;&gt;Acknowledge this work&lt;/button&gt;&lt;/div&gt;`;\n}\n\n/* ---------- PRAXIS ---------- */\nconst PROOFS = [\n  { a:'Wren', av:AVC[1], fac:'albescent', t:'Carried her groceries up four floors', r:5, v:190, c:22, time:'2h' },\n  { a:'Ida', av:AVC[3], fac:'albescent', t:'Sat with the empty lot for an hour', r:4, v:151, c:18, time:'6h' },\n  { a:'Bo', av:AVC[5], fac:null, t:'Repaired a chair, said nothing of it', r:4, v:77, c:9, time:'1d' }\n];\nfunction proofCard(p){\n  return `&lt;div class=&quot;pcard&quot; style=&quot;background:none;border:0;box-shadow:none;overflow:visible&quot;&gt;\n    &lt;div class=&quot;pcard-head&quot; style=&quot;padding:0 0 10px&quot;&gt;${pav(p.av,p.a[0])}&lt;div&gt;&lt;div class=&quot;nm&quot;&gt;${p.a}&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;span style=&quot;color:${p.fac?FAC[p.fac]:'var(--text-3)'}&quot;&gt;●&lt;/span&gt; ${p.fac?'Albescent':'Unaffiliated'} · ${p.time} ago&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;\n    &lt;div class=&quot;albcard&quot; style=&quot;padding:16px 16px 16px&quot;&gt;\n      &lt;div class=&quot;media&quot; style=&quot;height:150px;border:1px solid rgba(28,28,26,.1);background:#faf9f7&quot;&gt;PLATE&lt;/div&gt;\n      &lt;div class=&quot;alb-title&quot; style=&quot;font-size:17px;margin:14px 0 12px&quot;&gt;${p.t}&lt;/div&gt;\n      &lt;div class=&quot;alb-hair&quot; style=&quot;margin-bottom:11px&quot;&gt;&lt;/div&gt;\n      &lt;div style=&quot;display:flex w);font-weight:700}\n.forrow{display:flex;align-items:center;justify-content:space-between;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--btn-radius);padding:11px 13px;font-size:11px;letter-spacing:.06em;color:var(--text-2)}\n.forrow b{font-family:var(--headline);font-style:var(--headline-style);color:var(--text-1);letter-spacing:0;font-size:13px}\n.ta{width:100%;min-height:120px;background:var(--surface);border:1px solid var(--border-2);border-radius:var(--btn-radius);padding:13px;font-family:var(--label-font);font-size:14px;line-height:1.55;color:var(--text-1);resize:none;outline:none;white-space:pre-wrap}\n.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}\n.mgrid .media{aspect-ratio:1}\n.madd{aspect-ratio:1;border:1.5px dashed var(--border-2);border-radius:var(--tile-radius);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--text-2);font-size:22px;cursor:pointer}\n.madd small{font-size:8px;letter-spacing:.12em;text-transform:uppercase}\n.kbd-acc{display:flex;gap:16px;padding:11px 18px;border-top:1px solid var(--border);background:var(--surface-2);color:var(--text-2);font-family:var(--label-font);font-size:16px;align-items:center;flex:none}\n.kbd-acc .ph{margin-left:auto;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}\n.screen[data-treatment=&quot;na&quot;][data-theme=&quot;light&quot;] .kbd-acc .ph{color:#c2541f}\n.kbd{height:172px;background:linear-gradient(180deg,var(--surface-2),var(--bg-page));border-top:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text-3);font-size:9px;letter-spacing:.24em;text-transform:uppercase;flex:none}\n.mdprev h3{font-family:var(--headline);font-style:var(--headline-style);font-weight:var(--headline-weight);font-size:17px;margin:0 0 7px;color:var(--text-1)}\n.mdprev p{font-size:14px;line-height:1.6;color:var(--text-2);margin:0 0 11px}\n.mdprev li{font-size:14px;line-height:1.55;color:var(--text-2);margin-left:18px}\n/* ---- settings ---- */\n.setrow{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--border);cursor:pointer}\n.setrow .si{width:32px;height:32px;border-radius:9px;background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text-2);flex:none;font-size:14px}\n.screen[data-treatment=&quot;everymen&quot;] .setrow .si{border-radius:4px}\n.setrow .sl{flex:1;font-size:14px;color:var(--text-1);font-family:var(--label-font)}\n.setrow .sv{font-size:11px;color:var(--text-3);letter-spacing:.04em}\n.toggle{width:42px;height:24px;border-radius:999px;background:var(--accent);position:relative;flex:none}\n.screen[data-treatment=&quot;na&quot;][data-theme=&quot;light&quot;] .toggle{background:#c2541f}\n.toggle.off{background:var(--border-2)}\n.toggle i{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3)}\n.toggle.off i{right:auto;left:2px}\n/* ---- search ---- */\n.searchbar{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--border-2);border-radius:999px;padding:11px 15px;color:var(--text-2);font-size:14px;font-family:var(--label-font)}\n.sug{display:flex;align-items:center;gap:11px;padding:12px 4px;border-bottom:1px solid var(--border);font-size:13px;color:var(--text-1)}\n.sug .sk{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);margin-left:auto}\n/* ---- level up ---- */\n.lu-scrim{position:absolute;inset:0;background:rgba(10,8,14,.72);z-index:5;display:flex;align-items:center;justify-content:center;border-radius:36px;overflow:hidden}\n.lu-card{width:78%;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:26px 20px;text-align:center;position:relative;z-index:2;box-shadow:0 20px 50px rgba(0,0,0,.5)}\n.lu-burst{width:88px;height:88px;border-radius:50%;margin:0 auto 15px;background:var(--ring);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(0,0,0,.3)}\n.lu-burst b{font-family:var(--headline);font-style:var(--headline-style);font-size:36px;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.35)}\n.lu-card h3{font-family:var(--headline);font-style:var(--headline-style);font-weight:var(--headline-weight);font-size:24px;margin:0 0 6px;color:var(--text-1)}\n.lu-card p{font-size:13px;line-height:1.5;color:var(--text-2);margin:0 0 18px}\n.confetti{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}\n.confetti i{position:absolute;width:8px;height:9px;border-radius:2px;top:-14px;animation:cfall linear infinite}\n@keyframes cfall{to{transform:translateY(620px) rotate(420deg)}}\n/* ---- sticky CTA (detail screens) ---- */\n.sticky-cta{padding:12px 16px 22px;background:var(--nav-bg);backdrop-filter:blur(12px);border-top:1px solid var(--border);display:flex;gap:10px;flex:none;align-items:center}\n\n@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}\n&lt;/style&gt;\n&lt;/head&gt;\n&lt;body&gt;\n&lt;template id=&quot;__bundler_thumbnail&quot;&gt;\n&lt;svg viewBox=&quot;0 0 400 400&quot; xmlns=&quot;http://www.w3.org/2000/svg&quot;&gt;\n  &lt;rect width=&quot;400&quot; height=&quot;400&quot; fill=&quot;#ddceac&quot;/&gt;\n  &lt;rect x=&quot;116&quot; y=&quot;90&quot; width=&quot;168&quot; height=&quot;230&quot; fill=&quot;#ece1c6&quot; stroke=&quot;#221a12&quot; stroke-width=&quot;2&quot;/&gt;\n  &lt;rect x=&quot;122&quot; y=&quot;96&quot; width=&quot;156&quot; height=&quot;6&quot; fill=&quot;#221a12&quot;/&gt;\n  &lt;rect x=&quot;116&quot; y=&quot;112&quot; width=&quot;168&quot; height=&quot;26&quot; fill=&quot;#c1272d&quot;/&gt;\n  &lt;rect x=&quot;116&quot; y=&quot;138&quot; width=&quot;168&quot; height=&quot;3&quot; fill=&quot;#d99a2b&quot;/&gt;\n  &lt;text x=&quot;200&quot; y=&quot;131&quot; font-family=&quot;Impact,sans-serif&quot; font-size=&quot;16&quot; letter-spacing=&quot;2&quot; fill=&quot;#f5ecd6&quot; text-anchor=&quot;middle&quot;&gt;THE EVERYMEN&lt;/text&gt;\n  &lt;text x=&quot;200&quot; y=&quot;180&quot; font-family=&quot;Impact,sans-serif&quot; font-size=&quot;26&quot; fill=&quot;#221a12&quot; text-anchor=&quot;middle&quot;&gt;A VERY&lt;/text&gt;\n  &lt;text x=&quot;200&quot; y=&quot;206&quot; font-family=&quot;Impact,sans-serif&quot; font-size=&quot;26&quot; fill=&quot;#221a12&quot; text-anchor=&quot;middle&quot;&gt;HUMAN THING&lt;/text&gt;\n  &lt;path d=&quot;M150 224 h40 l8 6 l8 -6 h40&quot; stroke=&quot;#c1272d&quot; stroke-width=&quot;1.5&quot; fill=&quot;none&quot;/&gt;\n  &lt;circle cx=&quot;248&quot; cy=&quot;270&quot; r=&quot;18&quot; fill=&quot;none&quot; stroke=&quot;#c1272d&quot; stroke-width=&quot;2&quot;/&gt;\n  &lt;text x=&quot;248&quot; y=&quot;275&quot; font-family=&quot;Impact,sans-serif&quot; font-size=&quot;13&quot; fill=&quot;#c1272d&quot; text-anchor=&quot;middle&quot;&gt;20&lt;/text&gt;\n&lt;/svg&gt;\n&lt;/template&gt;\n&lt;div class=&quot;board&quot;&gt;\n\n  &lt;header class=&quot;board-head&quot;&gt;\n    &lt;p class=&quot;eyebrow&quot;&gt;World Zero · Everymen — the union broadsheet&lt;/p&gt;\n    &lt;h1&gt;The Everymen upgrade: the whole app printed like a union hall's work bulletin.&lt;/h1&gt;\n    &lt;p&gt;Same 375px layout, same markup — now wearing the Everymen's real broadsheet idiom, not just amber paint. Cards become &lt;b style=&quot;color:#e9e6df&quot;&gt;printed plates&lt;/b&gt; on paper (&lt;code style=&quot;color:#c8c4cd&quot;&gt;--everymen-paper&lt;/code&gt; #ece1c6) inside a doubled ink rule, each headed by a red &lt;b style=&quot;color:#e9e6df&quot;&gt;masthead&lt;/b&gt; (&lt;code style=&quot;color:#c8c4cd&quot;&gt;--everymen-red&lt;/code&gt;) with a gold underline (&lt;code style=&quot;color:#c8c4cd&quot;&gt;--everymen-gold&lt;/code&gt;) and cog marks, a dateline, headlines set BIG in &lt;b style=&quot;color:#e9e6df&quot;&gt;Bebas Neue&lt;/b&gt; (&lt;code style=&quot;color:#c8c4cd&quot;&gt;--font-accent&lt;/code&gt;) over halftone and sunburst, a rule-diamond divider, and a rubber &lt;b style=&quot;color:#e9e6df&quot;&gt;points seal&lt;/b&gt;. Body copy stays Special Elite typewriter. Nothing invented — all &lt;code style=&quot;color:#c8c4cd&quot;&gt;--everymen-*&lt;/code&gt;. Native mode: light.&lt;/p&gt;\n    &lt;span class=&quot;stage&quot;&gt;Everymen (union broadsheet) · mastheads + halftone · Bebas + Special Elite · native light&lt;/span&gt;\n  &lt;/header&gt;\n\n  &lt;!-- ============ THE IDIOM ============ --&gt;\n  &lt;div class=&quot;section-label&quot;&gt;&lt;span class=&quot;n&quot;&gt;01&lt;/span&gt;&lt;h2&gt;The idiom&lt;/h2&gt;&lt;span class=&quot;rule&quot;&gt;&lt;/span&gt;\n    &lt;p&gt;The Everymen's signature is the &lt;b style=&quot;color:#e9e6df&quot;&gt;printed plate&lt;/b&gt; — lifted from the real EverymenTaskCard: red masthead + cog marks, a Bebas headline over halftone, a rule-diamond, a rubber points seal, an ink “report for duty” bar. Anatomy, then the press kit.&lt;/p&gt;\n  &lt;/div&gt;\n\n  &lt;div class=&quot;grid&quot; style=&quot;grid-template-columns:1fr 1fr&quot;&gt;\n    &lt;div class=&quot;spec&quot;&gt;\n      &lt;h3&gt;Printed-plate anatomy&lt;/h3&gt;\n      &lt;p class=&quot;sub&quot;&gt;Doubled ink rule → red masthead (cog · THE EVERYMEN · cog) → dateline → Bebas headline on halftone → rule-diamond → typewriter body → level + PTS + points seal → ink duty bar.&lt;/p&gt;\n      &lt;div id=&quot;anatomy&quot; style=&quot;max-width:230px&quot;&gt;&lt;/div&gt;\n    &lt;/div&gt;\n    &lt;div class=&quot;spec&quot;&gt;\n      &lt;h3&gt;Press kit&lt;/h3&gt;\n      &lt;p class=&quot;sub&quot;&gt;The pieces every Everymen surface is built from — the masthead + cog, the rule-diamond, the rubber points seal, and the stamp verdict (the Everymen vote).&lt;/p&gt;\n      &lt;div id=&quot;evkit&quot; style=&quot;padding:18px 14px 12px;background:#ddceac;border-radius:3px;margin-top:8px&quot;&gt;&lt;/div&gt;\n      &lt;p class=&quot;pattern-note&quot; style=&quot;margin-top:12px&quot;&gt;&lt;b&gt;Masthead&lt;/b&gt; red bar, gold rule, cog marks · &lt;b&gt;Rule-diamond&lt;/b&gt; ◆ between hairlines · &lt;b&gt;Seal&lt;/b&gt; rubber PTS stamp · &lt;b&gt;Verdict&lt;/b&gt; five stamps, a start → legendary.&lt;/p&gt;\n    &lt;/div&gt;\n  &lt;/div&gt;\n\n  &lt;!-- ============ HOME ============ --&gt;\n  &lt;div class=&quot;section-label&quot;&gt;&lt;span class=&quot;n&quot;&gt;02&lt;/span&gt;&lt;h2&gt;FieldDesk — Home&lt;/h2&gt;&lt;span class=&quot;rule&quot;&gt;&lt;/span&gt;\n    &lt;p&gt;Your member file and open work orders, each a printed plate on a paper desk. Actions keep their one-hand spot; the primary is the ink duty bar.&lt;/p&gt;\n  &lt;/div&gt;\n  &lt;div class=&quot;rail&quot; id=&quot;homeRail&quot;&gt;&lt;/div&gt;\n\n  &lt;!-- ============ TASKS ============ --&gt;\n  &lt;div class=&quot;section-label&quot;&gt;&lt;span class=&quot;n&quot;&gt;03&lt;/span&gt;&lt;h2&gt;Tasks&lt;/h2&gt;&lt;span class=&quot;rule&quot;&gt;&lt;/span&gt;\n    &lt;p&gt;Every task is a work order — masthead, dateline, Bebas headline, points seal. Detail keeps the sticky report-for-duty bar, filed reports and the hall's notes below.&lt;/p&gt;\n  &lt;/div&gt;\n  &lt;div class=&quot;rail&quot; id=&quot;tasksRail&quot;&gt;&lt;/div&gt;\n\n  &lt;!-- ============ PRAXIS ============ --&gt;\n  &lt;div class=&quot;section-label&quot;&gt;&lt;span class=&quot;n&quot;&gt;04&lt;/span&gt;&lt;h2&gt;Praxis&lt;/h2&gt;&lt;span class=&quot;rule&quot;&gt;&lt;/span&gt;\n    &lt;p&gt;The work report: the photo plated into the broadsheet, a Bebas headline, the stamp verdict. Detail has the full verdict; the composer keeps Write / Preview and the media grid.&lt;/p&gt;\n  &lt;/div&gt;\n  &lt;div class=&quot;rail&quot; id=&quot;praxisRail&quot;&gt;&lt;/div&gt;\n\n  &lt;!-- ============ UPDATES ============ --&gt;\n  &lt;div class=&quot;section-label&quot;&gt;&lt;span class=&quot;n&quot;&gt;05&lt;/span&gt;&lt;h2&gt;Updates&lt;/h2&gt;&lt;span class=&quot;rule&quot;&gt;&lt;/span&gt;\n    &lt;p&gt;The Bulletin — verdicts stamped, promotions, notes, new work orders. A red mark for unread, typewriter datelines, a printed rule between days.&lt;/p&gt;\n  &lt;/div&gt;\n  &lt;div class=&quot;rail&quot; id=&quot;updatesRail&quot;&gt;&lt;/div&gt;\n\n  &lt;!-- ============ FACTION PAGE ============ --&gt;\n  &lt;div class=&quot;section-label&quot;&gt;&lt;span class=&quot;n&quot;&gt;06&lt;/span&gt;&lt;h2&gt;Faction page — Everymen&lt;/h2&gt;&lt;span class=&quot;rule&quot;&gt;&lt;/span&gt;\n    &lt;p&gt;The pre-join front page: full Everymen dress — a giant masthead, a dateline, the motto &lt;code style=&quot;color:#c8c4cd&quot;&gt;THE WORK OUTLASTS THE WORKER&lt;/code&gt;, columned stat counts — while an unaffiliated viewer's chrome stays neutral. &lt;b style=&quot;color:#e9e6df&quot;&gt;Report for duty&lt;/b&gt; flips the whole app into this.&lt;/p&gt;\n  &lt;/div&gt;\n  &lt;div class=&quot;rail&quot; id=&quot;factionRail&quot;&gt;&lt;/div&gt;\n\n&lt;/div&gt;\n\n&lt;script&gt;\n/* ---------- icons ---------- */\nconst ICON = {\n  home:'&lt;svg viewBox=&quot;0 0 24 24&quot;&gt;&lt;path d=&quot;M4 11l8-6 8 6&quot;/&gt;&lt;path d=&quot;M6 10v9h12v-9&quot;/&gt;&lt;/svg&gt;',\n  tasks:'&lt;svg viewBox=&quot;0 0 24 24&quot;&gt;&lt;path d=&quot;M9 6h11M9 12h11M9 18h11&quot;/&gt;&lt;path d=&quot;M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2&quot;/&gt;&lt;/svg&gt;',\n  praxis:'&lt;svg viewBox=&quot;0 0 24 24&quot;&gt;&lt;path d=&quot;M12 4l2.3 4.9 5.2.7-3.8 3.6.9 5.3-4.6-2.6-4.6 2.6.9-5.3L5.5 9.6l5.2-.7z&quot;/&gt;&lt;/svg&gt;',\n  players:'&lt;svg viewBox=&quot;0 0 24 24&quot;&gt;&lt;circle cx=&quot;9&quot; cy=&quot;9&quot; r=&quot;3&quot;/&gt;&lt;path d=&quot;M4 19c0-2.8 2.2-5 5-5s5 2.2 5 5&quot;/&gt;&lt;path d=&quot;M16 7.5a3 3 0 010 5.4M15 14.6c2.3.5 4 2.3 4 4.4&quot;/&gt;&lt;/svg&gt;',\n  factions:'&lt;svg viewBox=&quot;0 0 24 24&quot;&gt;&lt;path d=&quot;M12 3l7 3v5c0 4.4-3 7.6-7 9-4-1.4-7-4.6-7-9V6z&quot;/&gt;&lt;/svg&gt;',\n  bell:'&lt;svg viewBox=&quot;0 0 24 24&quot; style=&quot;width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round&quot;&gt;&lt;path d=&quot;M6 9a6 6 0 1112 0c0 5 2 6 2 6H4s2-1 2-6&quot;/&gt;&lt;path d=&quot;M10 20a2 2 0 004 0&quot;/&gt;&lt;/svg&gt;',\n  search:'&lt;svg viewBox=&quot;0 0 24 24&quot; style=&quot;width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round&quot;&gt;&lt;circle cx=&quot;11&quot; cy=&quot;11&quot; r=&quot;6.5&quot;/&gt;&lt;path d=&quot;M20 20l-4.2-4.2&quot;/&gt;&lt;/svg&gt;'\n};\nconst TABS = [['home','Home'],['tasks','Tasks'],['praxis','Praxis'],['players','Players'],['factions','Factions']];\nfunction tabbar(active){ return TABS.map(([k,l],i)=&gt;`&lt;button class=&quot;tab&quot; aria-selected=&quot;${i===active}&quot; data-tab=&quot;${i}&quot;&gt;${ICON[k]}&lt;span class=&quot;l&quot;&gt;${l}&lt;/span&gt;&lt;/button&gt;`).join(''); }\n\n/* ---------- Everymen signature bits ---------- */\nfunction cog(size,col){\n  size = size||11; col = col||'#f5ecd6'; const c=size/2;\n  let teeth='';\n  for(let i=0;i&lt;8;i++){ const a=i*45*Math.PI/180; teeth+=`&lt;rect x=&quot;${(c-1).toFixed(1)}&quot; y=&quot;0&quot; width=&quot;2&quot; height=&quot;${(size*0.28).toFixed(1)}&quot; fill=&quot;${col}&quot; transform=&quot;rotate(${i*45} ${c} ${c})&quot;/&gt;`; }\n  return `&lt;svg width=&quot;${size}&quot; height=&quot;${size}&quot; viewBox=&quot;0 0 ${size} ${size}&quot; style=&quot;display:inline-block;vertical-align:middle&quot;&gt;${teeth}&lt;circle cx=&quot;${c}&quot; cy=&quot;${c}&quot; r=&quot;${(size*0.3).toFixed(1)}&quot; fill=&quot;none&quot; stroke=&quot;${col}&quot; stroke-width=&quot;1.6&quot;/&gt;&lt;/svg&gt;`;\n}\nfunction masthead(sub){ return `&lt;div class=&quot;ev-masthead&quot;&gt;${cog(11)}&lt;span&gt;THE EVERYMEN&lt;/span&gt;${cog(11)}&lt;/div&gt;&lt;div class=&quot;ev-dateline&quot;&gt;${sub}&lt;/div&gt;`; }\nfunction ruleDiamond(){ return `&lt;div class=&quot;ev-rulediamond&quot;&gt;&lt;span&gt;◆&lt;/span&gt;&lt;/div&gt;`; }\nfunction seal(pts){ return `&lt;div class=&quot;ev-seal&quot;&gt;&lt;b&gt;${pts}&lt;/b&gt;&lt;span&gt;PTS&lt;/span&gt;&lt;/div&gt;`; }\n/* the Everymen stamp verdict (real EverymenVote tiers) */\nfunction evVote(sel){\n  const tiers=[['a start',1,-4],['solid',2,3],['good',3,-2],['excellent',4,4],['legendary',5,-3]];\n  return `&lt;div&gt;\n    &lt;div style=&quot;font-family:'Special Elite',monospace;font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:#6c5a40;text-align:center;margin-bottom:12px&quot;&gt;Deliver your verdict&lt;/div&gt;\n    &lt;div style=&quot;display:flex;gap:8px;flex-wrap:wrap;justify-content:center&quot;&gt;` + tiers.map(([lbl,v,rot])=&gt;{\n      const reached = sel&gt;=v, picked=sel===v;\n      return `&lt;div style=&quot;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:52px&quot;&gt;\n        &lt;div style=&quot;border:2px solid #c1272d;border-radius:3px;padding:5px 8px;transform:rotate(${rot}deg) scale(${picked?1.08:1});background:${reached?'#c1272d':'transparent'};color:${reached?'#f5ecd6':'#c1272d'};font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:.05em;box-shadow:${reached?'2px 2px 0 rgba(34,26,18,.25)':'none'}&quot;&gt;${lbl}&lt;/div&gt;\n      &lt;/div&gt;`;\n    }).join('') + `&lt;/div&gt;&lt;/div&gt;`;\n}\n\n/* ---------- palette / helpers ---------- */\nconst FAC = { ua:'#c2541f', wow:'#ec5f99', snide:'#6fae00', ephemerists:'#1d6e72', singularity:'#2563eb', everymen:'#c1272d', albescent:'#8a8a86' };\nconst FACNAME = { ua:'UA', wow:'Wow', snide:'SNIDE', ephemerists:'Ephemerists', singularity:'Singularity', everymen:'Everymen', albescent:'Albescent' };\nconst AVC = ['#c1272d','#a9741a','#6c5a40','#7c8646','#b0574f','#8a5a2a'];\nfunction status(){ return `&lt;div class=&quot;statusbar&quot;&gt;&lt;span&gt;9:41&lt;/span&gt;&lt;span class=&quot;sig&quot;&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;span style=&quot;opacity:.55&quot;&gt;▮&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;`; }\nfunction appbar2(title,right){ return `&lt;div class=&quot;appbar&quot;&gt;&lt;div class=&quot;brand&quot;&gt;&lt;div class=&quot;brandmark&quot;&gt;&lt;/div&gt;&lt;div class=&quot;title-wrap&quot;&gt;&lt;div class=&quot;k&quot;&gt;Local 0&lt;/div&gt;&lt;div class=&quot;t&quot;&gt;${title}&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;${right||'&lt;span style=&quot;width:36px&quot;&gt;&lt;/span&gt;'}&lt;/div&gt;`; }\nfunction topbar(title,right){ return `&lt;div class=&quot;topbar&quot;&gt;&lt;div class=&quot;back&quot;&gt;‹&lt;/div&gt;&lt;div class=&quot;tt&quot;&gt;${title||''}&lt;/div&gt;${right||'&lt;span style=&quot;width:34px&quot;&gt;&lt;/span&gt;'}&lt;/div&gt;`; }\nconst searchBtn = `&lt;button class=&quot;iconbtn&quot;&gt;${ICON.search}&lt;/button&gt;`;\nconst moreBtn = `&lt;div class=&quot;back&quot; style=&quot;font-size:20px;line-height:0&quot;&gt;⋯&lt;/div&gt;`;\nfunction pav(bg,l,cls){ return `&lt;div class=&quot;pav${cls?' '+cls:''}&quot; style=&quot;background:${bg};color:#ece1c6;border-radius:2px;font-family:'Bebas Neue',sans-serif&quot;&gt;${l}&lt;/div&gt;`; }\nfunction diffDots(d){ return `&lt;span class=&quot;diff&quot;&gt;${[1,2,3].map(x=&gt;`&lt;i class=&quot;${x&lt;=d?'on':''}&quot;&gt;&lt;/i&gt;`).join('')}&lt;/span&gt;`; }\nfunction sec(label,right){ return `&lt;div class=&quot;sechead&quot; style=&quot;margin:14px 2px 2px&quot;&gt;&lt;span class=&quot;k&quot;&gt;${label}&lt;/span&gt;&lt;span class=&quot;rule&quot;&gt;&lt;/span&gt;${right||''}&lt;/div&gt;`; }\nfunction levelPill(n){ return `&lt;span style=&quot;display:inline-flex;align-items:center;font-family:'Special Elite',monospace;font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:#221a12;border:1px solid #221a12;padding:2px 8px&quot;&gt;lvl ${n}&lt;/span&gt;`; }\nfunction evStars(n){ let s=''; for(let i=1;i&lt;=5;i++) s+=`&lt;span style=&quot;color:${i&lt;=n?'#c1272d':'#c3b48c'}&quot;&gt;★&lt;/span&gt;`; return `&lt;span style=&quot;font-size:13px&quot;&gt;${s}&lt;/span&gt;`; }\n\n/* ---------- HOME ---------- */\nconst VOICE = { charK:'Member file', tasksK:'Work orders', link:'Logbook', browse:'Browse Work Orders', post:'File a Report', fac:'Everymen' };\nfunction home(){\n  const v = VOICE;\n  const activeTasks = [\n    { t:'A Very Human Thing', fac:'everymen', facName:'Everymen', pv:20, slots:'1 / 20', prog:36 },\n    { t:'Let Him (or Her) Cook', fac:'wow', facName:'Wow', pv:30, slots:'Open', prog:null }\n  ];\n  const rows = activeTasks.map(t=&gt;`\n    &lt;div class=&quot;trow&quot; role=&quot;button&quot; tabindex=&quot;0&quot;&gt;\n      &lt;span class=&quot;dot&quot; style=&quot;background:${FAC[t.fac]}&quot;&gt;&lt;/span&gt;\n      &lt;div class=&quot;tmid&quot;&gt;\n        &lt;div class=&quot;tt&quot;&gt;${t.t}&lt;/div&gt;\n        &lt;div class=&quot;tm&quot;&gt;&lt;span class=&quot;fac&quot;&gt;${t.facName}&lt;/span&gt;&lt;span&gt;·&lt;/span&gt;&lt;span class=&quot;pv&quot;&gt;+${t.pv} PTS&lt;/span&gt;&lt;span&gt;·&lt;/span&gt;&lt;span&gt;${t.slots}&lt;/span&gt;&lt;/div&gt;\n        ${t.prog!=null?`&lt;div class=&quot;mini-bar&quot;&gt;&lt;i style=&quot;width:${t.prog}%&quot;&gt;&lt;/i&gt;&lt;/div&gt;`:''}\n      &lt;/div&gt;\n      &lt;span class=&quot;chev&quot;&gt;›&lt;/span&gt;\n    &lt;/div&gt;`).join('');\n  return `\n  ${status()}\n  &lt;div class=&quot;appbar&quot;&gt;\n    &lt;div class=&quot;brand&quot;&gt;&lt;div class=&quot;brandmark&quot;&gt;&lt;/div&gt;\n      &lt;div class=&quot;title-wrap&quot;&gt;&lt;div class=&quot;k&quot;&gt;Local 0&lt;/div&gt;&lt;div class=&quot;t&quot;&gt;FieldDesk&lt;/div&gt;&lt;/div&gt;\n    &lt;/div&gt;\n    &lt;button class=&quot;iconbtn&quot;&gt;${ICON.bell}&lt;/button&gt;\n  &lt;/div&gt;\n  &lt;div class=&quot;body&quot;&gt;\n    &lt;section class=&quot;evcard&quot;&gt;\n      ${masthead('Member File · Era III')}\n      &lt;div class=&quot;ev-body&quot;&gt;\n        &lt;span class=&quot;ev-halftone&quot;&gt;&lt;/span&gt;\n        &lt;div style=&quot;position:relative;z-index:2&quot;&gt;\n          &lt;div class=&quot;char-id&quot;&gt;\n            &lt;div class=&quot;ring&quot;&gt;&lt;div class=&quot;av&quot;&gt;M&lt;/div&gt;&lt;/div&gt;\n            &lt;div class=&quot;who&quot;&gt;\n              &lt;div class=&quot;name&quot;&gt;Molly &lt;span class=&quot;caret&quot;&gt;▾&lt;/span&gt;&lt;/div&gt;\n              &lt;div class=&quot;meta&quot;&gt;&lt;span style=&quot;color:#c1272d&quot;&gt;${v.fac}&lt;/span&gt; &lt;span class=&quot;sep&quot;&gt;·&lt;/span&gt; Card-carrying · Lv 4&lt;/div&gt;\n            &lt;/div&gt;\n            &lt;div class=&quot;pts&quot;&gt;&lt;b&gt;340&lt;/b&gt;&lt;span&gt;PTS&lt;/span&gt;&lt;/div&gt;\n          &lt;/div&gt;\n          &lt;div class=&quot;stats&quot;&gt;\n            &lt;div class=&quot;stat&quot;&gt;&lt;b&gt;340&lt;/b&gt;&lt;span&gt;Points&lt;/span&gt;&lt;/div&gt;\n            &lt;div class=&quot;stat&quot;&gt;&lt;b&gt;12&lt;/b&gt;&lt;span&gt;Verdicts&lt;/span&gt;&lt;/div&gt;\n            &lt;div class=&quot;stat&quot;&gt;&lt;b&gt;III&lt;/b&gt;&lt;span&gt;Era&lt;/span&gt;&lt;/div&gt;\n          &lt;/div&gt;\n          &lt;div class=&quot;sechead&quot; style=&quot;margin:14px 0 0&quot;&gt;&lt;span class=&quot;k&quot;&gt;${v.charK}&lt;/span&gt;&lt;span class=&quot;rule&quot;&gt;&lt;/span&gt;&lt;span style=&quot;display:flex;gap:14px;flex:none&quot;&gt;&lt;a href=&quot;#&quot;&gt;Switch&lt;/a&gt;&lt;a href=&quot;#&quot;&gt;Edit&lt;/a&gt;&lt;/span&gt;&lt;/div&gt;\n        &lt;/div&gt;\n      &lt;/div&gt;\n    &lt;/section&gt;\n\n    &lt;section class=&quot;evcard&quot;&gt;\n      ${masthead('Open Work Orders · 2')}\n      &lt;div class=&quot;ev-body&quot; style=&quot;padding:8px 14px 10px&quot;&gt;\n        &lt;span class=&quot;ev-halftone&quot;&gt;&lt;/span&gt;\n        &lt;div style=&quot;position:relative;z-index:2&quot;&gt;\n          &lt;div class=&quot;sechead&quot; style=&quot;margin:2px 0 2px&quot;&gt;&lt;span class=&quot;k&quot;&gt;${v.tasksK}&lt;/span&gt;&lt;span class=&quot;rule&quot;&gt;&lt;/span&gt;&lt;a href=&quot;#&quot;&gt;${v.link}&lt;/a&gt;&lt;/div&gt;\n          &lt;div class=&quot;tasks&quot;&gt;${rows}&lt;/div&gt;\n        &lt;/div&gt;\n      &lt;/div&gt;\n    &lt;/section&gt;\n\n    &lt;div class=&quot;actions&quot;&gt;\n      &lt;button class=&quot;btn primary&quot;&gt;${v.browse}&lt;/button&gt;\n      &lt;button class=&quot;btn ghost&quot;&gt;&lt;span class=&quot;plus&quot;&gt;+&lt;/span&gt; ${v.post}&lt;/button&gt;\n    &lt;/div&gt;\n  &lt;/div&gt;\n  &lt;div class=&quot;tabbar&quot;&gt;${tabbar(0)}&lt;/div&gt;`;\n}\n\n/* ---------- TASKS ---------- */\nconst TASKS = [\n  { t:'A Very Human Thing', fac:'everymen', desc:'Do something quietly kind for a stranger, then write down exactly what happened.', pv:20, lv:1, slots:'1 / 20', id:'0007' },\n  { t:'Let Him (or Her) Cook', fac:'wow', desc:'Cook a meal from scratch for people you love. Feed at least three.', pv:30, lv:3, slots:'Open', id:'0019' },\n  { t:'Knowledge Is Free', fac:'everymen', desc:'Teach a real skill to someone for free. Proof is their words, not yours.', pv:25, lv:2, slots:'5 / 12', id:'0042' },\n  { t:'Somewhere No One Needs To Be', fac:'ephemerists', desc:'Go to a place with no purpose. Document the nothing you find.', pv:15, lv:2, slots:'3 slots', id:'0033' }\n];\nfunction taskCard(t){\n  return `&lt;div class=&quot;evcard&quot;&gt;\n    ${masthead('Work Order № '+t.id)}\n    &lt;div class=&quot;ev-body&quot;&gt;\n      &lt;span class=&quot;ev-sunburst&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ev-halftone&quot;&gt;&lt;/span&gt;\n      &lt;div style=&quot;position:relative;z-index:2&quot;&gt;\n        &lt;div class=&quot;ev-title&quot;&gt;${t.t}&lt;/div&gt;\n        ${ruleDiamond()}\n        &lt;p style=&quot;font-size:10px;text-align:center;color:#6c5a40;line-height:1.5;margin:0&quot;&gt;${t.desc}&lt;/p&gt;\n        &lt;div style=&quot;display:flex;align-items:center;justify-content:space-between;margin-top:14px&quot;&gt;\n          &lt;div style=&quot;display:flex;flex-direction:column;gap:5px&quot;&gt;${levelPill(t.lv)}&lt;span style=&quot;font-family:'Bebas Neue',sans-serif;font-size:16px;color:#c1272d&quot;&gt;${t.pv} PTS&lt;/span&gt;&lt;/div&gt;\n          ${seal(t.pv)}\n        &lt;/div&gt;\n      &lt;/div&gt;\n    &lt;/div&gt;\n    &lt;button class=&quot;ev-signup&quot;&gt;Report for duty&lt;/button&gt;\n  &lt;/div&gt;`;\n}\nfunction tasksBrowse(){\n  return status() + appbar2('Tasks', searchBtn) +\n  `&lt;div class=&quot;body&quot;&gt;\n    &lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip2 on&quot;&gt;All&lt;/span&gt;&lt;span class=&quot;chip2&quot;&gt;Solo&lt;/span&gt;&lt;span class=&quot;chip2&quot;&gt;Crew&lt;/span&gt;&lt;span class=&quot;chip2&quot;&gt;Open&lt;/span&gt;&lt;span class=&quot;sortbtn&quot;&gt;⇅ Sort&lt;/span&gt;&lt;/div&gt;\n    ${TASKS.map(taskCard).join('')}\n  &lt;/div&gt;` + `&lt;div class=&quot;tabbar&quot;&gt;${tabbar(1)}&lt;/div&gt;`;\n}\nfunction taskDetail(){\n  const proofs = [ { a:'Perpetua', av:AVC[4], r:5 }, { a:'Jae', av:AVC[3], r:4 }, { a:'Bo', av:AVC[5], r:4 } ];\n  return status() + topbar('', moreBtn) +\n  `&lt;div class=&quot;body&quot; style=&quot;padding-top:0&quot;&gt;\n    &lt;div class=&quot;evcard&quot; style=&quot;margin-top:6px&quot;&gt;\n      ${masthead('Work Order № 0007 · Era III')}\n      &lt;div class=&quot;ev-body&quot;&gt;\n        &lt;span class=&quot;ev-sunburst&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ev-halftone&quot;&gt;&lt;/span&gt;\n        &lt;div style=&quot;position:relative;z-index:2&quot;&gt;\n          &lt;div class=&quot;ev-title&quot; style=&quot;font-size:34px&quot;&gt;A Very Human Thing&lt;/div&gt;\n          ${ruleDiamond()}\n          &lt;div style=&quot;display:flex;align-items:center;justify-content:center;gap:14px;margin-top:4px&quot;&gt;${levelPill(1)}${diffDots(1)}&lt;span style=&quot;font-family:'Special Elite',monospace;font-size:10px;color:#6c5a40&quot;&gt;1 / 20 filled&lt;/span&gt;&lt;/div&gt;\n        &lt;/div&gt;\n      &lt;/div&gt;\n    &lt;/div&gt;\n    &lt;p class=&quot;para&quot; style=&quot;margin-top:16px&quot;&gt;Do something quietly kind for a stranger — no audience, no reward expected. Then come back and write down exactly what happened, in your own words.&lt;/p&gt;\n    &lt;p class=&quot;para&quot;&gt;Solo work order. Proof is a short write-up and, if you have one, a photo. Honesty over spectacle.&lt;/p&gt;\n    ${sec('Reports filed · 3')}\n    &lt;div&gt;${proofs.map(p=&gt;`&lt;div class=&quot;cmt&quot; style=&quot;align-items:center&quot;&gt;&lt;div class=&quot;cav&quot; style=&quot;background:${p.av};color:#ece1c6;font-family:'Bebas Neue',sans-serif;border-radius:2px&quot;&gt;${p.a[0]}&lt;/div&gt;&lt;div class=&quot;cb&quot;&gt;&lt;div class=&quot;cn&quot;&gt;${p.a}&lt;/div&gt;${evStars(p.r)}&lt;/div&gt;&lt;div class=&quot;media&quot; style=&quot;width:46px;height:46px;flex:none&quot;&gt;IMG&lt;/div&gt;&lt;/div&gt;`).join('')}&lt;/div&gt;\n    ${sec('From the hall · 2')}\n    &lt;div class=&quot;cmt&quot;&gt;&lt;div class=&quot;cav&quot; style=&quot;background:${AVC[0]};color:#ece1c6;font-family:'Bebas Neue',sans-serif;border-radius:2px&quot;&gt;M&lt;/div&gt;&lt;div class=&quot;cb&quot;&gt;&lt;div class=&quot;cn&quot;&gt;Molly &lt;span style=&quot;color:var(--text-3);font-weight:400&quot;&gt;· 1d&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ct&quot;&gt;Reporting for duty. This one's been on my mind.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;\n    &lt;div class=&quot;cmt&quot;&gt;&lt;div class=&quot;cav&quot; style=&quot;background:${AVC[3]};color:#ece1c6;font-family:'Bebas Neue',sans-serif;border-radius:2px&quot;&gt;J&lt;/div&gt;&lt;div class=&quot;cb&quot;&gt;&lt;div class=&quot;cn&quot;&gt;Jae &lt;span style=&quot;color:var(--text-3);font-weight:400&quot;&gt;· 3d&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ct&quot;&gt;Did this last era. Changed how I walk around my block.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;\n  &lt;/div&gt;\n  &lt;div class=&quot;sticky-cta&quot;&gt;&lt;button class=&quot;btn primary&quot; style=&quot;flex:1&quot;&gt;Report for duty&lt;/button&gt;&lt;/div&gt;`;\n}\n\n/* ---------- PRAXIS ---------- */\nconst PROOFS = [\n  { a:'Perpetua', av:AVC[4], fac:'everymen', t:'Fixed the fence nobody owned', r:5, v:190, c:22, time:'2h' },\n  { a:'Jae', av:AVC[3], fac:'everymen', t:'Cooked for the whole third floor', r:4, v:151, c:18, time:'6h' },\n  { a:'Bo', av:AVC[5], fac:null, t:'Free repair table, Saturday market', r:4, v:77, c:9, time:'1d' }\n];\nfunction proofCard(p){\n  return `&lt;div class=&quot;pcard&quot; style=&quot;background:none;border:0;box-shadow:none;overflow:visible&quot;&gt;\n    &lt;div class=&quot;pcard-head&quot; style=&quot;padding:0 0 10px&quot;&gt;${pav(p.av,p.a[0])}&lt;div&gt;&lt;div class=&quot;nm&quot;&gt;${p.a}&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;span style=&quot;color:${p.fac?FAC[p.fac]:'var(--text-3)'}&quot;&gt;●&lt;/span&gt; ${p.fac?'Everymen':'Unaffiliated'} · ${p.time} ago&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;\n    &lt;div class=&quot;evcard&quot;&gt;\n      ${masthead('Work Report · '+p.time+' ago')}\n      &lt;div class=&quot;ev-body&quot; style=&quot;padding:12px 12px 12px&quot;&gt;\n        &lt;div class=&quot;media&quot; style=&quot;height:150px;border:1.5px solid #221a12&quot;&gt;Photo&lt;/div&gt;\n        &lt;div class=&quot;ev-title&quot; style=&quot;font-size:22px;margin-top:12px&quot;&gt;${p.t}&lt;/div&gt;\n        ${ruleDiamond()}\n        &lt;div style=&quot;display:flex;align-items:center;justify-content:space-between&quot;&gt;${evStars(p.r)}&lt;span class=&quot;votecount&quot;&gt;${['','a start','solid','good','excellent','legendary'][p.r]} · ${p.v} verdicts&lt;/span&gt;&lt;/div&gt;\n      &lt;/div&gt;\n    &lt;/div&gt;\n  &lt;/div&gt;`;\n}\nfunction praxisFeed(){\n  return status() + appbar2('Praxis', searchBtn) +\n  `&lt;div class=&quot;body&quot;&gt;\n    &lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip2 on&quot;&gt;Latest&lt;/span&gt;&lt;span class=&quot;chip2&quot;&gt;Top rated&lt;/span&gt;&lt;span class=&quot;chip2&quot;&gt;Following&lt;/span&gt;&lt;/div&gt;\n    ${PROOFS.map(proofCard).join('')}\n  &lt;/div&gt;` + `&lt;div class=&quot;tabbar&quot;&gt;${tabbar(2)}&lt;/div&gt;`;\n}\nfunction praxisDetail(){\n  return status() + topbar('', moreBtn) +\n  `&lt;div class=&quot;body&quot; style=&quot;padding-top:2px&quot;&gt;\n    &lt;div class=&quot;pcard-head&quot; style=&quot;padding:4px 0 12px&quot;&gt;${pav(AVC[4],'P')}&lt;div style=&quot;flex:1&quot;&gt;&lt;div class=&quot;nm&quot;&gt;Perpetua&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;span style=&quot;color:${FAC.everymen}&quot;&gt;●&lt;/span&gt; Everymen · 2h ago&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;chip2&quot;&gt;Follow&lt;/span&gt;&lt;/div&gt;\n    &lt;div class=&quot;evcard&quot;&gt;\n      ${masthead('Work Report · Filed')}\n      &lt;div class=&quot;ev-body&quot; style=&quot;padding:12px&quot;&gt;&lt;div class=&quot;media&quot; style=&quot;height:210px;border:1.5px solid #221a12&quot;&gt;Photo&lt;/div&gt;&lt;/div&gt;\n    &lt;/div&gt;\n    &lt;div class=&quot;ev-title&quot; style=&quot;font-size:30px;margin:16px 0 0;text-align:left;font-family:'Bebas Neue',sans-serif&quot;&gt;Fixed the fence nobody owned&lt;/div&gt;\n    &lt;div class=&quot;mdprev&quot; style=&quot;margin-top:8px&quot;&gt;\n      &lt;p&gt;The chain-link by the lot had been down for a year. Took a spool of wire and an afternoon. Nobody asked me to; nobody will notice but the dogs.&lt;/p&gt;\n      &lt;p&gt;That's the work. It outlasts the worker.&lt;/p&gt;\n    &lt;/div&gt;\n    &lt;div class=&quot;votebar&quot; style=&quot;margin:10px 0 4px;align-items:stretch;background:#ece1c6;border:1.5px solid #221a12&quot;&gt;\n      ${evVote(5)}\n      &lt;div class=&quot;votelbl&quot; style=&quot;text-align:center;margin-top:12px;color:#6c5a40&quot;&gt;Legendary · 190 verdicts&lt;/div&gt;\n    &lt;/div&gt;\n    ${sec('From the hall · 3')}\n    &lt;div class=&quot;cmt&quot;&gt;&lt;div class=&quot;cav&quot; style=&quot;background:${AVC[3]};color:#ece1c6;font-family:'Bebas Neue',sans-serif;border-radius:2px&quot;&gt;J&lt;/div&gt;&lt;div class=&quot;cb&quot;&gt;&lt;div class=&quot;cn&quot;&gt;Jae &lt;span style=&quot;color:var(--text-3);font-weight:400&quot;&gt;· 1h&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ct&quot;&gt;The whole thesis of the Everymen in one fence.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;\n    &lt;div class=&quot;cmt&quot;&gt;&lt;div class=&quot;cav&quot; style=&quot;background:${AVC[5]};color:#ece1c6;font-family:'Bebas Neue',sans-serif;border-radius:2px&quot;&gt;B&lt;/div&gt;&lt;div class=&quot;cb&quot;&gt;&lt;div class=&quot;cn&quot;&gt;Bo &lt;span style=&quot;color:var(--text-3);font-weight:400&quot;&gt;· 40m&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ct&quot;&gt;Stamped legendary. Report for duty, everyone.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;\n  &lt;/div&gt;\n  &lt;div class=&quot;sticky-cta&quot;&gt;&lt;div class=&quot;searchbar&quot; style=&quot;flex:1;border-radius:0&quot;&gt;Add to the hall…&lt;/div&gt;&lt;button class=&quot;btn primary&quot; style=&quot;flex:none;padding:13px 16px&quot;&gt;Post&lt;/button&gt;&lt;/div&gt;`;\n}\nfunction composerWrite(){\n  return status() +\n  `&lt;div class=&quot;topbar&quot;&gt;&lt;a href=&quot;#&quot; class=&quot;act&quot; style=&quot;color:var(--text-2)&quot;&gt;Cancel&lt;/a&gt;&lt;div class=&quot;tt&quot; style=&quot;flex:1;text-align:center;font-size:22px;letter-spacing:.04em&quot;&gt;FILE A REPORT&lt;/div&gt;&lt;a href=&quot;#&quot; class=&quot;act&quot;&gt;Submit&lt;/a&gt;&lt;/div&gt;\n  &lt;div class=&quot;body&quot; style=&quot;gap:14px&quot;&gt;\n    &lt;div class=&quot;seg&quot;&gt;&lt;button class=&quot;on&quot;&gt;Write&lt;/button&gt;&lt;button&gt;Preview&lt;/button&gt;&lt;/div&gt;\n    &lt;div class=&quot;forrow&quot;&gt;&lt;span&gt;RE: WORK ORDER&lt;/span&gt;&lt;b&gt;A Very Human Thing ▾&lt;/b&gt;&lt;/div&gt;\n    &lt;input class=&quot;field&quot; value=&quot;Fixed the fence nobody owned&quot; /&gt;\n    &lt;textarea class=&quot;ta&quot;&gt;## What I did\n\nThe chain-link by the lot had been down for a year. Took a spool of wire and an afternoon.\n\n- nobody asked me to\n- nobody will notice but the dogs\n- the work outlasts the worker&lt;/textarea&gt;\n    &lt;div&gt;&lt;label class=&quot;form-lbl&quot;&gt;Evidence&lt;/label&gt;&lt;div class=&quot;mgrid&quot;&gt;&lt;div class=&quot;media&quot;&gt;Photo&lt;/div&gt;&lt;div class=&quot;media&quot;&gt;Photo&lt;/div&gt;&lt;div class=&quot;madd&quot;&gt;+&lt;small&gt;Add&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;\n  &lt;/div&gt;\n  &lt;div class=&quot;kbd-acc&quot;&gt;&lt;span style=&quot;font-weight:700&quot;&gt;B&lt;/span&gt;&lt;span style=&quot;font-style:italic&quot;&gt;I&lt;/span&gt;&lt;span&gt;#&lt;/span&gt;&lt;span&gt;“ ”&lt;/span&gt;&lt;span&gt;≡&lt;/span&gt;&lt;span class=&quot;ph&quot;&gt;▦ Photo&lt;/span&gt;&lt;/div&gt;\n  &lt;div class=&quot;kbd&quot;&gt;On-screen keyboard&lt;/div&gt;`;\n}\nfunction composerPreview(){\n  return status() +\n  `&lt;div class=&quot;topbar&quot;&gt;&lt;a href=&quot;#&quot; class=&quot;act&quot; style=&quot;color:var(--text-2)&quot;&gt;Cancel&lt;/a&gt;&lt;div class=&quot;tt&quot; style=&quot;flex:1;text-align:center;font-size:22px;letter-spacing:.04em&quot;&gt;FILE A REPORT&lt;/div&gt;&lt;a href=&quot;#&quot; class=&quot;act&quot;&gt;Submit&lt;/a&gt;&lt;/div&gt;\n  &lt;div class=&quot;body&quot; style=&quot;gap:14px&quot;&gt;\n    &lt;div class=&quot;seg&quot;&gt;&lt;button&gt;Write&lt;/button&gt;&lt;button class=&quot;on&quot;&gt;Preview&lt;/button&gt;&lt;/div&gt;\n    &lt;div class=&quot;evcard&quot;&gt;\n      ${masthead('Work Report · draft')}\n      &lt;div class=&quot;ev-body&quot; style=&quot;padding:12px 14px 14px&quot;&gt;\n        &lt;div class=&quot;media&quot; style=&quot;height:160px;border:1.5px solid #221a12;margin-bottom:12px&quot;&gt;Photo&lt;/div&gt;\n        &lt;div class=&quot;ev-title&quot; style=&quot;font-size:24px&quot;&gt;Fixed the fence nobody owned&lt;/div&gt;\n        ${ruleDiamond()}\n        &lt;div class=&quot;mdprev&quot; style=&quot;text-align:left&quot;&gt;\n          &lt;p&gt;The chain-link by the lot had been down for a year. Took a spool of wire and an afternoon.&lt;/p&gt;\n          &lt;ul style=&quot;margin:0;padding:0;list-style:none&quot;&gt;&lt;li&gt;• nobody asked me to&lt;/li&gt;&lt;li&gt;• nobody will notice but the dogs&lt;/li&gt;&lt;li&gt;• the work outlasts the worker&lt;/li&gt;&lt;/ul&gt;\n        &lt;/div&gt;\n      &lt;/div&gt;\n    &lt;/div&gt;\n  &lt;/div&gt;\n  &lt;div class=&quot;sticky-cta&quot;&gt;&lt;button class=&quot;btn primary&quot; style=&quot;flex:1&quot;&gt;Submit report&lt;/button&gt;&lt;/div&gt;`;\n}\n\n/* ---------- UPDATES ---------- */\nfunction screenUpdates(){\n  const row = (unread,text,time) =&gt; `&lt;div class=&quot;up-row${unread?'':' read'}&quot;&gt;&lt;span class=&quot;udot&quot; style=&quot;${unread?'background:#c1272d':''};border-radius:0&quot;&gt;&lt;/span&gt;&lt;div class=&quot;ub&quot;&gt;&lt;div class=&quot;utext&quot;&gt;${text}&lt;/div&gt;&lt;div class=&quot;utime&quot; style=&quot;${unread?'color:#a9741a':''}&quot;&gt;${time}&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;`;\n  const day = (label) =&gt; `&lt;div class=&quot;up-group&quot;&gt;${label}&lt;/div&gt;&lt;div style=&quot;height:2px;border-top:1px solid #221a12;border-bottom:1px solid #221a12;height:3px;margin:2px 4px 4px&quot;&gt;&lt;/div&gt;`;\n  return status() + topbar('The Bulletin') +\n  `&lt;div class=&quot;body&quot; style=&quot;padding-top:0&quot;&gt;\n    ${day('Today')}\n    ${row(true,'&lt;b&gt;Jae&lt;/b&gt; stamped your report &lt;b style=&quot;color:#c1272d&quot;&gt;legendary&lt;/b&gt;.','2h ago')}\n    ${row(true,'You made &lt;b&gt;Level 4&lt;/b&gt; — two work orders opened.','5h ago')}\n    ${row(true,'New work order for &lt;b&gt;Everymen&lt;/b&gt;: “A Very Human Thing”, +20 PTS.','9h ago')}\n    ${day('Earlier')}\n    ${row(false,'&lt;b&gt;Perpetua&lt;/b&gt; posted to the hall on “Fixed the fence nobody owned”.','2d ago')}\n    ${row(false,'&lt;b&gt;Bo&lt;/b&gt; signed on to your crew.','3d ago')}\n    ${row(false,'Your work order &lt;b&gt;Knowledge Is Free&lt;/b&gt; got a new hand.','4d ago')}\n  &lt;/div&gt;` + `&lt;div class=&quot;tabbar&quot;&gt;${tabbar(0)}&lt;/div&gt;`;\n}\n\n/* ---------- FACTION PAGE ---------- */\nconst PLAYERS = [\n  { n:'Perpetua', lv:9, pts:'2,140', av:AVC[4] },\n  { n:'Jae', lv:7, pts:'1,880', av:AVC[3] },\n  { n:'Molly', lv:4, pts:'340', av:AVC[0] }\n];\nfunction factionDetail(){\n  const statCol = (val,lbl) =&gt; `&lt;div style=&quot;flex:1;text-align:center&quot;&gt;&lt;b style=&quot;display:block;font-family:'Bebas Neue',sans-serif;font-size:30px;line-height:1;color:#221a12&quot;&gt;${val}&lt;/b&gt;&lt;span style=&quot;font-family:'Special Elite',monospace;font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:#6c5a40;margin-top:3px;display:block&quot;&gt;${lbl}&lt;/span&gt;&lt;/div&gt;`;\n  return status() + topbar('', moreBtn) +\n  `&lt;div class=&quot;body&quot; style=&quot;padding-top:2px&quot;&gt;\n    &lt;div class=&quot;evcard&quot; style=&quot;margin-top:4px&quot;&gt;\n      ${masthead('Vol. III · No. 41 · Free to all')}\n      &lt;div class=&quot;ev-body&quot; style=&quot;padding:18px 14px 16px;text-align:center&quot;&gt;\n        &lt;span class=&quot;ev-sunburst&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ev-halftone&quot;&gt;&lt;/span&gt;\n        &lt;div style=&quot;position:relative;z-index:2&quot;&gt;\n          &lt;div style=&quot;font-family:'Bebas Neue',sans-serif;font-size:52px;line-height:.9;color:#221a12;letter-spacing:.02em&quot;&gt;THE EVERYMEN&lt;/div&gt;\n          ${ruleDiamond()}\n          &lt;div style=&quot;font-family:'Special Elite',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#c1272d&quot;&gt;The work outlasts the worker&lt;/div&gt;\n          &lt;div style=&quot;display:flex;gap:6px;margin-top:16px;border-top:1px solid #221a12;border-bottom:1px solid #221a12;padding:12px 0&quot;&gt;${statCol('256','Card-carrying')}&lt;div style=&quot;width:1px;background:#221a12&quot;&gt;&lt;/div&gt;${statCol('41','Work orders')}&lt;div style=&quot;width:1px;background:#221a12&quot;&gt;&lt;/div&gt;${statCol('III','Era')}&lt;/div&gt;\n        &lt;/div&gt;\n      &lt;/div&gt;\n    &lt;/div&gt;\n    &lt;p class=&quot;para&quot; style=&quot;margin-top:16px&quot;&gt;Nobody's coming to fix it but us. The Everymen do the work in front of them and finish what they start — their proofs read like field reports. Report for duty and your whole app takes on the paper-and-ink identity of the hall.&lt;/p&gt;\n    ${sec('Top of the roll')}\n    &lt;div&gt;${PLAYERS.map((p,i)=&gt;`&lt;div class=&quot;prow2&quot;&gt;&lt;div class=&quot;rank&quot;&gt;${i+1}&lt;/div&gt;${pav(p.av,p.n[0])}&lt;div class=&quot;pinfo&quot;&gt;&lt;div class=&quot;n&quot;&gt;${p.n}&lt;/div&gt;&lt;div class=&quot;m&quot;&gt;&lt;i style=&quot;background:${FAC.everymen}&quot;&gt;&lt;/i&gt;Everymen · Lv ${p.lv}&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ppts2&quot;&gt;&lt;b&gt;${p.pts}&lt;/b&gt;&lt;span&gt;pts&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;`).join('')}&lt;/div&gt;\n    ${sec('Recent reports')}\n    &lt;div class=&quot;thumbs&quot; style=&quot;margin-top:8px&quot;&gt;${Array.from({length:3}).map(()=&gt;`&lt;div class=&quot;media&quot; style=&quot;aspect-ratio:1;border:1.5px solid #221a12&quot;&gt;Photo&lt;/div&gt;`).join('')}&lt;/div&gt;\n  &lt;/div&gt;\n  &lt;div class=&quot;sticky-cta&quot;&gt;&lt;button class=&quot;btn primary&quot; style=&quot;flex:1&quot;&gt;Report for duty&lt;/button&gt;&lt;/div&gt;`;\n}\n\n/* ---------- render (Everymen · native light) ---------- */\nfunction renderRail(id, list){\n  document.getElementById(id).innerHTML = list.map(([label,fn])=&gt;`\n    &lt;div class=&quot;phone-wrap&quot;&gt;\n      &lt;div class=&quot;phone-tag&quot;&gt;&lt;b&gt;${label}&lt;/b&gt; · Light&lt;/div&gt;\n      &lt;div class=&quot;phone&quot;&gt;&lt;div class=&quot;screen&quot; data-theme=&quot;light&quot; data-treatment=&quot;everymen&quot;&gt;${fn()}&lt;/div&gt;&lt;/div&gt;\n    &lt;/div&gt;`).join('');\n}\nrenderRail('homeRail',    [['Home', home]]);\nrenderRail('tasksRail',   [['Browse', tasksBrowse], ['Detail', taskDetail]]);\nrenderRail('praxisRail',  [['Feed', praxisFeed], ['Detail', praxisDetail], ['Compose · Write', composerWrite], ['Compose · Preview', composerPreview]]);\nrenderRail('updatesRail', [['Bulletin', screenUpdates]]);\nrenderRail('factionRail', [['Faction page', factionDetail]]);\n\n/* ---------- anatomy + kit specimens ---------- */\ndocument.getElementById('anatomy').innerHTML =\n  `&lt;div class=&quot;screen&quot; data-theme=&quot;light&quot; data-treatment=&quot;everymen&quot; style=&quot;border-radius:6px;overflow:hidden;height:auto;background:#ddceac;padding:16px&quot;&gt;\n     &lt;div class=&quot;evcard&quot;&gt;${masthead('Work Order № 0007')}&lt;div class=&quot;ev-body&quot;&gt;&lt;span class=&quot;ev-sunburst&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ev-halftone&quot;&gt;&lt;/span&gt;&lt;div style=&quot;position:relative;z-index:2&quot;&gt;&lt;div class=&quot;ev-title&quot;&gt;A Very Human Thing&lt;/div&gt;${ruleDiamond()}&lt;p style=&quot;font-size:10px;text-align:center;color:#6c5a40;line-height:1.5;margin:0&quot;&gt;Do something quietly kind for a stranger.&lt;/p&gt;&lt;div style=&quot;display:flex;align-items:center;justify-content:space-between;margin-top:12px&quot;&gt;&lt;div style=&quot;display:flex;flex-direction:column;gap:5px&quot;&gt;${levelPill(1)}&lt;span style=&quot;font-family:'Bebas Neue',sans-serif;font-size:16px;color:#c1272d&quot;&gt;20 PTS&lt;/span&gt;&lt;/div&gt;${seal(20)}&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;button class=&quot;ev-signup&quot;&gt;Report for duty&lt;/button&gt;&lt;/div&gt y=Bebas+Neue&amp;family=Permanent+Marker&amp;family=Special+Elite&amp;family=Lora:ital,wght@0,500;0,600;1,400;1,500;1,600&amp;family=Courier+Prime:wght@400;700&amp;display=swap&quot; rel=&quot;stylesheet&quot;&gt;\n&lt;style&gt;\n/* ============================================================\n   BOARD (review surface — not part of the product)\n   ============================================================ */\n*{box-sizing:border-box}\nhtml,body{margin:0}\nbody{\n  background:#26252c;\n  color:#e9e6df;\n  font-family:&quot;Courier Prime&quot;,monospace;\n  -webkit-font-smoothing:antialiased;\n  padding:40px 32px 96px;\n}\na{color:inherit}\n.board{max-width:1180px;margin:0 auto}\n.board-head{margin-bottom:40px;max-width:760px}\n.board-head .eyebrow{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:#8a8794;margin:0 0 14px}\n.board-head h1{font-family:&quot;Lora&quot;,serif;font-weight:600;font-size:34px;line-height:1.1;margin:0 0 12px;color:#f4f1ea}\n.board-head p{font-size:13px;line-height:1.7;color:#a5a1ac;margin:0}\n.board-head .stage{display:inline-block;margin-top:18px;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:#26252c;background:#e7b94f;padding:6px 12px;border-radius:3px;font-weight:700}\n\n.section-label{display:flex;align-items:baseline;gap:16px;margin:56px 0 24px}\n.section-label .n{font-family:&quot;Lora&quot;,serif;font-size:13px;color:#6f6c78}\n.section-label h2{font-family:&quot;Lora&quot;,serif;font-weight:600;font-size:22px;margin:0;color:#f4f1ea}\n.section-label .rule{flex:1;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.16),transparent)}\n.section-label p{width:100%;flex-basis:100%;font-size:12px;color:#918d99;margin:8px 0 0;line-height:1.6;max-width:720px}\n\n/* spec cards on the board */\n.grid{display:grid;gap:16px}\n.spec{background:#302f38;border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:22px}\n.spec h3{font-family:&quot;Lora&quot;,serif;font-size:15px;font-weight:600;marg
