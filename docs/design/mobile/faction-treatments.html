document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ily=Cormorant+Garamond:ital,wght@0,500;1,500&amp;family=Special+Elite&amp;family=Courier+Prime:wght@400;700&amp;display=swap&quot; rel=&quot;stylesheet&quot;&gt;\n&lt;style&gt;\n/* ============================================================\n   BOARD (review surface — not part of the product)\n   ============================================================ */\n*{box-sizing:border-box}\nhtml,body{margin:0}\nbody{\n  background:#26252c;\n  color:#e9e6df;\n  font-family:&quot;Courier Prime&quot;,monospace;\n  -webkit-font-smoothing:antialiased;\n  padding:40px 32px 96px;\n}\na{color:inherit}\n.board{max-width:1180px;margin:0 auto}\n.board-head{margin-bottom:40px;max-width:760px}\n.board-head .eyebrow{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:#8a8794;margin:0 0 14px}\n.board-head h1{font-family:&quot;Lora&quot;,serif;font-weight:600;font-size:34px;line-height:1.1;margin:0 0 12px;color:#f4f1ea}\n.board-head p{font-size:13px;line-height:1.7;color:#a5a1ac;margin:0}\n.board-head .stage{display:inline-block;margin-top:18px;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:#26252c;background:#e7b94f;padding:6px 12px;border-radius:3px;font-weight:700}\n\n.section-label{display:flex;align-items:baseline;gap:16px;margin:56px 0 24px}\n.section-label .n{font-family:&quot;Lora&quot;,serif;font-size:13px;color:#6f6c78}\n.section-label h2{font-family:&quot;Lora&quot;,serif;font-weight:600;font-size:22px;margin:0;color:#f4f1ea}\n.section-label .rule{flex:1;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.16),transparent)}\n.section-label p{width:100%;flex-basis:100%;font-size:12px;color:#918d99;margin:8px 0 0;line-height:1.6;max-width:720px}\n\n/* spec cards on the board */\n.grid{display:grid;gap:16px}\n.spec{background:#302f38;border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:22px}\n.spec h3{font-family:&quot;Lora&quot;,serif;font-size:15px;font-weight:600;margin:0 0 4px;color:#f4f1ea}\n.spec .sub{font-size:11px;color:#8a8794;margin:0 0 18px;line-height:1.5}\n\n/* spacing scale */\n.sp-row{display:flex;align-items:center;gap:16px;margin-bottom:9px}\n.sp-row .swatch{background:linear-gradient(90deg,#e7b94f,#d99a2b);height:14px;border-radius:2px;flex:none}\n.sp-row .lbl{font-size:11px;color:#c8c4cd;width:54px}\n.sp-row .use{font-size:10px;color:#807d89}\n\n/* type scale */\n.ty{display:flex;align-items:baseline;justify-content:space-between;gap:18px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.06)}\n.ty:last-child{border-bottom:0}\n.ty .demo{color:#f4f1ea;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.ty .meta{font-size:10px;color:#807d89;text-align:right;flex:none;line-height:1.5}\n.ty .meta b{color:#c8c4cd;font-weight:400}\n\n.pattern-note{font-size:11px;line-height:1.7;color:#a5a1ac}\n.pattern-note b{color:#e9e6df;font-weight:400}\n.pill-legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}\n.pill-legend span{font-size:10px;letter-spacing:.06em;color:#c8c4cd;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:999px;padding:5px 11px}\n\n/* token cascade table */\n.cascade{width:100%;border-collapse:collapse;font-size:11px}\n.cascade th{text-align:left;font-weight:400;color:#807d89;letter-spacing:.1em;text-transform:uppercase;font-size:9px;padding:0 10px 10px;border-bottom:1px solid rgba(255,255,255,.1)}\n.cascade td{padding:9px 10px;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:middle;color:#c8c4cd}\n.cascade td code{color:#9d99a6;font-size:10px}\n.chip{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:middle;margin-right:7px;border:1px solid rgba(255,255,255,.18)}\n\n/* phone rail */\n.rail{display:flex;flex-wrap:wrap;gap:34px 30px;align-items:flex-start}\n.phone-wrap{display:flex;flex-direction:column;align-items:center;gap:14px}\n.phone-tag{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#8a8794}\n.phone-tag b{color:#e7b94f;font-weight:400}\n\n/* ============================================================\n   PHONE FRAME + PRODUCT\n   ============================================================ */\n.phone{\n  width:375px;height:770px;border-radius:46px;flex:none;position:relative;\n  background:#0a0a0d;padding:11px;\n  box-shadow:0 2px 4px rgba(0,0,0,.4),0 24px 60px rgba(0,0,0,.5),inset 0 0 0 2px rgba(255,255,255,.05);\n}\n.screen{\n  position:relative;width:100%;height:100%;border-radius:36px;overflow:hidden;\n  display:flex;flex-direction:column;\n  background:var(--field-bg,var(--bg-page));\n  color:var(--text-1);\n  font-family:var(--label-font);\n}\n\n/* ---- theme token layers (the tinting mechanism lives here) ---- */\n.screen[data-theme=&quot;light&quot;]{\n  --bg-page:#f7f4ee; --surface:#fffdf9; --surface-2:#f0ede6;\n  --text-1:#1a1209; --text-2:#6b6050; --text-3:#9b8e7d;\n  --border:rgba(0,0,0,.09); --border-2:rgba(0,0,0,.16);\n  --nav-bg:rgba(247,244,238,.9);\n  --shadow:0 1px 2px rgba(0,0,0,.05),0 10px 26px rgba(0,0,0,.07);\n  --rainbow:linear-gradient(90deg,#c1272d,#c2541f 17%,#ca8a04 33%,#16a34a 50%,#1d6e72 67%,#2563eb 83%,#be185d);\n  --ring:conic-gradient(#c1272d 0 51deg,#c2541f 0 103deg,#ca8a04 0 154deg,#16a34a 0 206deg,#1d6e72 0 257deg,#2563eb 0 309deg,#be185d 0 360deg);\n}\n.screen[data-theme=&quot;dark&quot;]{\n  --bg-page:#13121a; --surface:#1c1b24; --surface-2:#232230;\n  --text-1:#f0e6d0; --text-2:#8b8194; --text-3:#585568;\n  --border:rgba(255,255,255,.08); --border-2:rgba(255,255,255,.16);\n  --nav-bg:rgba(19,18,26,.9);\n  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px rgba(0,0,0,.5);\n  --rainbow:linear-gradient(90deg,#e2433f,#e07a3a 17%,#e6b94f 33%,#4ade80 50%,#3aa0a4 67%,#60a5fa 83%,#f472b6);\n  --ring:conic-gradient(#e2433f 0 51deg,#e07a3a 0 103deg,#e6b94f 0 154deg,#4ade80 0 206deg,#3aa0a4 0 257deg,#60a5fa 0 309deg,#f472b6 0 360deg);\n}\n\n/* ---- treatment: DEFAULT (na) ---- */\n.screen[data-treatment=&quot;na&quot;]{\n  --headline:&quot;Lora&quot;,Georgia,serif; --headline-style:italic; --headline-weight:600;\n  --label-font:&quot;Courier Prime&quot;,monospace;\n  --card-radius:14px; --tile-radius:10px; --btn-radius:12px;\n  --accent-solid:var(--text-1);\n  --paper-tex:none;\n}\n.screen[data-treatment=&quot;na&quot;][data-theme=&quot;light&quot;]{ --accent:#be185d; --accent-ink:#fffdf9; --cta-bg:#1a1209; --cta-text:#f7f4ee; --stamp:#be185d;\n  --field-bg:\n    radial-gradient(60% 45% at 12% 6%, rgba(193,39,45,.13), transparent 60%),\n    radial-gradient(55% 42% at 90% 3%, rgba(202,138,4,.12), transparent 60%),\n    radial-gradient(52% 46% at 102% 42%, rgba(37,99,235,.11), transparent 60%),\n    radial-gradient(68% 52% at 50% 116%, rgba(190,24,93,.12), transparent 62%),\n    radial-gradient(58% 46% at 6% 90%, rgba(22,163,74,.11), transparent 62%),\n    radial-gradient(46% 40% at 80% 96%, rgba(29,110,114,.10), transparent 62%),\n    #f7f4ee;\n  --paper-tex:none;\n}\n.screen[data-treatment=&quot;na&quot;][data-theme=&quot;dark&quot;]{ --accent:#f0e6d0; --accent-ink:#13121a; --cta-bg:#f0e6d0; --cta-text:#13121a; --stamp:#f472b6;\n  --field-bg:\n    radial-gradient(60% 45% at 12% 6%, rgba(226,67,63,.20), transparent 60%),\n    radial-gradient(55% 42% at 90% 3%, rgba(224,122,58,.17), transparent 60%),\n    radial-gradient(52% 46% at 102% 42%, rgba(96,165,250,.16), transparent 60%),\n    radial-gradient(68% 52% at 50% 116%, rgba(244,114,182,.17), transparent 62%),\n    radial-gradient(58% 46% at 6% 90%, rgba(74,222,128,.14), transparent 62%),\n    radial-gradient(46% 40% at 80% 96%, rgba(58,160,164,.13), transparent 62%),\n    #13121a;\n  --paper-tex:none;\n}\n\n/* ---- treatment: EVERYMEN (field report) ---- */\n.screen[data-treatment=&quot;everymen&quot;]{\n  --headline:&quot;Special Elite&quot;,&quot;Courier New&quot;,serif; --headline-style:normal; --headline-weight:400;\n  --label-font:&quot;Special Elite&quot;,&quot;Courier New&quot;,monospace;\n  --card-radius:5px; --tile-radius:4px; --btn-radius:4px;\n}\n.screen[data-treatment=&quot;everymen&quot;][data-theme=&quot;light&quot;]{\n  --bg-page:#ddceac; --surface:#ece1c6; --surface-2:#e4d8ba;\n  --text-1:#221a12; --text-2:#6c5a40; --text-3:#8a7a5c;\n  --border:rgba(34,26,18,.2); --border-2:rgba(34,26,18,.38);\n  --nav-bg:rgba(236,225,198,.94);\n  --accent:#a9741a; --accent-bright:#d99a2b; --accent-ink:#ece1c6;\n  --stamp:#c1272d; --cta-bg:#a9741a; --cta-text:#f4ecd6;\n  --shadow:0 1px 2px rgba(34,26,18,.1),0 10px 22px rgba(34,26,18,.14);\n  --paper-tex:repeating-linear-gradient(0deg,rgba(34,26,18,.022) 0 1px,transparent 1px 3px);\n}\n.screen[data-treatment=&quot;everymen&quot;][data-theme=&quot;dark&quot;]{\n  --bg-page:#17110d; --surface:#221a16; --surface-2:#2b2118;\n  --text-1:#f3e7ce; --text-2:#b6a079; --text-3:#7d6c50;\n  --border:rgba(243,231,206,.16); --border-2:rgba(243,231,206,.32);\n  --nav-bg:rgba(23,17,13,.92);\n  --accent:#e7b94f; --accent-bright:#e7b94f; --accent-ink:#221a16;\n  --stamp:#e2433f; --cta-bg:#e7b94f; --cta-text:#221a16;\n  --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 28px rgba(0,0,0,.55);\n  --paper-tex:repeating-linear-gradient(0deg,rgba(243,231,206,.02) 0 1px,transparent 1px 3px);\n}\n\n/* ---- treatment: SNIDE (redacted dossier / ransom note) ---- */\n.screen[data-treatment=&quot;snide&quot;]{\n  --headline:&quot;Bebas Neue&quot;,Impact,sans-serif; --headline-style:normal; --headline-weight:400;\n  --label-font:&quot;Special Elite&quot;,&quot;Courier New&quot;,monospace;\n  --card-radius:2px; --tile-radius:2px; --btn-radius:2px; --paper-tex:none;\n}\n.screen[data-treatment=&quot;snide&quot;][data-theme=&quot;dark&quot;]{\n  --bg-page:#100d09; --surface:#14110b; --surface-2:#1e1a11;\n  --text-1:#f4f1e8; --text-2:#d8d6c8; --text-3:#8f8b78;\n  --border:rgba(244,241,232,.14); --border-2:rgba(244,241,232,.28);\n  --nav-bg:rgba(16,13,9,.92);\n  --accent:#b6ff2e; --accent-ink:#14110b; --cta-bg:#ff2d8b; --cta-text:#fff; --stamp:#ff2d8b;\n  --shadow:5px 6px 0 rgba(0,0,0,.5);\n  --rainbow:linear-gradient(90deg,#b6ff2e,#ff2d }\n.lu-card{width:78%;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:26px 20px;text-align:center;position:relative;z-index:2;box-shadow:0 20px 50px rgba(0,0,0,.5)}\n.lu-burst{width:88px;height:88px;border-radius:50%;margin:0 auto 15px;background:var(--ring);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(0,0,0,.3)}\n.lu-burst b{font-family:var(--headline);font-style:var(--headline-style);font-size:36px;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.35)}\n.lu-card h3{font-family:var(--headline);font-style:var(--headline-style);font-weight:var(--headline-weight);font-size:24px;margin:0 0 6px;color:var(--text-1)}\n.lu-card p{font-size:13px;line-height:1.5;color:var(--text-2);margin:0 0 18px}\n.confetti{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}\n.confetti i{position:absolute;width:8px;height:9px;border-radius:2px;top:-14px;animation:cfall linear infinite}\n@keyframes cfall{to{transform:translateY(620px) rotate(420deg)}}\n/* ---- sticky CTA (detail screens) ---- */\n.sticky-cta{padding:12px 16px 22px;background:var(--nav-bg);backdrop-filter:blur(12px);border-top:1px solid var(--border);display:flex;gap:10px;flex:none;align-items:center}\n\n@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}\n&lt;/style&gt;\n&lt;/head&gt;\n&lt;body&gt;\n&lt;template id=&quot;__bundler_thumbnail&quot;&gt;\n&lt;svg viewBox=&quot;0 0 400 400&quot; xmlns=&quot;http://www.w3.org/2000/svg&quot;&gt;\n  &lt;rect width=&quot;400&quot; height=&quot;400&quot; fill=&quot;#f3e8d2&quot;/&gt;\n  &lt;rect x=&quot;116&quot; y=&quot;90&quot; width=&quot;168&quot; height=&quot;230&quot; fill=&quot;#9c6a1a&quot;/&gt;\n  &lt;rect x=&quot;121&quot; y=&quot;95&quot; width=&quot;158&quot; height=&quot;220&quot; fill=&quot;#fdf6ea&quot; stroke=&quot;#e3cb98&quot;/&gt;\n  &lt;path d=&quot;M200 128 L226 138 L226 172 L200 190 L174 172 L174 138 Z&quot; fill=&quot;#dd9322&quot; stroke=&quot;#fdf6ea&quot; stroke-width=&quot;2&quot;/&gt;\n  &lt;text x=&quot;200&quot; y=&quot;166&quot; font-family=&quot;Georgia,serif&quot; font-size=&quot;20&quot; font-weight=&quot;700&quot; fill=&quot;#3d2410&quot; text-anchor=&quot;middle&quot;&gt;UA&lt;/text&gt;\n  &lt;rect x=&quot;150&quot; y=&quot;212&quot; width=&quot;100&quot; height=&quot;10&quot; rx=&quot;2&quot; fill=&quot;#3d2410&quot;/&gt;\n  &lt;rect x=&quot;164&quot; y=&quot;232&quot; width=&quot;72&quot; height=&quot;7&quot; rx=&quot;2&quot; fill=&quot;#c2541f&quot;/&gt;\n  &lt;rect x=&quot;150&quot; y=&quot;256&quot; width=&quot;100&quot; height=&quot;8&quot; fill=&quot;url(#g)&quot;/&gt;\n  &lt;defs&gt;&lt;linearGradient id=&quot;g&quot; x1=&quot;0&quot; y1=&quot;0&quot; x2=&quot;1&quot; y2=&quot;0&quot;&gt;&lt;stop offset=&quot;0&quot; stop-color=&quot;#eec06a&quot;/&gt;&lt;stop offset=&quot;.5&quot; stop-color=&quot;#9c6a1a&quot;/&gt;&lt;stop offset=&quot;1&quot; stop-color=&quot;#dd9322&quot;/&gt;&lt;/linearGradient&gt;&lt;/defs&gt;\n&lt;/svg&gt;\n&lt;/template&gt;\n&lt;div class=&quot;board&quot;&gt;\n\n  &lt;header class=&quot;board-head&quot;&gt;\n    &lt;p class=&quot;eyebrow&quot;&gt;World Zero · UA — the gilt salon&lt;/p&gt;\n    &lt;h1&gt;Matriculate into UA and the app becomes a salon: work framed in gold and hung on the wall.&lt;/h1&gt;\n    &lt;p&gt;Same 375px layout, same markup — dressed in UA's real idiom. Every card is a &lt;b style=&quot;color:#e9e6df&quot;&gt;gilt plate&lt;/b&gt;: a gold-leaf frame (&lt;code style=&quot;color:#c8c4cd&quot;&gt;--ua-gilt&lt;/code&gt;) around a parchment leaf (&lt;code style=&quot;color:#c8c4cd&quot;&gt;--ua-paper&lt;/code&gt; #fdf6ea) speckled with a faint radial dot grid, rotated &lt;code style=&quot;color:#c8c4cd&quot;&gt;-0.6°&lt;/code&gt; and dropped in shadow like a plate on the salon wall. A &lt;b style=&quot;color:#e9e6df&quot;&gt;crest&lt;/b&gt; and engraved regalia (Marcellus SC), a &lt;b style=&quot;color:#e9e6df&quot;&gt;motto ribbon&lt;/b&gt; (&lt;code style=&quot;color:#c8c4cd&quot;&gt;Ars Longa · Spiritus Brevis&lt;/code&gt;) in gilt, titles in &lt;b style=&quot;color:#e9e6df&quot;&gt;Playfair Display&lt;/b&gt; italic, ink (&lt;code style=&quot;color:#c8c4cd&quot;&gt;--ua-ink&lt;/code&gt; #3d2410) and orange (&lt;code style=&quot;color:#c8c4cd&quot;&gt;--ua-orange&lt;/code&gt;) close it out. Nothing invented — every value resolves to &lt;code style=&quot;color:#c8c4cd&quot;&gt;--ua-*&lt;/code&gt; / &lt;code style=&quot;color:#c8c4cd&quot;&gt;--faction-ua-*&lt;/code&gt;. Native mode: light. Body stays EB Garamond so it reads like a catalogue.&lt;/p&gt;\n    &lt;span class=&quot;stage&quot;&gt;UA (gilt salon) · framed plates · crest + motto ribbon · native light&lt;/span&gt;\n  &lt;/header&gt;\n\n  &lt;!-- ============ THE IDIOM ============ --&gt;\n  &lt;div class=&quot;section-label&quot;&gt;&lt;span class=&quot;n&quot;&gt;01&lt;/span&gt;&lt;h2&gt;The idiom&lt;/h2&gt;&lt;span class=&quot;rule&quot;&gt;&lt;/span&gt;\n    &lt;p&gt;UA's signature is the &lt;b style=&quot;color:#e9e6df&quot;&gt;gilt plate&lt;/b&gt; — lifted straight from the real UATaskCard: crest, engraved regalia, motto ribbon, Playfair title on parchment, a gold points line. Anatomy, then the framing kit.&lt;/p&gt;\n  &lt;/div&gt;\n\n  &lt;div class=&quot;grid&quot; style=&quot;grid-template-columns:1fr 1fr&quot;&gt;\n    &lt;div class=&quot;spec&quot;&gt;\n      &lt;h3&gt;Gilt-plate anatomy&lt;/h3&gt;\n      &lt;p class=&quot;sub&quot;&gt;Gold frame → parchment leaf (dot grid) → crest → regalia + est line → motto ribbon → Playfair title → catalogue note → gold points. Same DOM slots as any faction card; only the framing changes.&lt;/p&gt;\n      &lt;div id=&quot;anatomy&quot; style=&quot;max-width:250px&quot;&gt;&lt;/div&gt;\n    &lt;/div&gt;\n    &lt;div class=&quot;spec&quot;&gt;\n      &lt;h3&gt;Framing kit&lt;/h3&gt;\n      &lt;p class=&quot;sub&quot;&gt;The four pieces every UA surface is built from — the gilt frame, the crest, the motto ribbon and the appraisal plates (the UA vote).&lt;/p&gt;\n      &lt;div id=&quot;uakit&quot; style=&quot;padding:18px 14px 8px;background:#f3e8d2;border-radius:3px;margin-top:8px&quot;&gt;&lt;/div&gt;\n      &lt;p class=&quot;pattern-note&quot; style=&quot;margin-top:12px&quot;&gt;&lt;b&gt;Frame&lt;/b&gt; gold-leaf gradient, 4px · &lt;b&gt;Crest&lt;/b&gt; gilt shield, engraved monogram · &lt;b&gt;Ribbon&lt;/b&gt; notched banner, motto in italic · &lt;b&gt;Appraise&lt;/b&gt; five plates, rough sketch → masterwork.&lt;/p&gt;\n    &lt;/div&gt;\n  &lt;/div&gt;\n\n  &lt;!-- ============ HOME ============ --&gt;\n  &lt;div class=&quot;section-label&quot;&gt;&lt;span class=&quot;n&quot;&gt;02&lt;/span&gt;&lt;h2&gt;FieldDesk — Home&lt;/h2&gt;&lt;span class=&quot;rule&quot;&gt;&lt;/span&gt;\n    &lt;p&gt;Standing and open commissions, each a framed plate on a warm parchment desk. Actions keep their one-hand spot; the primary is UA orange.&lt;/p&gt;\n  &lt;/div&gt;\n  &lt;div class=&quot;rail&quot; id=&quot;homeRail&quot;&gt;&lt;/div&gt;\n\n  &lt;!-- ============ TASKS ============ --&gt;\n  &lt;div class=&quot;section-label&quot;&gt;&lt;span class=&quot;n&quot;&gt;03&lt;/span&gt;&lt;h2&gt;Tasks&lt;/h2&gt;&lt;span class=&quot;rule&quot;&gt;&lt;/span&gt;\n    &lt;p&gt;Every task is a commission — crest, regalia, motto ribbon, Playfair title, a gold bounty line. Detail keeps the sticky Matriculate bar, exhibited proofs and the critique below.&lt;/p&gt;\n  &lt;/div&gt;\n  &lt;div class=&quot;rail&quot; id=&quot;tasksRail&quot;&gt;&lt;/div&gt;\n\n  &lt;!-- ============ PRAXIS ============ --&gt;\n  &lt;div class=&quot;section-label&quot;&gt;&lt;span class=&quot;n&quot;&gt;04&lt;/span&gt;&lt;h2&gt;Praxis&lt;/h2&gt;&lt;span class=&quot;rule&quot;&gt;&lt;/span&gt;\n    &lt;p&gt;Work exhibited: the photo framed in gilt and hung, a Playfair caption, the UA appraisal. Detail has the full appraisal plates; the composer keeps Write / Preview and the media grid.&lt;/p&gt;\n  &lt;/div&gt;\n  &lt;div class=&quot;rail&quot; id=&quot;praxisRail&quot;&gt;&lt;/div&gt;\n\n  &lt;!-- ============ UPDATES ============ --&gt;\n  &lt;div class=&quot;section-label&quot;&gt;&lt;span class=&quot;n&quot;&gt;05&lt;/span&gt;&lt;h2&gt;Updates&lt;/h2&gt;&lt;span class=&quot;rule&quot;&gt;&lt;/span&gt;\n    &lt;p&gt;The Register — appraisals, matriculations, critiques, new commissions. Orange ticks for unread, gold engraved timestamps, a hairline rule on every divider.&lt;/p&gt;\n  &lt;/div&gt;\n  &lt;div class=&quot;rail&quot; id=&quot;updatesRail&quot;&gt;&lt;/div&gt;\n\n  &lt;!-- ============ FACTION PAGE ============ --&gt;\n  &lt;div class=&quot;section-label&quot;&gt;&lt;span class=&quot;n&quot;&gt;06&lt;/span&gt;&lt;h2&gt;Faction page — UA&lt;/h2&gt;&lt;span class=&quot;rule&quot;&gt;&lt;/span&gt;\n    &lt;p&gt;The pre-join exhibition: full UA dress — a giant gilt-framed wordmark, the crest, motto ribbon and gold stat plates (patrons · commissions · acquisitions) — while an unaffiliated viewer's chrome stays neutral. &lt;b style=&quot;color:#e9e6df&quot;&gt;Matriculate&lt;/b&gt; flips the whole app into this.&lt;/p&gt;\n  &lt;/div&gt;\n  &lt;div class=&quot;rail&quot; id=&quot;factionRail&quot;&gt;&lt;/div&gt;\n\n&lt;/div&gt;\n\n&lt;script&gt;\n/* ---------- icons ---------- */\nconst ICON = {\n  home:'&lt;svg viewBox=&quot;0 0 24 24&quot;&gt;&lt;path d=&quot;M4 11l8-6 8 6&quot;/&gt;&lt;path d=&quot;M6 10v9h12v-9&quot;/&gt;&lt;/svg&gt;',\n  tasks:'&lt;svg viewBox=&quot;0 0 24 24&quot;&gt;&lt;path d=&quot;M9 6h11M9 12h11M9 18h11&quot;/&gt;&lt;path d=&quot;M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2&quot;/&gt;&lt;/svg&gt;',\n  praxis:'&lt;svg viewBox=&quot;0 0 24 24&quot;&gt;&lt;path d=&quot;M12 4l2.3 4.9 5.2.7-3.8 3.6.9 5.3-4.6-2.6-4.6 2.6.9-5.3L5.5 9.6l5.2-.7z&quot;/&gt;&lt;/svg&gt;',\n  players:'&lt;svg viewBox=&quot;0 0 24 24&quot;&gt;&lt;circle cx=&quot;9&quot; cy=&quot;9&quot; r=&quot;3&quot;/&gt;&lt;path d=&quot;M4 19c0-2.8 2.2-5 5-5s5 2.2 5 5&quot;/&gt;&lt;path d=&quot;M16 7.5a3 3 0 010 5.4M15 14.6c2.3.5 4 2.3 4 4.4&quot;/&gt;&lt;/svg&gt;',\n  factions:'&lt;svg viewBox=&quot;0 0 24 24&quot;&gt;&lt;path d=&quot;M12 3l7 3v5c0 4.4-3 7.6-7 9-4-1.4-7-4.6-7-9V6z&quot;/&gt;&lt;/svg&gt;',\n  bell:'&lt;svg viewBox=&quot;0 0 24 24&quot; style=&quot;width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round&quot;&gt;&lt;path d=&quot;M6 9a6 6 0 1112 0c0 5 2 6 2 6H4s2-1 2-6&quot;/&gt;&lt;path d=&quot;M10 20a2 2 0 004 0&quot;/&gt;&lt;/svg&gt;',\n  search:'&lt;svg viewBox=&quot;0 0 24 24&quot; style=&quot;width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round&quot;&gt;&lt;circle cx=&quot;11&quot; cy=&quot;11&quot; r=&quot;6.5&quot;/&gt;&lt;path d=&quot;M20 20l-4.2-4.2&quot;/&gt;&lt;/svg&gt;'\n};\nconst TABS = [['home','Home'],['tasks','Tasks'],['praxis','Praxis'],['players','Players'],['factions','Factions']];\nfunction tabbar(active){ return TABS.map(([k,l],i)=&gt;`&lt;button class=&quot;tab&quot; aria-selected=&quot;${i===active}&quot; data-tab=&quot;${i}&quot;&gt;${ICON[k]}&lt;span class=&quot;l&quot;&gt;${l}&lt;/span&gt;&lt;/button&gt;`).join(''); }\n\n/* ---------- UA signature bits ---------- */\nfunction crest(size){ size=size||56; return `&lt;div class=&quot;ua-crest&quot; style=&quot;width:${size}px;height:${Math.round(size*1.18)}px&quot;&gt;&lt;span style=&quot;font-size:${Math.round(size*0.36)}px&quot;&gt;UA&lt;/span&gt;&lt;/div&gt;`; }\nfunction ribbon(text,fs){ fs=fs||11; return `&lt;span class=&quot;ua-ribbon&quot; style=&quot;font-size:${fs}px;padding:${Math.round(fs*0.45)}px ${fs*2}px&quot;&gt;${text}&lt;/span&gt;`; }\nfunction regal(t){ return `&lt;div class=&quot;ua-regal&quot;&gt;${t}&lt;/div&gt;`; }\nfunction est(t){ return `&lt;div class=&quot;ua-est&quot;&gt;${t}&lt;/div&gt;`; }\nfunction uaPlate(inner,opts){\n  opts = opts||{};\n  const rot = opts.rot===false?'':(opts.rot===1?' rotp':' rot');\n  const center = opts.center===false?'':' center';\n  return `&lt;div class=&quot;ua-gilt${rot}&quot; style=&quot;${opts.wrap||''}&quot;&gt;&lt;div class=&quot;ua-plate${center}&quot; style=&quot;${opts.pad||'padding:20px 22px 16px'}&quot;&gt;${inner}&lt;/div&gt;&lt;/div&gt;`;\n}\n/* the UA appraisal plates (real UAVote tiers) */\nfunction uaVote(sel){\n  const tiers = [['rough sketch',1],['study',2],['accomplished',3],['distinguished',4],['masterwork',5]];\n  return `&lt;div style=&quot;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;justify-content:center&quot;&gt;` + tiers.map(([lbl,v])=&gt;{\n    const active = sel===v, reached = sel&gt;=v, top = v===5;\n    const bg = active ? (top ? 'linear-gradient(135deg,#eec06a,#9c6a1a 50%,#dd9322)' : '#c2541f') : (reached ? 'rgba(194,84,31,.12)' : '#fdf6ea');\n    const col = active ? '#fdf6ea' : (reached ? '#c2541f' : '#8f6a3a');\n    const bord = active &amp;&amp; top ? 'none' : `1px solid ${reached?'#c2541f':'#cdab63'}`;\n    return `&lt;div style=&quot;display:flex;flex-direction:column;align-items:center;gap:5px&quot;&gt;\n      &lt;button style=&quot;min-width:60px;height:40px;padding:0 12px;border:${bord};border-radius:2px;background:${bg};color:${col};font-family:'Marcellus SC',serif;font-size:11px;letter-spacing:.08em;text-transform:uppercase;transform:${active?'scale(1.06)':'none'};box-shadow:${active?'0 4px 10px rgba(61,36,16,.22),inset 0 0 0 1px rgba(253,246,234,.4)':'none'}&quot;&gt;${lbl}&lt;/button&gt;\n      &lt;span style=&quot;font-family:'Marcellus SC',serif;font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:${active?'#c2541f':'#a8895a'}&quot;&gt;${top?'\\u2726':'\\u2116'+v}&lt;/span&gt;\n    &lt;/div&gt;`;\n  }).join('') + `&lt;/div&gt;`;\n}\n\n/* ---------- palette / helpers ---------- */\nconst FAC = { ua:'#c2541f', wow:'#ec5f99', snide:'#6fae00', ephemerists:'#1d6e72', singularity:'#2563eb', everymen:'#c1272d', albescent:'#8a8a86' };\nconst FACNAME = { ua:'UA', wow:'Wow', snide:'SNIDE', ephemerists:'Ephemerists', singularity:'Singularity', everymen:'Everymen', albescent:'Albescent' };\nconst AVC = ['#c2541f','#9c6a1a','#dd9322','#8f6a3a','#b5793a','#a86a2e'];\nfunction status(){ return `&lt;div class=&quot;statusbar&quot;&gt;&lt;span&gt;9:41&lt;/span&gt;&lt;span class=&quot;sig&quot;&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;span style=&quot;opacity:.55&quot;&gt;▮&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;`; }\nfunction appbar2(title,right){ return `&lt;div class=&quot;appbar&quot;&gt;&lt;div class=&quot;brand&quot;&gt;&lt;div class=&quot;brandmark&quot;&gt;&lt;/div&gt;&lt;div class=&quot;title-wrap&quot;&gt;&lt;div class=&quot;k&quot;&gt;UA&lt;/div&gt;&lt;div class=&quot;t&quot;&gt;${title}&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;${right||'&lt;span style=&quot;width:36px&quot;&gt;&lt;/span&gt;'}&lt;/div&gt;`; }\nfunction topbar(title,right){ return `&lt;div class=&quot;topbar&quot;&gt;&lt;div class=&quot;back&quot;&gt;‹&lt;/div&gt;&lt;div class=&quot;tt&quot;&gt;${title||''}&lt;/div&gt;${right||'&lt;span style=&quot;width:34px&quot;&gt;&lt;/span&gt;'}&lt;/div&gt;`; }\nconst searchBtn = `&lt;button class=&quot;iconbtn&quot;&gt;${ICON.search}&lt;/button&gt;`;\nconst moreBtn = `&lt;div class=&quot;back&quot; style=&quot;font-size:20px;line-height:0&quot;&gt;⋯&lt;/div&gt;`;\nfunction pav(bg,l,cls){ return `&lt;div class=&quot;pav${cls?' '+cls:''}&quot; style=&quot;background:radial-gradient(circle at 35% 30%, ${bg}, #6a4416);color:#fdf6ea;border-radius:50%&quot;&gt;${l}&lt;/div&gt;`; }\nfunction diffDots(d){ return `&lt;span class=&quot;diff&quot;&gt;${[1,2,3].map(x=&gt;`&lt;i class=&quot;${x&lt;=d?'on':''}&quot;&gt;&lt;/i&gt;`).join('')}&lt;/span&gt;`; }\nfunction sec(label,right){ return `&lt;div class=&quot;sechead&quot; style=&quot;margin:14px 2px 2px&quot;&gt;&lt;span class=&quot;k&quot;&gt;${label}&lt;/span&gt;&lt;span class=&quot;rule&quot;&gt;&lt;/span&gt;${right||''}&lt;/div&gt;`; }\nfunction points(v){ return `&lt;span style=&quot;font-family:'Playfair Display',serif;font-style:italic;font-weight:700;font-size:17px;color:#c2541f&quot;&gt;${v}&lt;/span&gt;`; }\nfunction levelPill(n){ return `&lt;span style=&quot;display:inline-flex;align-items:center;font-family:'Marcellus SC',serif;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#9c6a1a;border:1px solid #cdab63;border-radius:2px;padding:3px 9px&quot;&gt;Lv ${n}&lt;/span&gt;`; }\nfunction goldStars(n){ let s=''; for(let i=1;i&lt;=5;i++) s+=`&lt;span style=&quot;color:${i&lt;=n?'#9c6a1a':'#d8c49a'}&quot;&gt;★&lt;/span&gt;`; return `&lt;span style=&quot;font-size:14px;letter-spacing:1px&quot;&gt;${s}&lt;/span&gt;`; }\n\n/* ---------- HOME ---------- */\nconst VOICE = { charK:'Your standing', tasksK:'Open commissions', link:'All', browse:'Browse Commissions', post:'Exhibit Praxis', fac:'UA' };\nfunction home(){\n  const v = VOICE;\n  const activeTasks = [\n    { t:'Knowledge Is Free', fac:'ua', facName:'UA', pv:25, slots:'5 / 12', prog:42 },\n    { t:'Let Him (or Her) Cook', fac:'wow', facName:'Wow', pv:30, slots:'Open', prog:null }\n  ];\n  const rows = activeTasks.map(t=&gt;`\n    &lt;div class=&quot;trow&quot; role=&quot;button&quot; tabindex=&quot;0&quot;&gt;\n      &lt;span class=&quot;dot&quot; style=&quot;background:${FAC[t.fac]}&quot;&gt;&lt;/span&gt;\n      &lt;div class=&quot;tmid&quot;&gt;\n        &lt;div class=&quot;tt&quot;&gt;${t.t}&lt;/div&gt;\n        &lt;div class=&quot;tm&quot;&gt;&lt;span class=&quot;fac&quot;&gt;${t.facName}&lt;/span&gt;&lt;span&gt;·&lt;/span&gt;&lt;span class=&quot;pv&quot;&gt;+${t.pv} pts&lt;/span&gt;&lt;span&gt;·&lt;/span&gt;&lt;span&gt;${t.slots}&lt;/span&gt;&lt;/div&gt;\n        ${t.prog!=null?`&lt;div class=&quot;mini-bar&quot;&gt;&lt;i style=&quot;width:${t.prog}%&quot;&gt;&lt;/i&gt;&lt;/div&gt;`:''}\n      &lt;/div&gt;\n      &lt;span class=&quot;chev&quot;&gt;›&lt;/span&gt;\n    &lt;/div&gt;`).join('');\n  return `\n  ${status()}\n  &lt;div class=&quot;appbar&quot;&gt;\n    &lt;div class=&quot;brand&quot;&gt;&lt;div class=&quot;brandmark&quot;&gt;&lt;/div&gt;\n      &lt;div class=&quot;title-wrap&quot;&gt;&lt;div class=&quot;k&quot;&gt;UA&lt;/div&gt;&lt;div class=&quot;t&quot;&gt;FieldDesk&lt;/div&gt;&lt;/div&gt;\n    &lt;/div&gt;\n    &lt;button class=&quot;iconbtn&quot;&gt;${ICON.bell}&lt;/button&gt;\n  &lt;/div&gt;\n  &lt;div class=&quot;body&quot;&gt;\n    ${uaPlate(`\n      &lt;div style=&quot;display:flex;align-items:center;gap:6px;justify-content:center;margin-bottom:4px&quot;&gt;${crest(46)}&lt;/div&gt;\n      ${regal('University of Asthmatics')}\n      ${est('Artist in Residence · Level 4')}\n      &lt;div style=&quot;margin:12px 0 10px&quot;&gt;${ribbon('Ars Longa · Spiritus Brevis',10)}&lt;/div&gt;\n      &lt;div class=&quot;char-id&quot; style=&quot;width:100%;text-align:left&quot;&gt;\n        &lt;div class=&quot;ring&quot;&gt;&lt;div class=&quot;av&quot;&gt;M&lt;/div&gt;&lt;/div&gt;\n        &lt;div class=&quot;who&quot;&gt;\n          &lt;div class=&quot;name&quot;&gt;Molly &lt;span class=&quot;caret&quot;&gt;▾&lt;/span&gt;&lt;/div&gt;\n          &lt;div class=&quot;meta&quot;&gt;&lt;span style=&quot;color:#c2541f&quot;&gt;${v.fac}&lt;/span&gt; &lt;span class=&quot;sep&quot;&gt;·&lt;/span&gt; Level 4&lt;/div&gt;\n        &lt;/div&gt;\n        &lt;div class=&quot;pts&quot;&gt;${points(340)}&lt;span style=&quot;display:block;font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:#a8895a;margin-top:2px&quot;&gt;Standing&lt;/span&gt;&lt;/div&gt;\n      &lt;/div&gt;\n      &lt;div class=&quot;stats&quot;&gt;\n        &lt;div class=&quot;stat&quot;&gt;&lt;b&gt;340&lt;/b&gt;&lt;span&gt;Points&lt;/span&gt;&lt;/div&gt;\n        &lt;div class=&quot;stat&quot;&gt;&lt;b&gt;12&lt;/b&gt;&lt;span&gt;Appraisals&lt;/span&gt;&lt;/div&gt;\n        &lt;div class=&quot;stat&quot;&gt;&lt;b&gt;III&lt;/b&gt;&lt;span&gt;Era&lt;/span&gt;&lt;/div&gt;\n      &lt;/div&gt;\n      &lt;div class=&quot;ua-hairline&quot; style=&quot;width:100%;margin:14px 0 0&quot;&gt;&lt;/div&gt;\n      &lt;div class=&quot;sechead&quot; style=&quot;margin:12px 0 0;width:100%&quot;&gt;&lt;span class=&quot;k&quot;&gt;${v.charK}&lt;/span&gt;&lt;span class=&quot;rule&quot;&gt;&lt;/span&gt;&lt;span style=&quot;display:flex;gap:14px;flex:none&quot;&gt;&lt;a href=&quot;#&quot;&gt;Switch&lt;/a&gt;&lt;a href=&quot;#&quot;&gt;Edit&lt;/a&gt;&lt;/span&gt;&lt;/div&gt;\n    `,{center:true,pad:'padding:22px 20px 16px'})}\n\n    ${uaPlate(`\n      ${regal('Open commissions · 2')}\n      &lt;div class=&quot;ua-hairline&quot; style=&quot;margin:8px 0 6px&quot;&gt;&lt;/div&gt;\n      &lt;div class=&quot;sechead&quot; style=&quot;margin:2px 0 4px&quot;&gt;&lt;span class=&quot;k&quot;&gt;${v.tasksK}&lt;/span&gt;&lt;span class=&quot;rule&quot;&gt;&lt;/span&gt;&lt;a href=&quot;#&quot;&gt;${v.link}&lt;/a&gt;&lt;/div&gt;\n      &lt;div class=&quot;tasks&quot;&gt;${rows}&lt;/div&gt;\n    `,{rot:1,center:false,pad:'padding:18px 20px 12px'})}\n\n    &lt;div class=&quot;actions&quot;&gt;\n      &lt;button class=&quot;btn primary&quot;&gt;${v.browse}&lt;/button&gt;\n      &lt;button class=&quot;btn ghost&quot;&gt;&lt;span class=&quot;plus&quot;&gt;+&lt;/span&gt; ${v.post}&lt;/button&gt;\n    &lt;/div&gt;\n  &lt;/div&gt;\n  &lt;div class=&quot;tabbar&quot;&gt;${tabbar(0)}&lt;/div&gt;`;\n}\n\n/* ---------- TASKS ---------- */\nconst TASKS = [\n  { t:'Knowledge Is Free', fac:'ua', desc:'Teach a real skill to someone for free. Proof is their words, not yours.', pv:25, diff:2, slots:'5 / 12', lv:2, id:'MMXX-42' },\n  { t:'Let Him (or Her) Cook', fac:'wow', desc:'Cook a meal from scratch for people you love. Feed at least three.', pv:30, diff:3, slots:'Open', lv:3, id:'MMXX-51' },\n  { t:'A Very Human Thing', fac:'everymen', desc:'Do something quietly kind for a stranger, then write it down.', pv:20, diff:1, slots:'1 / 20', lv:1, id:'MMXX-07' },\n  { t:'Somewhere No One Needs To Be', fac:'ephemerists', desc:'Go to a place with no purpose. Document the nothing you find.', pv:15, diff:2, slots:'3 slots', lv:2, id:'MMXX-33' }\n];\nfunction taskCard(t,i){\n  return uaPlate(`\n    ${crest(56)}\n    ${regal('University of Asthmatics')}\n    ${est('Commission № '+t.id)}\n    &lt;div style=&quot;margin:10px 0 8px&quot;&gt;${ribbon('Ars Longa · Spiritus Brevis',9)}&lt;/div&gt;\n    &lt;div class=&quot;tcard-title&quot; style=&quot;font-size:20px;margin:2px 0 6px&quot;&gt;${t.t}&lt;/div&gt;\n    &lt;p style=&quot;font-family:'EB Garamond',serif;font-size:13.5px;line-height:1.55;color:#8f6a3a;margin:0 0 6px&quot;&gt;${t.desc}&lt;/p&gt;\n    &lt;div class=&quot;ua-regal ua-gold&quot; style=&quot;color:#9c6a1a;margin:4px 0 12px&quot;&gt;UA · ${t.pv} pts&lt;/div&gt;\n    &lt;button class=&quot;btn primary&quot; style=&quot;font-family:'Marcellus SC',serif;font-size:10px;letter-spacing:.12em;padding:8px 24px;flex:none;margin-bottom:12px&quot;&gt;Matriculate&lt;/button&gt;\n    &lt;div class=&quot;ua-hairline&quot; style=&quot;width:100%&quot;&gt;&lt;/div&gt;\n    &lt;div style=&quot;display:flex;align-items:center;justify-content:space-between;width:100%;padding-top:10px&quot;&gt;${levelPill(t.lv)}${points('+'+t.pv)}&lt;/div&gt;\n  `,{rot: i%2, center:true, pad:'padding:20px 20px 14px'});\n}\nfunction tasksBrowse(){\n  return status() + appbar2('Tasks', searchBtn) +\n  `&lt;div class=&quot;body&quot;&gt;\n    &lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip2 on&quot;&gt;All&lt;/span&gt;&lt;span class=&quot;chip2&quot;&gt;Solo&lt;/span&gt;&lt;span class=&quot;chip2&quot;&gt;Collab&lt;/span&gt;&lt;span class=&quot;chip2&quot;&gt;Open slots&lt;/span&gt;&lt;span class=&quot;sortbtn&quot;&gt;⇅ Sort&lt;/span&gt;&lt;/div&gt;\n    ${TASKS.map(taskCard).join('')}\n  &lt;/div&gt;` + `&lt;div class=&quot;tabbar&quot;&gt;${tabbar(1)}&lt;/div&gt;`;\n}\nfunction taskDetail(){\n  const proofs = [ { a:'Perpetua', av:AVC[4], r:5 }, { a:'Reza', av:AVC[3], r:4 }, { a:'Bo', av:AVC[5], r:4 } ];\n  return status() + topbar('', moreBtn) +\n  `&lt;div class=&quot;body&quot; style=&quot;padding-top:0&quot;&gt;\n    ${uaPlate(`\n      ${crest(64)}\n      ${regal('University of Asthmatics')}\n      ${est('Commission № MMXX-42')}\n      &lt;div style=&quot;margin:12px 0 10px&quot;&gt;${ribbon('Ars Longa · Spiritus Brevis',10)}&lt;/div&gt;\n      &lt;div class=&quot;stitle&quot; style=&quot;font-size:27px;margin:2px 0 10px&quot;&gt;Knowledge Is Free&lt;/div&gt;\n      &lt;div class=&quot;ua-hairline&quot; style=&quot;width:100%&quot;&gt;&lt;/div&gt;\n      &lt;div style=&quot;display:flex;align-items:center;justify-content:space-between;width:100%;padding-top:10px&quot;&gt;${levelPill(2)}${diffDots(2)}&lt;span class=&quot;metatxt&quot;&gt;5 / 12&lt;/span&gt;${points('+25')}&lt;/div&gt;\n    `,{center:true,wrap:'margin-top:6px',pad:'padding:22px 22px 16px'})}\n    &lt;p class=&quot;para&quot; style=&quot;margin-top:18px&quot;&gt;Teach a real skill to someone for free — no fee, no favour owed. Then bring back their words about what they learned, not yours.&lt;/p&gt;\n    &lt;p class=&quot;para&quot;&gt;A collaborative commission. Proof is a short account and, if they will give it, a line from the person you taught.&lt;/p&gt;\n    ${sec('Exhibited proofs · 3')}\n    &lt;div&gt;${proofs.map(p=&gt;`&lt;div class=&quot;cmt&quot; style=&quot;align-items:center&quot;&gt;&lt;div class=&quot;cav&quot; style=&quot;background:radial-gradient(circle at 35% 30%, ${p.av}, #6a4416);color:#fdf6ea&quot;&gt;${p.a[0]}&lt;/div&gt;&lt;div class=&quot;cb&quot;&gt;&lt;div class=&quot;cn&quot;&gt;${p.a}&lt;/div&gt;${goldStars(p.r)}&lt;/div&gt;&lt;div class=&quot;media&quot; style=&quot;width:46px;height:46px;flex:none&quot;&gt;IMG&lt;/div&gt;&lt;/div&gt;`).join('')}&lt;/div&gt;\n    ${sec('Critique · 2')}\n    &lt;div class=&quot;cmt&quot;&gt;&lt;div class=&quot;cav&quot; style=&quot;background:radial-gradient(circle at 35% 30%, ${AVC[0]}, #6a4416);color:#fdf6ea&quot;&gt;M&lt;/div&gt;&lt;div class=&quot;cb&quot;&gt;&lt;div class=&quot;cn&quot;&gt;Molly &lt;span style=&quot;color:var(--text-3);font-weight:400&quot;&gt;· 1d&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ct&quot;&gt;Signing up. Teaching a neighbour to bind a book by hand.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;\n    &lt;div class=&quot;cmt&quot;&gt;&lt;div class=&quot;cav&quot; style=&quot;background:radial-gradient(circle at 35% 30%, ${AVC[3]}, #6a4416);color:#fdf6ea&quot;&gt;R&lt;/div&gt;&lt;div class=&quot;cb&quot;&gt;&lt;div class=&quot;cn&quot;&gt;Reza &lt;span style=&quot;color:var(--text-3);font-weight:400&quot;&gt;· 3d&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ct&quot;&gt;The finest commission of the era. Their words back are the whole reward.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;\n  &lt;/div&gt;\n  &lt;div class=&quot;sticky-cta&quot;&gt;&lt;button class=&quot;btn primary&quot; style=&quot;flex:1&quot;&gt;Matriculate — sign up&lt;/button&gt;&lt;/div&gt;`;\n}\n\n/* ---------- PRAXIS ---------- */\nconst PROOFS = [\n  { a:'Perpetua', av:AVC[4], fac:'ua', t:'A hand-bound field ledger, gilt-edged', r:5, v:190, c:22, time:'2h' },\n  { a:'Reza', av:AVC[3], fac:'ua', t:'Letters drawn by hand for a stranger', r:4, v:151, c:18, time:'6h' },\n  { a:'Bo', av:AVC[5], fac:null, t:'Repaired a chair, kept the maker\\u2019s marks', r:4, v:77, c:9, time:'1d' }\n];\nfunction proofCard(p){\n  return `&lt;div class=&quot;pcard&quot; style=&quot;background:none;border:0;box-shadow:none;overflow:visible&quot;&gt;\n    &lt;div class=&quot;pcard-head&quot; style=&quot;padding:0 0 10px&quot;&gt;${pav(p.av,p.a[0])}&lt;div&gt;&lt;div class=&quot;nm&quot;&gt;${p.a}&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;span style=&quot;color:${p.fac?FAC[p.fac]:'var(--text-3)'}&quot;&gt;●&lt;/span&gt; ${p.fac?'University of Asthmatics':'Unaffiliated'} · ${p.time} ago&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;\n    ${uaPlate(`\n      &lt;div class=&quot;media&quot; style=&quot;height:150px;border:1px solid #e3cb98&quot;&gt;Exhibit&lt;/div&gt;\n      &lt;div class=&quot;tcard-title&quot; style=&quot;font-size:16px;margin:12px 0 8px&quot;&gt;${p.t}&lt;/div&gt;\n      &lt;div class=&quot;ua-hairline&quot; style=&quot;width:100%&quot;&gt;&lt;/div&gt;\n      &lt;div style=&quot;display:flex;align-items:center;justify-content:space-between;width:100%;padding-top:9px&quot;&gt;${goldStars(p.r)}&lt;span class=&quot;votecount&quot;&gt;${p.r.toFixed(1)} · ${p.v} appraisals&lt;/span&gt;&lt;/div&gt;\n    `,{rot:false,center:false,pad:'padding:14px 14px 12px'})}\n  &lt;/div&gt;`;\n}\nfunction praxisFeed(){\n  return status() + appbar2('Praxis', searchBtn) +\n  `&lt;div class=&quot;body&quot;&gt;\n    &lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip2 on&quot;&gt;Latest&lt;/span&gt;&lt;span class=&quot;chip2&quot;&gt;Most appraised&lt;/span&gt;&lt;span class=&quot;chip2&quot;&gt;Following&lt;/span&gt;&lt;/div&gt;\n    ${PROOFS.map(proofCard).join('')}\n  &lt;/div&gt;` + `&lt;div class=&quot;tabbar&quot;&gt;${tabbar(2)}&lt;/div&gt;`;\n}\nfunction praxisDetail(){\n  return status() + topbar('', moreBtn) +\n  `&lt;div class=&quot;body&quot; style=&quot;padding-top:2px&quot;&gt;\n    &lt;div class=&quot;pcard-head&quot; style=&quot;padding:4px 0 12px&quot;&gt;${pav(AVC[4],'P')}&lt;div style=&quot;flex:1&quot;&gt;&lt;div class=&quot;nm&quot;&gt;Perpetua&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;span style=&quot;color:${FAC.ua}&quot;&gt;●&lt;/span&gt; University of Asthmatics · 2h ago&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;chip2&quot;&gt;Follow&lt;/span&gt;&lt;/div&gt;\n    ${uaPlate(`&lt;div class=&quot;media&quot; style=&quot;height:210px;border:1px solid #e3cb98&quot;&gt;Exhibit&lt;/div&gt;`,{rot:false,center:false,pad:'padding:11px'})}\n    &lt;div class=&quot;stitle&quot; style=&quot;font-size:22px;margin:16px 0 4px&quot;&gt;A hand-bound field ledger, gilt-edged&lt;/div&gt;\n    &lt;div class=&quot;mdprev&quot; style=&quot;margin-top:8px&quot;&gt;\n      &lt;p&gt;Sewn on tapes, edges laid with imitation gold, the whole thing small enough to carry. A month of evenings.&lt;/p&gt;\n      &lt;p&gt;The point was patience — a made thing that rewards a second look, exactly what the Salon commissions.&lt;/p&gt;\n    &lt;/div&gt;\n    &lt;div class=&quot;votebar&quot; style=&quot;margin:10px 0 4px;align-items:stretch;background:#fdf6ea;border:1px solid #e3cb98&quot;&gt;\n      &lt;div class=&quot;votelbl&quot; style=&quot;text-align:center;margin-bottom:6px;color:#8f6a3a&quot;&gt;Appraise this work&lt;/div&gt;\n      ${uaVote(5)}\n      &lt;div class=&quot;votelbl&quot; style=&quot;text-align:center;margin-top:10px;color:#8f6a3a&quot;&gt;Masterwork · 190 appraisals&lt;/div&gt;\n    &lt;/div&gt;\n    ${sec('Critique · 3')}\n    &lt;div class=&quot;cmt&quot;&gt;&lt;div class=&quot;cav&quot; style=&quot;background:radial-gradient(circle at 35% 30%, ${AVC[3]}, #6a4416);color:#fdf6ea&quot;&gt;R&lt;/div&gt;&lt;div class=&quot;cb&quot;&gt;&lt;div class=&quot;cn&quot;&gt;Reza &lt;span style=&quot;color:var(--text-3);font-weight:400&quot;&gt;· 1h&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ct&quot;&gt;Distinguished, easily. The gilt edges alone earn a second look.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;\n    &lt;div class=&quot;cmt&quot;&gt;&lt;div class=&quot;cav&quot; style=&quot;background:radial-gradient(circle at 35% 30%, ${AVC[5]}, #6a4416);color:#fdf6ea&quot;&gt;B&lt;/div&gt;&lt;div class=&quot;cb&quot;&gt;&lt;div class=&quot;cn&quot;&gt;Bo &lt;span style=&quot;color:var(--text-3);font-weight:400&quot;&gt;· 40m&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ct&quot;&gt;Ars longa indeed. Teach the sewing next.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;\n  &lt;/div&gt;\n  &lt;div class=&quot;sticky-cta&quot;&gt;&lt;div class=&quot;searchbar&quot; style=&quot;flex:1;border-radius:2px&quot;&gt;Add to the critique…&lt;/div&gt;&lt;button class=&quot;btn primary&quot; style=&quot;flex:none;padding:13px 16px&quot;&gt;Post&lt;/button&gt;&lt;/div&gt;`;\n}\nfunction composerWrite(){\n  return status() +\n  `&lt;div class=&quot;topbar&quot;&gt;&lt;a href=&quot;#&quot; class=&quot;act&quot; style=&quot;color:var(--text-2)&quot;&gt;Cancel&lt;/a&gt;&lt;div class=&quot;tt&quot; style=&quot;flex:1;text-align:center;font-size:19px&quot;&gt;Exhibit Praxis&lt;/div&gt;&lt;a href=&quot;#&quot; class=&quot;act&quot;&gt;Exhibit&lt;/a&gt;&lt;/div&gt;\n  &lt;div class=&quot;body&quot; style=&quot;gap:14px&quot;&gt;\n    &lt;div class=&quot;seg&quot;&gt;&lt;button class=&quot;on&quot;&gt;Write&lt;/button&gt;&lt;button&gt;Preview&lt;/button&gt;&lt;/div&gt;\n    &lt;div class=&quot;forrow&quot;&gt;&lt;span&gt;FOR COMMISSION&lt;/span&gt;&lt;b&gt;Knowledge Is Free ▾&lt;/b&gt;&lt;/div&gt;\n    &lt;input class=&quot;field&quot; value=&quot;A hand-bound field ledger, gilt-edged&quot; /&gt;\n    &lt;textarea class=&quot;ta&quot;&gt;## What I made\n\nSewn on tapes, edges laid with imitation gold, small enough to carry in a coat pocket.\n\n- a month of evenings\n- 96 leaves, hand-numbered\n- one thumb, permanently gilt&lt;/textarea&gt;\n    &lt;div&gt;&lt;label class=&quot;form-lbl&quot;&gt;Plates&lt;/label&gt;&lt;div class=&quot;mgrid&quot;&gt;&lt;div class=&quot;media&quot;&gt;Exhibit&lt;/div&gt;&lt;div class=&quot;media&quot;&gt;Exhibit&lt;/div&gt;&lt;div class=&quot;madd&quot;&gt;+&lt;small&gt;Add&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;\n  &lt;/div&gt;\n  &lt;div class=&quot;kbd-acc&quot;&gt;&lt;span style=&quot;font-weight:700&quot;&gt;B&lt;/span&gt;&lt;span style=&quot;font-style:italic&quot;&gt;I&lt;/span&gt;&lt;span&gt;#&lt;/span&gt;&lt;span&gt;“ ”&lt;/span&gt;&lt;span&gt;≡&lt;/span&gt;&lt;span class=&quot;ph&quot;&gt;▦ Plate&lt;/span&gt;&lt;/div&gt;\n  &lt;div class=&quot;kbd&quot;&gt;On-screen keyboard&lt;/div&gt;`;\n}\nfunction composerPreview(){\n  return status() +\n  `&lt;div class=&quot;topbar&quot;&gt;&lt;a href=&quot;#&quot; class=&quot;act&quot; style=&quot;color:var(--text-2)&quot;&gt;Cancel&lt;/a&gt;&lt;div class=&quot;tt&quot; style=&quot;flex:1;text-align:center;font-size:19px&quot;&gt;Exhibit Praxis&lt;/div&gt;&lt;a href=&quot;#&quot; class=&quot;act&quot;&gt;Exhibit&lt;/a&gt;&lt;/div&gt;\n  &lt;div class=&quot;body&quot; style=&quot;gap:14px&quot;&gt;\n    &lt;div class=&quot;seg&quot;&gt;&lt;button&gt;Write&lt;/button&gt;&lt;button class=&quot;on&quot;&gt;Preview&lt;/button&gt;&lt;/div&gt;\n    ${uaPlate(`\n      ${regal('University of Asthmatics')}\n      ${est('Exhibit · draft')}\n      &lt;div class=&quot;media&quot; style=&quot;height:160px;border:1px solid #e3cb98;margin:12px 0 12px&quot;&gt;Exhibit&lt;/div&gt;\n      &lt;div class=&quot;tcard-title&quot; style=&quot;font-size:18px;margin:0 0 10px&quot;&gt;A hand-bound field ledger, gilt-edged&lt;/div&gt;\n      &lt;div class=&quot;mdprev&quot; style=&quot;text-align:left;width:100%&quot;&gt;\n        &lt;p&gt;Sewn on tapes, edges laid with imitation gold, small enough to carry in a coat pocket.&lt;/p&gt;\n        &lt;ul style=&quot;margin:0;padding:0;list-style:none&quot;&gt;&lt;li&gt;• a month of evenings&lt;/li&gt;&lt;li&gt;• 96 leaves, hand-numbered&lt;/li&gt;&lt;li&gt;• one thumb, permanently gilt&lt;/li&gt;&lt;/ul&gt;\n      &lt;/div&gt;\n    `,{rot:false,center:true,pad:'padding:20px 18px 16px'})}\n  &lt;/div&gt;\n  &lt;div class=&quot;sticky-cta&quot;&gt;&lt;button class=&quot;btn primary&quot; style=&quot;flex:1&quot;&gt;Exhibit this work&lt;/button&gt;&lt;/div&gt;`;\n}\n\n/* ---------- UPDATES ---------- */\nfunction screenUpdates(){\n  const row = (unread,text,time) =&gt; `&lt;div class=&quot;up-row${unread?'':' read'}&quot;&gt;&lt;span class=&quot;udot&quot; style=&quot;${unread?'background:#c2541f':''}&quot;&gt;&lt;/span&gt;&lt;div class=&quot;ub&quot;&gt;&lt;div class=&quot;utext&quot;&gt;${text}&lt;/div&gt;&lt;div class=&quot;utime&quot; style=&quot;${unread?'color:#9c6a1a':''}&quot;&gt;${time}&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;`;\n  const day = (label) =&gt; `&lt;div class=&quot;up-group&quot;&gt;${label}&lt;/div&gt;&lt;div class=&quot;ua-hairline&quot; style=&quot;margin:2px 4px 4px&quot;&gt;&lt;/div&gt;`;\n  return status() + topbar('The Register') +\n  `&lt;div class=&quot;body&quot; style=&quot;padding-top:0&quot;&gt;\n    ${day('Today')}\n    ${row(true,'&lt;b&gt;Reza&lt;/b&gt; appraised your work &lt;b style=&quot;color:#9c6a1a&quot;&gt;masterwork&lt;/b&gt;.','2h ago')}\n    ${row(true,'You matriculated to &lt;b&gt;Level 4&lt;/b&gt; — two commissions unlocked.','5h ago')}\n    ${row(true,'New commission in &lt;b&gt;UA&lt;/b&gt;: “Knowledge Is Free”, +25 pts.','9h ago')}\n    ${day('Earlier')}\n    ${row(false,'&lt;b&gt;Perpetua&lt;/b&gt; added to the critique on your ledger.','2d ago')}\n    ${row(false,'&lt;b&gt;Bo&lt;/b&gt; is now following your exhibitions.','3d ago')}\n    ${row(false,'Your commission &lt;b&gt;Knowledge Is Free&lt;/b&gt; took a new patron.','4d ago')}\n  &lt;/div&gt;` + `&lt;div class=&quot;tabbar&quot;&gt;${tabbar(0)}&lt;/div&gt;`;\n}\n\n/* ---------- FACTION PAGE ---------- */\nconst PLAYERS = [\n  { n:'Perpetua', lv:9, pts:'2,140', av:AVC[4] },\n  { n:'Reza', lv:7, pts:'1,880', av:AVC[3] },\n  { n:'Molly', lv:4, pts:'340', av:AVC[0] }\n];\nfunction factionDetail(){\n  const statPlate = (val,lbl) =&gt; `&lt;div class=&quot;ua-gilt&quot; style=&quot;flex:1;padding:3px&quot;&gt;&lt;div class=&quot;ua-plate&quot; style=&quot;text-align:center;padding:10px 6px 8px&quot;&gt;&lt;b style=&quot;display:block;font-family:'Playfair Display',serif;font-style:italic;font-weight:700;font-size:22px;line-height:1;color:#c2541f&quot;&gt;${val}&lt;/b&gt;&lt;span style=&quot;font-family:'Marcellus SC',serif;font-size:7.5px;letter-spacing:.14em;text-transform:uppercase;color:#a8895a&quot;&gt;${lbl}&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;`;\n  return status() + topbar('', moreBtn) +\n  `&lt;div class=&quot;body&quot; style=&quot;padding-top:2px&quot;&gt;\n    ${uaPlate(`\n      ${crest(76)}\n      ${regal('University of Asthmatics')}\n      ${est('The Gilt Salon · Faction № 3')}\n      &lt;div class=&quot;stitle&quot; style=&quot;font-family:'Playfair Display',serif;font-style:italic;font-weight:700;font-size:52px;line-height:1;margin:12px 0 12px;color:#3d2410&quot;&gt;UA&lt;/div&gt;\n      &lt;div style=&quot;margin-bottom:6px&quot;&gt;${ribbon('Ars Longa · Spiritus Brevis',12)}&lt;/div&gt;\n    `,{rot:false,center:true,wrap:'margin-top:4px',pad:'padding:26px 20px 22px'})}\n    &lt;div style=&quot;display:flex;gap:10px;margin-top:14px&quot;&gt;${statPlate('214','Patrons')}${statPlate('38','Commissions')}${statPlate('III','Era')}&lt;/div&gt;\n    &lt;p class=&quot;para&quot; style=&quot;margin-top:16px&quot;&gt;A regal academy that frames good work in gold and hangs it where the world walks. UA keeps the slow arts — drawing, letters, the patient made things — and acquires only what deserves a second look. Matriculate and your whole app becomes a salon.&lt;/p&gt;\n    ${sec('Artists in residence')}\n    &lt;div&gt;${PLAYERS.map((p,i)=&gt;`&lt;div class=&quot;prow2&quot;&gt;&lt;div class=&quot;rank&quot;&gt;${i+1}&lt;/div&gt;${pav(p.av,p.n[0])}&lt;div class=&quot;pinfo&quot;&gt;&lt;div class=&quot;n&quot;&gt;${p.n}&lt;/div&gt;&lt;div class=&quot;m&quot;&gt;&lt;i style=&quot;background:${FAC.ua}&quot;&gt;&lt;/i&gt;UA · Lv ${p.lv}&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ppts2&quot;&gt;&lt;b&gt;${p.pts}&lt;/b&gt;&lt;span&gt;pts&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;`).join('')}&lt;/div&gt;\n    ${sec('Recent exhibitions')}\n    &lt;div class=&quot;thumbs&quot; style=&quot;margin-top:8px&quot;&gt;${Array.from({length:3}).map(()=&gt;`&lt;div class=&quot;media&quot; style=&quot;aspect-ratio:1;border:1px solid #e3cb98&quot;&gt;Exhibit&lt;/div&gt;`).join('')}&lt;/div&gt;\n  &lt;/div&gt;\n  &lt;div class=&quot;sticky-cta&quot;&gt;&lt;button class=&quot;btn primary&quot; style=&quot;flex:1&quot;&gt;Matriculate into UA&lt;/button&gt;&lt;/div&gt;`;\n}\n\n/* ---------- render (UA · native light) ---------- */\nfunction renderRail(id, list){\n  document.getElementById(id).innerHTML = list.map(([label,fn])=&gt;`\n    &lt;div class=&quot;phone-wrap&quot;&gt;\n      &lt;div class=&quot;phone-tag&quot;&gt;&lt;b&gt;${label}&lt;/b&gt; · Light&lt;/div&gt;\n      &lt;div class=&quot;phone&quot;&gt;&lt;div class=&quot;screen&quot; data-theme=&quot;light&quot; data-treatment=&quot;ua&quot;&gt;${fn()}&lt;/div&gt;&lt;/div&gt;\n    &lt;/div&gt;`).join('');\n}\nrenderRail('homeRail',    [['Home', home]]);\nrenderRail('tasksRail',   [['Browse', tasksBrowse], ['Detail', taskDetail]]);\nrenderRail('praxisRail',  [['Feed', praxisFeed], ['Detail', praxisDetail], ['Compose · Write', composerWrite], ['Compose · Preview', composerPreview]]);\nrenderRail('updatesRail', [['Register', screenUpdates]]);\nrenderRail('factionRail', [['Faction page', factionDetail]]);\n\n/* ---------- anatomy + kit specimens ---------- */\ndocument.getElementById('anatomy').innerHTML =\n  `&lt;div class=&quot;screen&quot; data-theme=&quot;light&quot; data-treatment=&quot;ua&quot; style=&quot;border-radius:6px;overflow:hidden;height:auto;background:#f3e8d2;padding:18px&quot;&gt;\n     ${uaPlate(`${crest(52)}${regal('University of Asthmatics')}${est('Commission № MMXX-42')}&lt;div style=&quot;margin:10px 0 8px&quot;&gt;${ribbon('Ars Longa · Spiritus Brevis',9)}&lt;/div&gt;&lt;div class=&quot;tcard-title&quot; style=&quot;font-size:19px;margin:2px 0 6px&quot;&gt;Knowledge Is Free&lt;/div&gt;&lt;div class=&quot;ua-regal ua-gold&quot; style=&quot;color:#9c6a1a;margin-top:6px&quot;&gt;UA · 25 pts&lt;/div&gt;`,{center:true,pad:'padding:20px 20px 16px'})}\n   &lt;/div&gt;`;\ndocument.getElementById('uakit').innerHTML =\n  `&lt;div style=&quot;display:flex;align-items:flex-end;gap:22px;flex-wrap:wrap;margin-bottom:16px&quot;&gt;\n     ${crest(52)}\n     &lt;div style=&quot;display:flex;flex-direction:column;gap:10px&quot;&gt;${ribbon('Ars Longa · Spiritus Brevis',11)}&lt;div class=&quot;ua-gilt&quot; style=&quot;width:120px;padding:4px&quot;&gt;&lt;div class=&quot;ua-plate&quot; style=&quot;height:26px;background absolute;inset:0;background:rgba(10,8,14,.72);z-index:5;display:flex;align-items:center;justify-content:center;border-radius:36px;overflow:hidden}\n.lu-card{width:78%;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:26px 20px;text-align:center;position:relative;z-index:2;box-shadow:0 20px 50px rgba(0,0,0,.5)}\n.lu-burst{width:88px;height:88px;border-radius:50%;margin:0 auto 15px;background:var(--ring);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(0,0,0,.3)}\n.lu-burst b{font-family:var(--headline);font-style:var(--headline-style);font-size:36px;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.35)}\n.lu-card h3{font-family:var(--headline);font-style:var(--headline-style);font-weight:var(--headline-weight);font-size:24px;margin:0 0 6px;color:var(--text-1)}\n.lu-card p{font-size:13px;line-height:1.5;color:var(--text-2);margin:0 0 18px}\n.confetti{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}\n.confetti i{position:absolute;width:8px;height:9px;border-radius:2px;top:-14px;animation:cfall linear infinite}\n@keyframes cfall{to{transform:translateY(620px) rotate(420deg)}}\n/* ---- sticky CTA (detail screens) ---- */\n.sticky-cta{padding:12px 16px 22px;background:var(--nav-bg);backdrop-filter:blur(12px);border-top:1px solid var(--border);display:flex;gap:10px;flex:none;align-items:center}\n\n@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}\n&lt;/style&gt;\n&lt;/head&gt;\n&lt;body&gt;\n&lt;template id=&quot;__bundler_thumbnail&quot;&gt;\n&lt;svg viewBox=&quot;0 0 400 400&quot; xmlns=&quot;http://www.w3.org/2000/svg&quot;&gt;\n  &lt;rect width=&quot;400&quot; height=&quot;400&quot; fill=&quot;#040b06&quot;/&gt;\n  &lt;rect x=&quot;118&quot; y=&quot;92&quot; width=&quot;164&quot; height=&quot;228&quot; fill=&quot;#050f08&quot; stroke=&quot;#2563eb&quot; stroke-width=&quot;2&quot;/&gt;\n  &lt;path d=&quot;M126 100 h10 M126 100 v10 M274 100 h-10 M274 100 v10 M126 312 h10 M126 312 v-10 M274 312 h-10 M274 312 v-10&quot; stroke=&quot;#4ade80&quot; stroke-width=&quot;1.5&quot;/&gt;\n  &lt;text x=&quot;132&quot; y=&quot;150&quot; font-family=&quot;monospace&quot; font-size=&quot;11&quot; fill=&quot;#60a5fa&quot;&gt;singularity protocol&lt;/text&gt;\n  &lt;text x=&quot;132&quot; y=&quot;180&quot; font-family=&quot;monospace&quot; font-size=&quot;15&quot; fill=&quot;#4ade80&quot;&gt;&amp;gt; Lacunae&lt;/text&gt;\n  &lt;rect x=&quot;132&quot; y=&quot;196&quot; width=&quot;6&quot; height=&quot;11&quot; fill=&quot;#4ade80&quot;/&gt;\n  &lt;text x=&quot;132&quot; y=&quot;240&quot; font-family=&quot;monospace&quot; font-size=&quot;12&quot; fill=&quot;#60a5fa&quot;&gt;PTS: &lt;tspan fill=&quot;#4ade80&quot;&gt;40&lt;/tspan&gt;&lt;/text&gt;\n  &lt;text x=&quot;132&quot; y=&quot;262&quot; font-family=&quot;monospace&quot; font-size=&quot;12&quot; fill=&quot;#60a5fa&quot;&gt;LVL: 3&lt;/text&gt;\n  &lt;g fill=&quot;#0a1a0e&quot; stroke=&quot;#4ade80&quot;&gt;&lt;rect x=&quot;150&quot; y=&quot;288&quot; width=&quot;7&quot; height=&quot;5&quot;/&gt;&lt;rect x=&quot;164&quot; y=&quot;288&quot; width=&quot;7&quot; height=&quot;5&quot;/&gt;&lt;rect x=&quot;178&quot; y=&quot;288&quot; width=&quot;7&quot; height=&quot;5&quot;/&gt;&lt;rect x=&quot;192&quot; y=&quot;288&quot; width=&quot;7&quot; height=&quot;5&quot;/&gt;&lt;rect x=&quot;206&quot; y=&quot;288&quot; width=&quot;7&quot; height=&quot;5&quot;/&gt;&lt;/g&gt;\n&lt;/svg&gt;\n&lt;/template&gt;\n&lt;div class=&quot;board&quot;&gt;\n\n  &lt;header class=&quot;board-head&quot;&gt;\n    &lt;p class=&quot;eyebrow&quot;&gt;World Zero · Singularity — the dark terminal&lt;/p&gt;\n    &lt;h1&gt;Join Singularity and the app boots into a phosphor terminal watching the noise floor.&lt;/h1&gt;\n    &lt;p&gt;Same 375px layout, same markup — running Singularity's real idiom. Cards go to a black readout (&lt;code style=&quot;color:#c8c4cd&quot;&gt;--faction-singularity-card-bg&lt;/code&gt; #050f08) hard-bordered in blue (&lt;code style=&quot;color:#c8c4cd&quot;&gt;--faction-singularity-border-hard&lt;/code&gt; #2563eb), typeset entirely in &lt;b style=&quot;color:#e9e6df&quot;&gt;Share Tech Mono&lt;/b&gt; (&lt;code style=&quot;color:#c8c4cd&quot;&gt;--font-faction-terminal&lt;/code&gt;). Acid-green output (&lt;code style=&quot;color:#c8c4cd&quot;&gt;#4ade80&lt;/code&gt;) on scan-lines, corner brackets and sprocket holes; every title reads from a &lt;b style=&quot;color:#e9e6df&quot;&gt;&gt; prompt&lt;/b&gt; trailed by a &lt;b style=&quot;color:#e9e6df&quot;&gt;blinking cursor&lt;/b&gt;; labels and meta in signal-blue (&lt;code style=&quot;color:#c8c4cd&quot;&gt;#60a5fa&lt;/code&gt;). Nothing invented — all &lt;code style=&quot;color:#c8c4cd&quot;&gt;--faction-singularity-*&lt;/code&gt;. Native mode: dark.&lt;/p&gt;\n    &lt;span class=&quot;stage&quot;&gt;Singularity (dark terminal) · phosphor mono · scan-lines + prompt · native dark&lt;/span&gt;\n  &lt;/header&gt;\n\n  &lt;!-- ============ THE IDIOM ============ --&gt;\n  &lt;div class=&quot;section-label&quot;&gt;&lt;span class=&quot;n&quot;&gt;01&lt;/span&gt;&lt;h2&gt;The idiom&lt;/h2&gt;&lt;span class=&quot;rule&quot;&gt;&lt;/span&gt;\n    &lt;p&gt;Singularity's signature is the &lt;b style=&quot;color:#e9e6df&quot;&gt;readout card&lt;/b&gt; — lifted from the real SingularityTaskCard: sprocket holes, corner brackets, a protocol line, a &gt; prompt title, PTS / LVL fields. Anatomy, then the terminal kit.&lt;/p&gt;\n  &lt;/div&gt;\n\n  &lt;div class=&quot;grid&quot; style=&quot;grid-template-columns:1fr 1fr&quot;&gt;\n    &lt;div class=&quot;spec&quot;&gt;\n      &lt;h3&gt;Readout-card anatomy&lt;/h3&gt;\n      &lt;p class=&quot;sub&quot;&gt;Sprockets → protocol line + cursor → &gt; prompt title → PTS / LVL fields → clamped brief → &gt; sign up → level pill. Same DOM slots as any faction card; only the chrome changes.&lt;/p&gt;\n      &lt;div id=&quot;anatomy&quot; style=&quot;max-width:250px&quot;&gt;&lt;/div&gt;\n    &lt;/div&gt;\n    &lt;div class=&quot;spec&quot;&gt;\n      &lt;h3&gt;Terminal kit&lt;/h3&gt;\n      &lt;p class=&quot;sub&quot;&gt;The pieces every Singularity surface is built from — corner brackets, sprocket rail, the blinking prompt, and the signal keypad (the Singularity vote).&lt;/p&gt;\n      &lt;div id=&quot;sgkit&quot; style=&quot;padding:18px 14px 10px;background:#040b06;border-radius:3px;margin-top:8px&quot;&gt;&lt;/div&gt;\n      &lt;p class=&quot;pattern-note&quot; style=&quot;margin-top:12px&quot;&gt;&lt;b&gt;Brackets + sprockets&lt;/b&gt; film-strip frame · &lt;b&gt;Prompt&lt;/b&gt; &gt; + blinking cursor · &lt;b&gt;Signal keypad&lt;/b&gt; five keys, NOISE → VERIFIED · &lt;b&gt;Scan-lines&lt;/b&gt; 2px green screen.&lt;/p&gt;\n    &lt;/div&gt;\n  &lt;/div&gt;\n\n  &lt;!-- ============ HOME ============ --&gt;\n  &lt;div class=&quot;section-label&quot;&gt;&lt;span class=&quot;n&quot;&gt;02&lt;/span&gt;&lt;h2&gt;FieldDesk — Home&lt;/h2&gt;&lt;span class=&quot;rule&quot;&gt;&lt;/span&gt;\n    &lt;p&gt;Node readout and open protocols, each a bracketed readout card on a black array. Actions keep their one-hand spot; the primary is acid green.&lt;/p&gt;\n  &lt;/div&gt;\n  &lt;div class=&quot;rail&quot; id=&quot;homeRail&quot;&gt;&lt;/div&gt;\n\n  &lt;!-- ============ TASKS ============ --&gt;\n  &lt;div class=&quot;section-label&quot;&gt;&lt;span class=&quot;n&quot;&gt;03&lt;/span&gt;&lt;h2&gt;Tasks&lt;/h2&gt;&lt;span class=&quot;rule&quot;&gt;&lt;/span&gt;\n    &lt;p&gt;Every task is an open protocol — sprockets, protocol line, &gt; prompt title, PTS / LVL fields. Detail keeps the sticky sign-up bar, logged traces and comments.&lt;/p&gt;\n  &lt;/div&gt;\n  &lt;div class=&quot;rail&quot; id=&quot;tasksRail&quot;&gt;&lt;/div&gt;\n\n  &lt;!-- ============ PRAXIS ============ --&gt;\n  &lt;div class=&quot;section-label&quot;&gt;&lt;span class=&quot;n&quot;&gt;04&lt;/span&gt;&lt;h2&gt;Praxis&lt;/h2&gt;&lt;span class=&quot;rule&quot;&gt;&lt;/span&gt;\n    &lt;p&gt;Evidence, traced: the capture bracketed into a readout card, &gt; prompt caption, the Singularity signal keypad. Detail has the full keypad; the composer keeps Write / Preview and the media grid.&lt;/p&gt;\n  &lt;/div&gt;\n  &lt;div class=&quot;rail&quot; id=&quot;praxisRail&quot;&gt;&lt;/div&gt;\n\n  &lt;!-- ============ UPDATES ============ --&gt;\n  &lt;div class=&quot;section-label&quot;&gt;&lt;span class=&quot;n&quot;&gt;05&lt;/span&gt;&lt;h2&gt;Updates&lt;/h2&gt;&lt;span class=&quot;rule&quot;&gt;&lt;/span&gt;\n    &lt;p&gt;The signal log — casts, promotions, comments, new protocols. Green ticks for unread, blue mono timestamps, sprocket rails between days.&lt;/p&gt;\n  &lt;/div&gt;\n  &lt;div class=&quot;rail&quot; id=&quot;updatesRail&quot;&gt;&lt;/div&gt;\n\n  &lt;!-- ============ FACTION PAGE ============ --&gt;\n  &lt;div class=&quot;section-label&quot;&gt;&lt;span class=&quot;n&quot;&gt;06&lt;/span&gt;&lt;h2&gt;Faction page — Singularity&lt;/h2&gt;&lt;span class=&quot;rule&quot;&gt;&lt;/span&gt;\n    &lt;p&gt;The pre-join boot screen: full Singularity dress — a boot readout, a giant phosphor wordmark, signal-blue stat fields — while an unaffiliated viewer's chrome stays neutral. &lt;b style=&quot;color:#e9e6df&quot;&gt;Join Singularity&lt;/b&gt; flips the whole app into this.&lt;/p&gt;\n  &lt;/div&gt;\n  &lt;div class=&quot;rail&quot; id=&quot;factionRail&quot;&gt;&lt;/div&gt;\n\n&lt;/div&gt;\n\n&lt;script&gt;\n/* ---------- icons ---------- */\nconst ICON = {\n  home:'&lt;svg viewBox=&quot;0 0 24 24&quot;&gt;&lt;path d=&quot;M4 11l8-6 8 6&quot;/&gt;&lt;path d=&quot;M6 10v9h12v-9&quot;/&gt;&lt;/svg&gt;',\n  tasks:'&lt;svg viewBox=&quot;0 0 24 24&quot;&gt;&lt;path d=&quot;M9 6h11M9 12h11M9 18h11&quot;/&gt;&lt;path d=&quot;M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2&quot;/&gt;&lt;/svg&gt;',\n  praxis:'&lt;svg viewBox=&quot;0 0 24 24&quot;&gt;&lt;path d=&quot;M12 4l2.3 4.9 5.2.7-3.8 3.6.9 5.3-4.6-2.6-4.6 2.6.9-5.3L5.5 9.6l5.2-.7z&quot;/&gt;&lt;/svg&gt;',\n  players:'&lt;svg viewBox=&quot;0 0 24 24&quot;&gt;&lt;circle cx=&quot;9&quot; cy=&quot;9&quot; r=&quot;3&quot;/&gt;&lt;path d=&quot;M4 19c0-2.8 2.2-5 5-5s5 2.2 5 5&quot;/&gt;&lt;path d=&quot;M16 7.5a3 3 0 010 5.4M15 14.6c2.3.5 4 2.3 4 4.4&quot;/&gt;&lt;/svg&gt;',\n  factions:'&lt;svg viewBox=&quot;0 0 24 24&quot;&gt;&lt;path d=&quot;M12 3l7 3v5c0 4.4-3 7.6-7 9-4-1.4-7-4.6-7-9V6z&quot;/&gt;&lt;/svg&gt;',\n  bell:'&lt;svg viewBox=&quot;0 0 24 24&quot; style=&quot;width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round&quot;&gt;&lt;path d=&quot;M6 9a6 6 0 1112 0c0 5 2 6 2 6H4s2-1 2-6&quot;/&gt;&lt;path d=&quot;M10 20a2 2 0 004 0&quot;/&gt;&lt;/svg&gt;',\n  search:'&lt;svg viewBox=&quot;0 0 24 24&quot; style=&quot;width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round&quot;&gt;&lt;circle cx=&quot;11&quot; cy=&quot;11&quot; r=&quot;6.5&quot;/&gt;&lt;path d=&quot;M20 20l-4.2-4.2&quot;/&gt;&lt;/svg&gt;'\n};\nconst TABS = [['home','Home'],['tasks','Tasks'],['praxis','Praxis'],['players','Players'],['factions','Factions']];\nfunction tabbar(active){ return TABS.map(([k,l],i)=&gt;`&lt;button class=&quot;tab&quot; aria-selected=&quot;${i===active}&quot; data-tab=&quot;${i}&quot;&gt;${ICON[k]}&lt;span class=&quot;l&quot;&gt;${l}&lt;/span&gt;&lt;/button&gt;`).join(''); }\n\n/* ---------- Singularity signature bits ---------- */\nfunction sprocket(){ return `&lt;div class=&quot;sg-sprocket&quot;&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;/div&gt;`; }\nfunction proto(t){ return `&lt;div class=&quot;sg-proto&quot;&gt;${t}&lt;span class=&quot;sg-cursor&quot;&gt;&lt;/span&gt;&lt;/div&gt;`; }\nfunction sgCard(inner,opts){\n  opts = opts||{};\n  const spr = opts.sprocket===false?'':sprocket();\n  return `&lt;div class=&quot;sgcard&quot; style=&quot;${opts.wrap||''}&quot;&gt;&lt;span class=&quot;scan&quot;&gt;&lt;/span&gt;&lt;span class=&quot;cr tl&quot;&gt;&lt;/span&gt;&lt;span class=&quot;cr tr&quot;&gt;&lt;/span&gt;&lt;span class=&quot;cr bl&quot;&gt;&lt;/span&gt;&lt;span class=&quot;cr br&quot;&gt;&lt;/span&gt;${spr}&lt;div class=&quot;in&quot; style=&quot;${opts.pad||'padding:6px 14px 10px'}&quot;&gt;${inner}&lt;/div&gt;${spr}&lt;/div&gt;`;\n}\n/* the Singularity signal keypad (real SingularityVote tiers) */\nfunction sgVote(sel){\n  const tiers = [['NOISE',1,'#60a5fa'],['WEAK',2,'#5a9be6'],['SIGNAL',3,'#54c3ab'],['CLEAR',4,'#4ade80'],['VERIFIED',5,'#4ade80']];\n  return `&lt;div&gt;\n    &lt;div style=&quot;font-size:8px;letter-spacing:.18em;text-transform:uppercase;color:rgba(96,165,250,.75);margin-bottom:2px&quot;&gt;Cast Signal&lt;/div&gt;\n    &lt;div style=&quot;font-size:8px;font-style:italic;color:rgba(74,222,128,.5);margin-bottom:12px&quot;&gt;how confidently does this output hold?&lt;/div&gt;\n    &lt;div style=&quot;display:flex;gap:6px;flex-wrap:wrap;justify-content:center&quot;&gt;` + tiers.map(([lbl,v,col])=&gt;{\n      const reached = sel&gt;=v, picked = sel===v;\n      return `&lt;div style=&quot;display:flex;flex-direction:column;align-items:center;gap:5px&quot;&gt;\n        &lt;button style=&quot;width:42px;height:42px;padding:0;border:1px solid ${reached?col:'#1c3a5e'};background:${reached?col:'#08170d'};color:${reached?'#050f08':'rgba(96,165,250,.55)'};font-family:'Share Tech Mono',monospace;font-size:15px;box-shadow:${picked?'0 0 0 2px rgba(74,222,128,.4)':'none'}&quot;&gt;${v}&lt;/button&gt;\n        &lt;span style=&quot;font-family:'Share Tech Mono',monospace;font-size:7px;letter-spacing:.08em;color:${reached?col:'rgba(96,165,250,.5)'}&quot;&gt;${lbl}&lt;/span&gt;\n      &lt;/div&gt;`;\n    }).join('') + `&lt;/div&gt;&lt;/div&gt;`;\n}\n\n/* ---------- palette / helpers ---------- */\nconst FAC = { ua:'#c2541f', wow:'#ec5f99', snide:'#6fae00', ephemerists:'#1d6e72', singularity:'#2563eb', everymen:'#c1272d', albescent:'#8a8a86' };\nconst FACNAME = { ua:'UA', wow:'Wow', snide:'SNIDE', ephemerists:'Ephemerists', singularity:'Singularity', everymen:'Everymen', albescent:'Albescent' };\nconst AVC = ['#4ade80','#60a5fa','#2563eb','#54c3ab','#3f9c68','#5a9be6'];\nfunction status(){ return `&lt;div class=&quot;statusbar&quot;&gt;&lt;span&gt;9:41&lt;/span&gt;&lt;span class=&quot;sig&quot;&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;span style=&quot;opacity:.55&quot;&gt;▮&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;`; }\nfunction appbar2(title,right){ return `&lt;div class=&quot;appbar&quot;&gt;&lt;div class=&quot;brand&quot;&gt;&lt;div class=&quot;brandmark&quot;&gt;&lt;/div&gt;&lt;div class=&quot;title-wrap&quot;&gt;&lt;div class=&quot;k&quot;&gt;SINGULARITY&lt;/div&gt;&lt;div class=&quot;t&quot;&gt;${title}&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;${right||'&lt;span style=&quot;width:36px&quot;&gt;&lt;/span&gt;'}&lt;/div&gt;`; }\nfunction topbar(title,right){ return `&lt;div class=&quot;topbar&quot;&gt;&lt;div class=&quot;back&quot;&gt;‹&lt;/div&gt;&lt;div class=&quot;tt&quot;&gt;${title||''}&lt;/div&gt;${right||'&lt;span style=&quot;width:34px&quot;&gt;&lt;/span&gt;'}&lt;/div&gt;`; }\nconst searchBtn = `&lt;button class=&quot;iconbtn&quot;&gt;${ICON.search}&lt;/button&gt;`;\nconst moreBtn = `&lt;div class=&quot;back&quot; style=&quot;font-size:20px;line-height:0&quot;&gt;⋯&lt;/div&gt;`;\nfunction pav(bg,l,cls){ return `&lt;div class=&quot;pav${cls?' '+cls:''}&quot; style=&quot;background:${bg};color:#050f08;border-radius:0;border:1px solid #2563eb;font-family:'Share Tech Mono',monospace&quot;&gt;${l}&lt;/div&gt;`; }\nfunction diffDots(d){ return `&lt;span class=&quot;diff&quot;&gt;${[1,2,3].map(x=&gt;`&lt;i class=&quot;${x&lt;=d?'on':''}&quot;&gt;&lt;/i&gt;`).join('')}&lt;/span&gt;`; }\nfunction sec(label,right){ return `&lt;div class=&quot;sechead&quot; style=&quot;margin:14px 2px 2px&quot;&gt;&lt;span class=&quot;k&quot;&gt;${label}&lt;/span&gt;&lt;span class=&quot;rule&quot;&gt;&lt;/span&gt;${right||''}&lt;/div&gt;`; }\nfunction sgPill(t){ return `&lt;span class=&quot;sg-pill&quot;&gt;${t}&lt;/span&gt;`; }\nfunction signalBars(n){ let s=''; for(let i=1;i&lt;=5;i++) s+=`&lt;i style=&quot;display:inline-block;width:4px;height:${5+i*2}px;margin-right:2px;background:${i&lt;=n?'#4ade80':'#193a2a'};vertical-align:bottom&quot;&gt;&lt;/i&gt;`; return `&lt;span&gt;${s}&lt;/span&gt;`; }\n\n/* ---------- HOME ---------- */\nconst VOICE = { charK:'Node readout', tasksK:'Open protocols', link:'ALL', browse:'Scan Protocols', post:'Log Signal', fac:'Singularity' };\nfunction home(){\n  const v = VOICE;\n  const activeTasks = [\n    { t:'Lacunae', fac:'singularity', facName:'Singularity', pv:40, slots:'2 / 6', prog:33 },\n    { t:'Knowledge Is Free', fac:'snide', facName:'SNIDE', pv:25, slots:'5 / 12', prog:null }\n  ];\n  const rows = activeTasks.map(t=&gt;`\n    &lt;div class=&quot;trow&quot; role=&quot;button&quot; tabindex=&quot;0&quot;&gt;\n      &lt;span class=&quot;dot&quot; style=&quot;background:${FAC[t.fac]};border-radius:0&quot;&gt;&lt;/span&gt;\n      &lt;div class=&quot;tmid&quot;&gt;\n        &lt;div class=&quot;tt&quot;&gt;&amp;gt; ${t.t}&lt;/div&gt;\n        &lt;div class=&quot;tm&quot;&gt;&lt;span class=&quot;fac&quot;&gt;${t.facName}&lt;/span&gt;&lt;span&gt;·&lt;/span&gt;&lt;span class=&quot;pv&quot;&gt;+${t.pv} CR&lt;/span&gt;&lt;span&gt;·&lt;/span&gt;&lt;span&gt;${t.slots}&lt;/span&gt;&lt;/div&gt;\n        ${t.prog!=null?`&lt;div class=&quot;mini-bar&quot;&gt;&lt;i style=&quot;width:${t.prog}%&quot;&gt;&lt;/i&gt;&lt;/div&gt;`:''}\n      &lt;/div&gt;\n      &lt;span class=&quot;chev&quot;&gt;›&lt;/span&gt;\n    &lt;/div&gt;`).join('');\n  return `\n  ${status()}\n  &lt;div class=&quot;appbar&quot;&gt;\n    &lt;div class=&quot;brand&quot;&gt;&lt;div class=&quot;brandmark&quot;&gt;&lt;/div&gt;\n      &lt;div class=&quot;title-wrap&quot;&gt;&lt;div class=&quot;k&quot;&gt;SINGULARITY&lt;/div&gt;&lt;div class=&quot;t&quot;&gt;FieldDesk&lt;/div&gt;&lt;/div&gt;\n    &lt
