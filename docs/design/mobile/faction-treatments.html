ead&quot; style=&quot;padding:4px 0 12px&quot;&gt;${pav(AVC[1],'A')}&lt;div style=&quot;flex:1&quot;&gt;&lt;div class=&quot;nm&quot;&gt;Ada&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;span style=&quot;color:${FAC.singularity}&quot;&gt;●&lt;/span&gt; Singularity · 2h ago&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;chip2&quot;&gt;Follow&lt;/span&gt;&lt;/div&gt;\n    ${sgCard(`&lt;div class=&quot;media&quot; style=&quot;height:210px;border:1px solid #2563eb;color:#4ade80&quot;&gt;SIGNAL_TRACE&lt;/div&gt;`,{sprocket:false,pad:'padding:11px'})}\n    &lt;div style=&quot;font-size:20px;margin:16px 0 4px;color:#4ade80;line-height:1.25;font-family:'Share Tech Mono',monospace&quot;&gt;&amp;gt; The fare gate that never checks twice&lt;/div&gt;\n    &lt;div class=&quot;mdprev&quot; style=&quot;margin-top:8px&quot;&gt;\n      &lt;p style=&quot;color:#8fb5a0&quot;&gt;Tapped in, walked back, tapped a second card on the same swing of the gate. It never rejected the double.&lt;/p&gt;\n      &lt;p style=&quot;color:#8fb5a0&quot;&gt;Not a hack — a lacuna. The gap was always in the spec. We just logged it and mapped every station that shares the firmware.&lt;/p&gt;\n    &lt;/div&gt;\n    &lt;div class=&quot;votebar&quot; style=&quot;margin:10px 0 4px;align-items:stretch;background:#050f08;border:1px solid #2563eb&quot;&gt;\n      ${sgVote(5)}\n      &lt;div class=&quot;votelbl&quot; style=&quot;text-align:center;margin-top:12px;color:#60a5fa&quot;&gt;VERIFIED · 190 casts&lt;/div&gt;\n    &lt;/div&gt;\n    ${sec('Comments · 3')}\n    &lt;div class=&quot;cmt&quot;&gt;&lt;div class=&quot;cav&quot; style=&quot;background:${AVC[3]};color:#050f08;border-radius:0;font-family:'Share Tech Mono',monospace&quot;&gt;R&lt;/div&gt;&lt;div class=&quot;cb&quot;&gt;&lt;div class=&quot;cn&quot;&gt;Reza &lt;span style=&quot;color:var(--text-3);font-weight:400&quot;&gt;· 1h&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ct&quot;&gt;Clean trace. Reproduced it on the north line in ten minutes.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;\n    &lt;div class=&quot;cmt&quot;&gt;&lt;div class=&quot;cav&quot; style=&quot;background:${AVC[4]};color:#050f08;border-radius:0;font-family:'Share Tech Mono',monospace&quot;&gt;B&lt;/div&gt;&lt;div class=&quot;cb&quot;&gt;&lt;div class=&quot;cn&quot;&gt;Bo &lt;span style=&quot;color:var(--text-3);font-weight:400&quot;&gt;· 40m&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ct&quot;&gt;The threshold is already behind us, etc.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;\n  &lt;/div&gt;\n  &lt;div class=&quot;sticky-cta&quot;&gt;&lt;div class=&quot;searchbar&quot; style=&quot;flex:1;border-radius:0;font-family:'Share Tech Mono',monospace&quot;&gt;&amp;gt; add a comment…&lt;/div&gt;&lt;button class=&quot;btn primary&quot; style=&quot;flex:none;padding:13px 16px&quot;&gt;Post&lt;/button&gt;&lt;/div&gt;`;\n}\nfunction composerWrite(){\n  return status() +\n  `&lt;div class=&quot;topbar&quot;&gt;&lt;a href=&quot;#&quot; class=&quot;act&quot; style=&quot;color:var(--text-2)&quot;&gt;Cancel&lt;/a&gt;&lt;div class=&quot;tt&quot; style=&quot;flex:1;text-align:center;font-size:16px;letter-spacing:.08em&quot;&gt;LOG SIGNAL&lt;/div&gt;&lt;a href=&quot;#&quot; class=&quot;act&quot;&gt;Transmit&lt;/a&gt;&lt;/div&gt;\n  &lt;div class=&quot;body&quot; style=&quot;gap:14px&quot;&gt;\n    &lt;div class=&quot;seg&quot;&gt;&lt;button class=&quot;on&quot;&gt;Write&lt;/button&gt;&lt;button&gt;Preview&lt;/button&gt;&lt;/div&gt;\n    &lt;div class=&quot;forrow&quot;&gt;&lt;span&gt;RE: PROTOCOL&lt;/span&gt;&lt;b&gt;Lacunae ▾&lt;/b&gt;&lt;/div&gt;\n    &lt;input class=&quot;field&quot; value=&quot;The fare gate that never checks twice&quot; /&gt;\n    &lt;textarea class=&quot;ta&quot;&gt;## Trace\n\nTapped in, walked back, tapped a second card on the same swing of the gate. It never rejected the double.\n\n- reproduced on 4 stations\n- same firmware string on all\n- not a hack — a gap in the spec&lt;/textarea&gt;\n    &lt;div&gt;&lt;label class=&quot;form-lbl&quot;&gt;Captures&lt;/label&gt;&lt;div class=&quot;mgrid&quot;&gt;&lt;div class=&quot;media&quot;&gt;CAP&lt;/div&gt;&lt;div class=&quot;media&quot;&gt;CAP&lt;/div&gt;&lt;div class=&quot;madd&quot;&gt;+&lt;small&gt;Add&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;\n  &lt;/div&gt;\n  &lt;div class=&quot;kbd-acc&quot;&gt;&lt;span style=&quot;font-weight:700&quot;&gt;B&lt;/span&gt;&lt;span style=&quot;font-style:italic&quot;&gt;I&lt;/span&gt;&lt;span&gt;#&lt;/span&gt;&lt;span&gt;“ ”&lt;/span&gt;&lt;span&gt;≡&lt;/span&gt;&lt;span class=&quot;ph&quot;&gt;▦ Capture&lt;/span&gt;&lt;/div&gt;\n  &lt;div class=&quot;kbd&quot;&gt;On-screen keyboard&lt;/div&gt;`;\n}\nfunction composerPreview(){\n  return status() +\n  `&lt;div class=&quot;topbar&quot;&gt;&lt;a href=&quot;#&quot; class=&quot;act&quot; style=&quot;color:var(--text-2)&quot;&gt;Cancel&lt;/a&gt;&lt;div class=&quot;tt&quot; style=&quot;flex:1;text-align:center;font-size:16px;letter-spacing:.08em&quot;&gt;LOG SIGNAL&lt;/div&gt;&lt;a href=&quot;#&quot; class=&quot;act&quot;&gt;Transmit&lt;/a&gt;&lt;/div&gt;\n  &lt;div class=&quot;body&quot; style=&quot;gap:14px&quot;&gt;\n    &lt;div class=&quot;seg&quot;&gt;&lt;button&gt;Write&lt;/button&gt;&lt;button class=&quot;on&quot;&gt;Preview&lt;/button&gt;&lt;/div&gt;\n    ${sgCard(`\n      ${proto('&amp;gt; DRAFT TRACE')}\n      &lt;div class=&quot;media&quot; style=&quot;height:160px;border:1px solid #2563eb;color:#4ade80;margin:10px 0 12px&quot;&gt;SIGNAL_TRACE&lt;/div&gt;\n      &lt;div style=&quot;font-size:16px;margin:0 0 10px;color:#4ade80;line-height:1.3&quot;&gt;&amp;gt; The fare gate that never checks twice&lt;/div&gt;\n      &lt;div class=&quot;mdprev&quot;&gt;\n        &lt;p style=&quot;color:#8fb5a0&quot;&gt;Tapped in, walked back, tapped a second card on the same swing of the gate. It never rejected the double.&lt;/p&gt;\n        &lt;ul style=&quot;margin:0;padding:0;list-style:none;color:#8fb5a0&quot;&gt;&lt;li&gt;&amp;gt; reproduced on 4 stations&lt;/li&gt;&lt;li&gt;&amp;gt; same firmware string on all&lt;/li&gt;&lt;li&gt;&amp;gt; not a hack — a gap in the spec&lt;/li&gt;&lt;/ul&gt;\n      &lt;/div&gt;\n    `,{sprocket:false,pad:'padding:6px 14px 12px'})}\n  &lt;/div&gt;\n  &lt;div class=&quot;sticky-cta&quot;&gt;&lt;button class=&quot;btn primary&quot; style=&quot;flex:1&quot;&gt;&amp;gt; Transmit signal&lt;/button&gt;&lt;/div&gt;`;\n}\n\n/* ---------- UPDATES ---------- */\nfunction screenUpdates(){\n  const row = (unread,text,time) =&gt; `&lt;div class=&quot;up-row${unread?'':' read'}&quot;&gt;&lt;span class=&quot;udot&quot; style=&quot;${unread?'background:#4ade80':''};border-radius:0&quot;&gt;&lt;/span&gt;&lt;div class=&quot;ub&quot;&gt;&lt;div class=&quot;utext&quot;&gt;${text}&lt;/div&gt;&lt;div class=&quot;utime&quot; style=&quot;${unread?'color:#60a5fa':''}&quot;&gt;${time}&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;`;\n  const day = (label) =&gt; `&lt;div class=&quot;up-group&quot; style=&quot;display:flex;align-items:center;gap:10px&quot;&gt;&amp;gt; ${label}&lt;span style=&quot;flex:1&quot;&gt;&lt;/span&gt;&lt;/div&gt;${sprocket()}`;\n  return status() + topbar('Signal Log') +\n  `&lt;div class=&quot;body&quot; style=&quot;padding-top:0&quot;&gt;\n    ${day('TODAY')}\n    ${row(true,'&lt;b&gt;Reza&lt;/b&gt; cast &lt;b style=&quot;color:#4ade80&quot;&gt;VERIFIED&lt;/b&gt; on your trace.','2h ago')}\n    ${row(true,'Node promoted to &lt;b&gt;Level 4&lt;/b&gt; — two protocols unlocked.','5h ago')}\n    ${row(true,'New protocol in &lt;b&gt;Singularity&lt;/b&gt;: “Lacunae”, +40 CR.','9h ago')}\n    ${day('EARLIER')}\n    ${row(false,'&lt;b&gt;Ada&lt;/b&gt; commented on “The fare gate that never checks twice”.','2d ago')}\n    ${row(false,'&lt;b&gt;Bo&lt;/b&gt; is now watching your node.','3d ago')}\n    ${row(false,'Your protocol &lt;b&gt;Lacunae&lt;/b&gt; accepted a new node.','4d ago')}\n  &lt;/div&gt;` + `&lt;div class=&quot;tabbar&quot;&gt;${tabbar(0)}&lt;/div&gt;`;\n}\n\n/* ---------- FACTION PAGE ---------- */\nconst PLAYERS = [\n  { n:'Ada', lv:9, pts:'2,140', av:AVC[1] },\n  { n:'Reza', lv:7, pts:'1,880', av:AVC[3] },\n  { n:'Molly', lv:4, pts:'340', av:AVC[0] }\n];\nfunction factionDetail(){\n  const statField = (val,lbl) =&gt; `&lt;div style=&quot;flex:1;border:1px solid #2563eb;background:#050f08;padding:10px 8px 8px;text-align:left&quot;&gt;&lt;b style=&quot;display:block;font-family:'Share Tech Mono',monospace;font-size:22px;line-height:1;color:#4ade80&quot;&gt;${val}&lt;/b&gt;&lt;span style=&quot;font-family:'Share Tech Mono',monospace;font-size:7.5px;letter-spacing:.14em;text-transform:uppercase;color:#60a5fa&quot;&gt;${lbl}&lt;/span&gt;&lt;/div&gt;`;\n  return status() + topbar('', moreBtn) +\n  `&lt;div class=&quot;body&quot; style=&quot;padding-top:2px&quot;&gt;\n    ${sgCard(`\n      &lt;div style=&quot;font-size:9px;letter-spacing:.14em;color:rgba(96,165,250,.75);line-height:2&quot;&gt;\n        &lt;div&gt;&amp;gt; FACTION: SINGULARITY&lt;/div&gt;\n        &lt;div&gt;&amp;gt; STATUS: ACTIVE · ARRAYS ONLINE&lt;/div&gt;\n        &lt;div&gt;&amp;gt; THRESHOLD: &lt;span style=&quot;color:#4ade80&quot;&gt;CROSSED&lt;/span&gt;&lt;/div&gt;\n      &lt;/div&gt;\n      &lt;div style=&quot;font-family:'Share Tech Mono',monospace;font-size:46px;line-height:.95;letter-spacing:.03em;color:#4ade80;margin:14px 0 10px&quot;&gt;SINGULARITY&lt;/div&gt;\n      &lt;div style=&quot;font-size:9px;letter-spacing:.26em;text-transform:uppercase;color:rgba(96,165,250,.85)&quot;&gt;The threshold is already behind us&lt;/div&gt;\n    `,{wrap:'margin-top:4px',pad:'padding:6px 16px 16px'})}\n    &lt;div style=&quot;display:flex;gap:10px;margin-top:14px&quot;&gt;${statField('143','Nodes')}${statField('58','Protocols')}${statField('III','Era')}&lt;/div&gt;\n    &lt;p class=&quot;para&quot; style=&quot;margin-top:16px;color:#8fb5a0&quot;&gt;We watch the noise floor for the pattern that shouldn't exist. Singularity maps the gaps everyone else trusts and logs the thresholds nobody admits crossing. Join and your whole app boots into the terminal.&lt;/p&gt;\n    ${sec('Top nodes')}\n    &lt;div&gt;${PLAYERS.map((p,i)=&gt;`&lt;div class=&quot;prow2&quot;&gt;&lt;div class=&quot;rank&quot;&gt;${i+1}&lt;/div&gt;${pav(p.av,p.n[0])}&lt;div class=&quot;pinfo&quot;&gt;&lt;div class=&quot;n&quot;&gt;${p.n}&lt;/div&gt;&lt;div class=&quot;m&quot;&gt;&lt;i style=&quot;background:${FAC.singularity};border-radius:0&quot;&gt;&lt;/i&gt;Singularity · Lv ${p.lv}&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ppts2&quot;&gt;&lt;b&gt;${p.pts}&lt;/b&gt;&lt;span&gt;CR&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;`).join('')}&lt;/div&gt;\n    ${sec('Recent traces')}\n    &lt;div class=&quot;thumbs&quot; style=&quot;margin-top:8px&quot;&gt;${Array.from({length:3}).map(()=&gt;`&lt;div class=&quot;media&quot; style=&quot;aspect-ratio:1;border:1px solid #2563eb;color:#4ade80&quot;&gt;CAP&lt;/div&gt;`).join('')}&lt;/div&gt;\n  &lt;/div&gt;\n  &lt;div class=&quot;sticky-cta&quot;&gt;&lt;button class=&quot;btn primary&quot; style=&quot;flex:1&quot;&gt;&amp;gt; Join Singularity&lt;/button&gt;&lt;/div&gt;`;\n}\n\n/* ---------- render (Singularity · native dark) ---------- */\nfunction renderRail(id, list){\n  document.getElementById(id).innerHTML = list.map(([label,fn])=&gt;`\n    &lt;div class=&quot;phone-wrap&quot;&gt;\n      &lt;div class=&quot;phone-tag&quot;&gt;&lt;b&gt;${label}&lt;/b&gt; · Dark&lt;/div&gt;\n      &lt;div class=&quot;phone&quot;&gt;&lt;div class=&quot;screen&quot; data-theme=&quot;dark&quot; data-treatment=&quot;singularity&quot;&gt;${fn()}&lt;/div&gt;&lt;/div&gt;\n    &lt;/div&gt;`).join('');\n}\nrenderRail('homeRail',    [['Home', home]]);\nrenderRail('tasksRail',   [['Browse', tasksBrowse], ['Detail', taskDetail]]);\nrenderRail('praxisRail',  [['Feed', praxisFeed], ['Detail', praxisDetail], ['Compose · Write', composerWrite], ['Compose · Preview', composerPreview]]);\nrenderRail('updatesRail', [['Signal log', screenUpdates]]);\nrenderRail('factionRail', [['Faction page', factionDetail]]);\n\n/* ---------- anatomy + kit specimens ---------- */\ndocument.getElementById('anatomy').innerHTML =\n  `&lt;div class=&quot;screen&quot; data-theme=&quot;dark&quot; data-treatment=&quot;singularity&quot; style=&quot;border-radius:6px;overflow:hidden;height:auto;background:#040b06;padding:18px&quot;&gt;\n     ${sgCard(`${proto('singularity protocol #0051')}&lt;div style=&quot;font-size:16px;margin:8px 0 8px;color:#4ade80&quot;&gt;&amp;gt; Lacunae&lt;/div&gt;&lt;div style=&quot;font-size:11px;color:#60a5fa;line-height:1.7;margin-bottom:8px&quot;&gt;&lt;div&gt;PTS: &lt;span style=&quot;color:#4ade80;font-size:15px;font-weight:700&quot;&gt;40&lt;/span&gt; CR&lt;/div&gt;&lt;div&gt;LVL: 3&lt;/div&gt;&lt;/div&gt;&lt;button style=&quot;background:transparent;color:#4ade80;border:1px solid #4ade80;font-family:'Share Tech Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.1em;padding:5px 12px&quot;&gt;&amp;gt; sign up&lt;/button&gt;`,{pad:'padding:6px 14px 8px'})}\n   &lt;/div&gt;`;\ndocument.getElementById('sgkit').innerHTML =\n  `&lt;div style=&quot;margin-bottom:16px&quot;&gt;${sgVote(3)}&lt;/div&gt;`;\n\n/* ---------- light interactivity ---------- */\ndocument.querySelectorAll('.rail, .spec').forEach(rail=&gt;{\n  rail.addEventListener('click',e=&gt;{\n    const tab = e.target.closest('.tab');\n    if(tab){ const bar = tab.closest('.tabbar'); bar.querySelectorAll('.tab').forEach(t=&gt;t.setAttribute('aria-selected', t===tab)); return; }\n    const seg = e.target.closest('.seg button');\n    if(seg){ seg.parentElement.querySelectorAll('button').forEach(b=&gt;b.classList.toggle('on', b===seg)); }\n  });\n});\n&lt;/script&gt;\n&lt;/body&gt;\n&lt;/html&gt;\n\"><\u002Fiframe><span class=\"hit\"><\u002Fspan><\u002Fdiv>\n    <div class=\"meta\"><div class=\"n\"><span class=\"dot\" style=\"background:#2563eb\"><\u002Fspan><b>Singularity<\u002Fb><span class=\"mode dark\">dark<\u002Fspan><\u002Fdiv><p>The dark terminal — bracketed readout cards, sprockets, &gt; prompts + cursor, signal keypad.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n<div class=\"card\">\n    <div class=\"frame\"><iframe scrolling=\"no\" tabindex=\"-1\" srcdoc=\"&lt;!DOCTYPE html&gt;\n&lt;html lang=&quot;en&quot;&gt;\n&lt;head&gt;\n&lt;meta charset=&quot;utf-8&quot;&gt;\n&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1&quot;&gt;\n&lt;title&gt;World Zero — Ephemerists Treatment · Mobile Field Kit&lt;/title&gt;\n&lt;link rel=&quot;preconnect&quot; href=&quot;https://fonts.googleapis.com&quot;&gt;\n&lt;link rel=&quot;preconnect&quot; href=&quot;https://fonts.gstatic.com&quot; crossorigin&gt;\n&lt;link href=&quot;https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&amp;family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&amp;family=Cormorant+Garamond:ital,wght@1,500;1,600&amp;family=Special+Elite&amp;family=Courier+Prime:wght@400;700&amp;display=swap&quot; rel=&quot;stylesheet&quot;&gt;\n&lt;style&gt;\n/* ============================================================\n   BOARD (review surface — not part of the product)\n   ============================================================ */\n*{box-sizing:border-box}\nhtml,body{margin:0}\nbody{\n  background:#26252c;\n  color:#e9e6df;\n  font-family:&quot;Courier Prime&quot;,monospace;\n  -webkit-font-smoothing:antialiased;\n  padding:40px 32px 96px;\n}\na{color:inherit}\n.board{max-width:1180px;margin:0 auto}\n.board-head{margin-bottom:40px;max-width:760px}\n.board-head .eyebrow{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:#8a8794;margin:0 0 14px}\n.board-head h1{font-family:&quot;Lora&quot;,serif;font-weight:600;font-size:34px;line-height:1.1;margin:0 0 12px;color:#f4f1ea}\n.board-head p{font-size:13px;line-height:1.7;color:#a5a1ac;margin:0}\n.board-head .stage{display:inline-block;margin-top:18px;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:#26252c;background:#e7b94f;padding:6px 12px;border-radius:3px;font-weight:700}\n\n.section-label{display:flex;align-items:baseline;gap:16px;margin:56px 0 24px}\n.section-label .n{font-family:&quot;Lora&quot;,serif;font-size:13px;color:#6f6c78}\n.section-label h2{font-family:&quot;Lora&quot;,serif;font-weight:600;font-size:22px;margin:0;color:#f4f1ea}\n.section-label .rule{flex:1;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.16),transparent)}\n.section-label p{width:100%;flex-basis:100%;font-size:12px;color:#918d99;margin:8px 0 0;line-height:1.6;max-width:720px}\n\n/* spec cards on the board */\n.grid{display:grid;gap:16px}\n.spec{background:#302f38;border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:22px}\n.spec h3{font-family:&quot;Lora&quot;,serif;font-size:15px;font-weight:600;margin:0 0 4px;color:#f4f1ea}\n.spec .sub{font-size:11px;color:#8a8794;margin:0 0 18px;line-height:1.5}\n\n/* spacing scale */\n.sp-row{display:flex;align-items:center;gap:16px;margin-bottom:9px}\n.sp-row .swatch{background:linear-gradient(90deg,#e7b94f,#d99a2b);height:14px;border-radius:2px;flex:none}\n.sp-row .lbl{font-size:11px;color:#c8c4cd;width:54px}\n.sp-row .use{font-size:10px;color:#807d89}\n\n/* type scale */\n.ty{display:flex;align-items:baseline;justify-content:space-between;gap:18px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.06)}\n.ty:last-child{border-bottom:0}\n.ty .demo{color:#f4f1ea;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.ty .meta{font-size:10px;color:#807d89;text-align:right;flex:none;line-height:1.5}\n.ty .meta b{color:#c8c4cd;font-weight:400}\n\n.pattern-note{font-size:11px;line-height:1.7;color:#a5a1ac}\n.pattern-note b{color:#e9e6df;font-weight:400}\n.pill-legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}\n.pill-legend span{font-size:10px;letter-spacing:.06em;color:#c8c4cd;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:999px;padding:5px 11px}\n\n/* token cascade table */\n.cascade{width:100%;border-collapse:collapse;font-size:11px}\n.cas t:center;color:var(--text-2);flex:none;font-size:14px}\n.screen[data-treatment=&quot;everymen&quot;] .setrow .si{border-radius:4px}\n.setrow .sl{flex:1;font-size:14px;color:var(--text-1);font-family:var(--label-font)}\n.setrow .sv{font-size:11px;color:var(--text-3);letter-spacing:.04em}\n.toggle{width:42px;height:24px;border-radius:999px;background:var(--accent);position:relative;flex:none}\n.screen[data-treatment=&quot;na&quot;][data-theme=&quot;light&quot;] .toggle{background:#c2541f}\n.toggle.off{background:var(--border-2)}\n.toggle i{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3)}\n.toggle.off i{right:auto;left:2px}\n/* ---- search ---- */\n.searchbar{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--border-2);border-radius:999px;padding:11px 15px;color:var(--text-2);font-size:14px;font-family:var(--label-font)}\n.sug{display:flex;align-items:center;gap:11px;padding:12px 4px;border-bottom:1px solid var(--border);font-size:13px;color:var(--text-1)}\n.sug .sk{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);margin-left:auto}\n/* ---- level up ---- */\n.lu-scrim{position:absolute;inset:0;background:rgba(10,8,14,.72);z-index:5;display:flex;align-items:center;justify-content:center;border-radius:36px;overflow:hidden}\n.lu-card{width:78%;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:26px 20px;text-align:center;position:relative;z-index:2;box-shadow:0 20px 50px rgba(0,0,0,.5)}\n.lu-burst{width:88px;height:88px;border-radius:50%;margin:0 auto 15px;background:var(--ring);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(0,0,0,.3)}\n.lu-burst b{font-family:var(--headline);font-style:var(--headline-style);font-size:36px;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.35)}\n.lu-card h3{font-family:var(--headline);font-style:var(--headline-style);font-weight:var(--headline-weight);font-size:24px;margin:0 0 6px;color:var(--text-1)}\n.lu-card p{font-size:13px;line-height:1.5;color:var(--text-2);margin:0 0 18px}\n.confetti{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}\n.confetti i{position:absolute;width:8px;height:9px;border-radius:2px;top:-14px;animation:cfall linear infinite}\n@keyframes cfall{to{transform:translateY(620px) rotate(420deg)}}\n/* ---- sticky CTA (detail screens) ---- */\n.sticky-cta{padding:12px 16px 22px;background:var(--nav-bg);backdrop-filter:blur(12px);border-top:1px solid var(--border);display:flex;gap:10px;flex:none;align-items:center}\n\n@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}\n&lt;/style&gt;\n&lt;/head&gt;\n&lt;body&gt;\n&lt;template id=&quot;__bundler_thumbnail&quot;&gt;\n&lt;svg viewBox=&quot;0 0 400 400&quot; xmlns=&quot;http://www.w3.org/2000/svg&quot;&gt;\n  &lt;rect width=&quot;400&quot; height=&quot;400&quot; fill=&quot;#ded0ab&quot;/&gt;\n  &lt;rect x=&quot;118&quot; y=&quot;90&quot; width=&quot;164&quot; height=&quot;228&quot; fill=&quot;#e9dcbf&quot; stroke=&quot;#2a1d12&quot; stroke-width=&quot;2&quot;/&gt;\n  &lt;text x=&quot;200&quot; y=&quot;118&quot; font-family=&quot;Georgia,serif&quot; font-size=&quot;10&quot; letter-spacing=&quot;3&quot; fill=&quot;#b0863a&quot; text-anchor=&quot;middle&quot;&gt;EPHEMERISTS&lt;/text&gt;\n  &lt;g stroke=&quot;#1d4f6e&quot; stroke-width=&quot;0.8&quot; fill=&quot;none&quot; opacity=&quot;0.7&quot;&gt;&lt;path d=&quot;M130 250 L200 150 M160 250 L200 150 M200 250 L200 150 M240 250 L200 150 M270 250 L200 150 M130 190 H270 M130 215 H270&quot;/&gt;&lt;/g&gt;\n  &lt;g stroke=&quot;#9c3622&quot; stroke-width=&quot;0.8&quot; fill=&quot;none&quot; opacity=&quot;0.75&quot;&gt;&lt;circle cx=&quot;205&quot; cy=&quot;200&quot; r=&quot;16&quot;/&gt;&lt;circle cx=&quot;205&quot; cy=&quot;200&quot; r=&quot;30&quot;/&gt;&lt;path d=&quot;M205 200 L235 200 M205 200 L175 200 M205 200 L205 230 M205 200 L225 225&quot;/&gt;&lt;/g&gt;\n  &lt;circle cx=&quot;214&quot; cy=&quot;192&quot; r=&quot;4&quot; fill=&quot;#d4ab55&quot;/&gt;\n  &lt;text x=&quot;200&quot; y=&quot;288&quot; font-family=&quot;Georgia,serif&quot; font-size=&quot;17&quot; font-weight=&quot;700&quot; fill=&quot;#2a1d12&quot; text-anchor=&quot;middle&quot;&gt;Lacunae&lt;/text&gt;\n&lt;/svg&gt;\n&lt;/template&gt;\n&lt;div class=&quot;board&quot;&gt;\n\n  &lt;header class=&quot;board-head&quot;&gt;\n    &lt;p class=&quot;eyebrow&quot;&gt;World Zero · Ephemerists — the vellum codex&lt;/p&gt;\n    &lt;h1&gt;Join the Ephemerists and the app becomes a codex: every task a cartographic leaf, drawn and annotated.&lt;/h1&gt;\n    &lt;p&gt;Same 375px layout, same markup — bound into the Ephemerists' real idiom. Cards go to &lt;b style=&quot;color:#e9e6df&quot;&gt;vellum&lt;/b&gt; (&lt;code style=&quot;color:#c8c4cd&quot;&gt;--eph-vellum&lt;/code&gt; #e9dcbf) inside an ink rule, headed by a &lt;b style=&quot;color:#e9e6df&quot;&gt;wordmark eyebrow&lt;/b&gt; in Cinzel over a script motto. Each carries an &lt;b style=&quot;color:#e9e6df&quot;&gt;illuminated plate&lt;/b&gt; — a perspective grid to a vanishing point in lapis (&lt;code style=&quot;color:#c8c4cd&quot;&gt;--eph-lapis&lt;/code&gt;), a rubric star-chart (&lt;code style=&quot;color:#c8c4cd&quot;&gt;--eph-rubric&lt;/code&gt;), a gold twinkle (&lt;code style=&quot;color:#c8c4cd&quot;&gt;--eph-gold&lt;/code&gt;) and coordinate marginalia. Titles set in Cinzel with the last word in lapis, grades in Roman, points in &lt;b style=&quot;color:#e9e6df&quot;&gt;pvncta&lt;/b&gt;, an ink “Triangulate” seal. Nothing invented — all &lt;code style=&quot;color:#c8c4cd&quot;&gt;--eph-*&lt;/code&gt;. Native mode: light.&lt;/p&gt;\n    &lt;span class=&quot;stage&quot;&gt;Ephemerists (vellum codex) · illuminated plates · Cinzel + marginalia · native light&lt;/span&gt;\n  &lt;/header&gt;\n\n  &lt;!-- ============ THE IDIOM ============ --&gt;\n  &lt;div class=&quot;section-label&quot;&gt;&lt;span class=&quot;n&quot;&gt;01&lt;/span&gt;&lt;h2&gt;The idiom&lt;/h2&gt;&lt;span class=&quot;rule&quot;&gt;&lt;/span&gt;\n    &lt;p&gt;The Ephemerists' signature is the &lt;b style=&quot;color:#e9e6df&quot;&gt;illuminated leaf&lt;/b&gt; — lifted from the real EphemeristsTaskCard: wordmark eyebrow, a drawn cartographic plate, a Cinzel title with a lapis last word, Roman grade and pvncta. Anatomy, then the codex kit.&lt;/p&gt;\n  &lt;/div&gt;\n\n  &lt;div class=&quot;grid&quot; style=&quot;grid-template-columns:1fr 1fr&quot;&gt;\n    &lt;div class=&quot;spec&quot;&gt;\n      &lt;h3&gt;Illuminated-leaf anatomy&lt;/h3&gt;\n      &lt;p class=&quot;sub&quot;&gt;Wordmark eyebrow + motto → cartographic plate (perspective grid, rubric chart, twinkle, marginalia) → Cinzel title, lapis last word → grade / pvncta → footnote → ink seal.&lt;/p&gt;\n      &lt;div id=&quot;anatomy&quot; style=&quot;max-width:230px&quot;&gt;&lt;/div&gt;\n    &lt;/div&gt;\n    &lt;div class=&quot;spec&quot;&gt;\n      &lt;h3&gt;Codex kit&lt;/h3&gt;\n      &lt;p class=&quot;sub&quot;&gt;The pieces every Ephemerist surface is built from — the wordmark mark, the cartographic plate, and the concord seals (the Ephemerists vote).&lt;/p&gt;\n      &lt;div id=&quot;ephkit&quot; style=&quot;padding:18px 14px 10px;background:#ded0ab;border-radius:3px;margin-top:8px&quot;&gt;&lt;/div&gt;\n      &lt;p class=&quot;pattern-note&quot; style=&quot;margin-top:12px&quot;&gt;&lt;b&gt;Plate&lt;/b&gt; lapis perspective + rubric chart · &lt;b&gt;Twinkle&lt;/b&gt; gold vanishing star · &lt;b&gt;Marginalia&lt;/b&gt; rotated coordinate glosses · &lt;b&gt;Concord&lt;/b&gt; five wax seals, apocryphal → canonical.&lt;/p&gt;\n    &lt;/div&gt;\n  &lt;/div&gt;\n\n  &lt;!-- ============ HOME ============ --&gt;\n  &lt;div class=&quot;section-label&quot;&gt;&lt;span class=&quot;n&quot;&gt;02&lt;/span&gt;&lt;h2&gt;FieldDesk — Home&lt;/h2&gt;&lt;span class=&quot;rule&quot;&gt;&lt;/span&gt;\n    &lt;p&gt;Your leaf and open findings, each a vellum card on a parchment desk. Actions keep their one-hand spot; the primary is the ink seal.&lt;/p&gt;\n  &lt;/div&gt;\n  &lt;div class=&quot;rail&quot; id=&quot;homeRail&quot;&gt;&lt;/div&gt;\n\n  &lt;!-- ============ TASKS ============ --&gt;\n  &lt;div class=&quot;section-label&quot;&gt;&lt;span class=&quot;n&quot;&gt;03&lt;/span&gt;&lt;h2&gt;Tasks&lt;/h2&gt;&lt;span class=&quot;rule&quot;&gt;&lt;/span&gt;\n    &lt;p&gt;Every task is a finding — wordmark, illuminated plate, Cinzel title, Roman grade, pvncta. Detail keeps the sticky Triangulate seal, filed leaves and glosses below.&lt;/p&gt;\n  &lt;/div&gt;\n  &lt;div class=&quot;rail&quot; id=&quot;tasksRail&quot;&gt;&lt;/div&gt;\n\n  &lt;!-- ============ PRAXIS ============ --&gt;\n  &lt;div class=&quot;section-label&quot;&gt;&lt;span class=&quot;n&quot;&gt;04&lt;/span&gt;&lt;h2&gt;Praxis&lt;/h2&gt;&lt;span class=&quot;rule&quot;&gt;&lt;/span&gt;\n    &lt;p&gt;The record: the finding drawn onto a leaf, a Cinzel caption, the concord seals. Detail has the full seals; the composer keeps Write / Preview and the media grid.&lt;/p&gt;\n  &lt;/div&gt;\n  &lt;div class=&quot;rail&quot; id=&quot;praxisRail&quot;&gt;&lt;/div&gt;\n\n  &lt;!-- ============ UPDATES ============ --&gt;\n  &lt;div class=&quot;section-label&quot;&gt;&lt;span class=&quot;n&quot;&gt;05&lt;/span&gt;&lt;h2&gt;Updates&lt;/h2&gt;&lt;span class=&quot;rule&quot;&gt;&lt;/span&gt;\n    &lt;p&gt;The Ephemerides — seals cast, matriculations, glosses, new findings. Rubric marks for unread, lapis timestamps, an illuminated rule between leaves.&lt;/p&gt;\n  &lt;/div&gt;\n  &lt;div class=&quot;rail&quot; id=&quot;updatesRail&quot;&gt;&lt;/div&gt;\n\n  &lt;!-- ============ FACTION PAGE ============ --&gt;\n  &lt;div class=&quot;section-label&quot;&gt;&lt;span class=&quot;n&quot;&gt;06&lt;/span&gt;&lt;h2&gt;Faction page — Ephemerists&lt;/h2&gt;&lt;span class=&quot;rule&quot;&gt;&lt;/span&gt;\n    &lt;p&gt;The pre-join folio: full Ephemerist dress — an illuminated seal, a giant Cinzel wordmark with a lapis last word, the motto &lt;code style=&quot;color:#c8c4cd&quot;&gt;OMNIA · TRANSEUNT&lt;/code&gt;, gold stat leaves — while an unaffiliated viewer's chrome stays neutral. &lt;b style=&quot;color:#e9e6df&quot;&gt;Take the road&lt;/b&gt; flips the whole app into this.&lt;/p&gt;\n  &lt;/div&gt;\n  &lt;div class=&quot;rail&quot; id=&quot;factionRail&quot;&gt;&lt;/div&gt;\n\n&lt;/div&gt;\n\n&lt;script&gt;\n/* ---------- icons ---------- */\nconst ICON = {\n  home:'&lt;svg viewBox=&quot;0 0 24 24&quot;&gt;&lt;path d=&quot;M4 11l8-6 8 6&quot;/&gt;&lt;path d=&quot;M6 10v9h12v-9&quot;/&gt;&lt;/svg&gt;',\n  tasks:'&lt;svg viewBox=&quot;0 0 24 24&quot;&gt;&lt;path d=&quot;M9 6h11M9 12h11M9 18h11&quot;/&gt;&lt;path d=&quot;M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2&quot;/&gt;&lt;/svg&gt;',\n  praxis:'&lt;svg viewBox=&quot;0 0 24 24&quot;&gt;&lt;path d=&quot;M12 4l2.3 4.9 5.2.7-3.8 3.6.9 5.3-4.6-2.6-4.6 2.6.9-5.3L5.5 9.6l5.2-.7z&quot;/&gt;&lt;/svg&gt;',\n  players:'&lt;svg viewBox=&quot;0 0 24 24&quot;&gt;&lt;circle cx=&quot;9&quot; cy=&quot;9&quot; r=&quot;3&quot;/&gt;&lt;path d=&quot;M4 19c0-2.8 2.2-5 5-5s5 2.2 5 5&quot;/&gt;&lt;path d=&quot;M16 7.5a3 3 0 010 5.4M15 14.6c2.3.5 4 2.3 4 4.4&quot;/&gt;&lt;/svg&gt;',\n  factions:'&lt;svg viewBox=&quot;0 0 24 24&quot;&gt;&lt;path d=&quot;M12 3l7 3v5c0 4.4-3 7.6-7 9-4-1.4-7-4.6-7-9V6z&quot;/&gt;&lt;/svg&gt;',\n  bell:'&lt;svg viewBox=&quot;0 0 24 24&quot; style=&quot;width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round&quot;&gt;&lt;path d=&quot;M6 9a6 6 0 1112 0c0 5 2 6 2 6H4s2-1 2-6&quot;/&gt;&lt;path d=&quot;M10 20a2 2 0 004 0&quot;/&gt;&lt;/svg&gt;',\n  search:'&lt;svg viewBox=&quot;0 0 24 24&quot; style=&quot;width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round&quot;&gt;&lt;circle cx=&quot;11&quot; cy=&quot;11&quot; r=&quot;6.5&quot;/&gt;&lt;path d=&quot;M20 20l-4.2-4.2&quot;/&gt;&lt;/svg&gt;'\n};\nconst TABS = [['home','Home'],['tasks','Tasks'],['praxis','Praxis'],['players','Players'],['factions','Factions']];\nfunction tabbar(active){ return TABS.map(([k,l],i)=&gt;`&lt;button class=&quot;tab&quot; aria-selected=&quot;${i===active}&quot; data-tab=&quot;${i}&quot;&gt;${ICON[k]}&lt;span class=&quot;l&quot;&gt;${l}&lt;/span&gt;&lt;/button&gt;`).join(''); }\n\n/* ---------- Ephemerists signature bits ---------- */\nconst ROMAN = ['','I','II','III','IV','V','VI','VII','VIII','IX'];\nfunction roman(n){ return ROMAN[n]||('L'+n); }\nfunction eyebrow(motto){ return `&lt;div class=&quot;eph-eyebrow&quot;&gt;&lt;span class=&quot;eph-wm&quot;&gt;✧ EPHEMERISTS&lt;/span&gt;${motto?`&lt;div class=&quot;eph-motto&quot;&gt;${motto}&lt;/div&gt;`:''}&lt;/div&gt;`; }\nfunction lapisLast(t){ const w=t.split(' '); if(w.length&lt;2) return `&lt;span class=&quot;eph-lapis&quot;&gt;${t}&lt;/span&gt;`; const last=w.pop(); return `${w.join(' ')} &lt;span class=&quot;eph-lapis&quot;&gt;${last}&lt;/span&gt;`; }\nfunction ephChart(h){\n  h = h||150;\n  let lapis='';\n  for(let i=0;i&lt;11;i++) lapis+=`&lt;line x1=&quot;${i*20}&quot; y1=&quot;130&quot; x2=&quot;122&quot; y2=&quot;40&quot;/&gt;`;\n  [42,66,86,102,115].forEach(y=&gt;lapis+=`&lt;line x1=&quot;0&quot; y1=&quot;${y}&quot; x2=&quot;200&quot; y2=&quot;${y}&quot;/&gt;`);\n  let rub='';\n  [12,26,42,58].forEach(r=&gt;rub+=`&lt;circle cx=&quot;122&quot; cy=&quot;62&quot; r=&quot;${r}&quot;/&gt;`);\n  for(let i=0;i&lt;12;i++){ const a=i*Math.PI/6; rub+=`&lt;line x1=&quot;122&quot; y1=&quot;62&quot; x2=&quot;${(122+58*Math.cos(a)).toFixed(1)}&quot; y2=&quot;${(62+58*Math.sin(a)).toFixed(1)}&quot;/&gt;`; }\n  return `&lt;div class=&quot;eph-plate&quot; style=&quot;height:${h}px&quot;&gt;\n    &lt;div style=&quot;position:absolute;inset:0;opacity:.5;background-image:repeating-linear-gradient(0deg,rgba(42,29,18,.26) 0 1px,transparent 1px 16px),repeating-linear-gradient(90deg,rgba(42,29,18,.26) 0 1px,transparent 1px 16px)&quot;&gt;&lt;/div&gt;\n    &lt;svg viewBox=&quot;0 0 200 130&quot; preserveAspectRatio=&quot;none&quot; style=&quot;position:absolute;inset:0;width:100%;height:100%;opacity:.7&quot;&gt;&lt;g stroke=&quot;#1d4f6e&quot; stroke-width=&quot;.9&quot; fill=&quot;none&quot;&gt;${lapis}&lt;/g&gt;&lt;/svg&gt;\n    &lt;svg viewBox=&quot;0 0 200 130&quot; style=&quot;position:absolute;inset:0;width:100%;height:100%;opacity:.72&quot;&gt;&lt;g stroke=&quot;#9c3622&quot; stroke-width=&quot;.8&quot; fill=&quot;none&quot;&gt;${rub}&lt;/g&gt;&lt;/svg&gt;\n    &lt;span style=&quot;position:absolute;left:61%;top:44%;width:9px;height:9px;border-radius:50%;background:#d4ab55;box-shadow:0 0 10px 3px rgba(212,171,85,.6);z-index:4&quot;&gt;&lt;/span&gt;\n    &lt;span class=&quot;eph-coord&quot; style=&quot;top:8%;left:6%&quot;&gt;x 14 · y &lt;s style=&quot;opacity:.6&quot;&gt;8&lt;/s&gt; &lt;i class=&quot;eph-lapis&quot; style=&quot;font-style:italic&quot;&gt;9&lt;/i&gt;&lt;/span&gt;\n    &lt;span class=&quot;eph-coord eph-lapis&quot; style=&quot;top:6%;left:63%&quot;&gt;vanishing&lt;/span&gt;\n    &lt;span class=&quot;eph-coord eph-rubric&quot; style=&quot;top:73%;left:50%&quot;&gt;r 47 · θ 31°&lt;/span&gt;\n    &lt;span class=&quot;eph-margin&quot;&gt;¼″ wider within than without †&lt;/span&gt;\n  &lt;/div&gt;`;\n}\n/* the Ephemerists concord seals (real EphemeristsVote tiers) */\nfunction ephVote(sel){\n  const tiers=[['apocryphal',1],['disputed',2],['plausible',3],['corroborated',4],['canonical',5]];\n  return `&lt;div&gt;\n    &lt;div style=&quot;font-family:'Cinzel',serif;font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:#6f5c3e;text-align:center;margin-bottom:12px&quot;&gt;Seal your judgement&lt;/div&gt;\n    &lt;div style=&quot;display:flex;gap:8px;flex-wrap:wrap;justify-content:center&quot;&gt;` + tiers.map(([lbl,v])=&gt;{\n      const reached = sel&gt;=v, picked = sel===v;\n      return `&lt;div style=&quot;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:44px&quot;&gt;\n        &lt;button style=&quot;width:40px;height:40px;padding:0;border-radius:50%;border:1.5px solid ${reached?'#9c3622':'#a8905c'};background:${reached?'radial-gradient(circle at 38% 32%, #b8452e, #7c2417)':'#e9dcbf'};color:${reached?'#f1e8cf':'#8a6622'};font-family:'Cinzel',serif;font-weight:700;font-size:13px;box-shadow:${picked?'0 0 0 3px rgba(156,54,34,.25)':'none'}&quot;&gt;${roman(v)}&lt;/button&gt;\n        &lt;span style=&quot;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:8px;color:${reached?'#9c3622':'#6f5c3e'}&quot;&gt;${lbl}&lt;/span&gt;\n      &lt;/div&gt;`;\n    }).join('') + `&lt;/div&gt;&lt;/div&gt;`;\n}\n\n/* ---------- palette / helpers ---------- */\nconst FAC = { ua:'#c2541f', wow:'#ec5f99', snide:'#6fae00', ephemerists:'#1d6e72', singularity:'#2563eb', everymen:'#c1272d', albescent:'#8a8a86' };\nconst FACNAME = { ua:'UA', wow:'Wow', snide:'SNIDE', ephemerists:'Ephemerists', singularity:'Singularity', everymen:'Everymen', albescent:'Albescent' };\nconst AVC = ['#9c3622','#1d4f6e','#b0863a','#6f5c3e','#8a6622','#143b54'];\nfunction status(){ return `&lt;div class=&quot;statusbar&quot;&gt;&lt;span&gt;9:41&lt;/span&gt;&lt;span class=&quot;sig&quot;&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;span style=&quot;opacity:.55&quot;&gt;▮&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;`; }\nfunction appbar2(title,right){ return `&lt;div class=&quot;appbar&quot;&gt;&lt;div class=&quot;brand&quot;&gt;&lt;div class=&quot;brandmark&quot;&gt;&lt;/div&gt;&lt;div class=&quot;title-wrap&quot;&gt;&lt;div class=&quot;k&quot;&gt;Ephemerists&lt;/div&gt;&lt;div class=&quot;t&quot;&gt;${title}&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;${right||'&lt;span style=&quot;width:36px&quot;&gt;&lt;/span&gt;'}&lt;/div&gt;`; }\nfunction topbar(title,right){ return `&lt;div class=&quot;topbar&quot;&gt;&lt;div class=&quot;back&quot;&gt;‹&lt;/div&gt;&lt;div class=&quot;tt&quot;&gt;${title||''}&lt;/div&gt;${right||'&lt;span style=&quot;width:34px&quot;&gt;&lt;/span&gt;'}&lt;/div&gt;`; }\nconst searchBtn = `&lt;button class=&quot;iconbtn&quot;&gt;${ICON.search}&lt;/button&gt;`;\nconst moreBtn = `&lt;div class=&quot;back&quot; style=&quot;font-size:20px;line-height:0&quot;&gt;⋯&lt;/div&gt;`;\nfunction pav(bg,l,cls){ return `&lt;div class=&quot;pav${cls?' '+cls:''}&quot; style=&quot;background:${bg};color:#f1e8cf;border-radius:50%;font-family:'Cinzel',serif&quot;&gt;${l}&lt;/div&gt;`; }\nfunction diffDots(d){ return `&lt;span class=&quot;diff&quot;&gt;${[1,2,3].map(x=&gt;`&lt;i class=&quot;${x&lt;=d?'on':''}&quot;&gt;&lt;/i&gt;`).join('')}&lt;/span&gt;`; }\nfunction sec(label,right){ return `&lt;div class=&quot;sechead&quot; style=&quot;margin:14px 2px 2px&quot;&gt;&lt;span class=&quot;k&quot;&gt;${label}&lt;/span&gt;&lt;span class=&quot;rule&quot;&gt;&lt;/span&gt;${right||''}&lt;/div&gt;`; }\nfunction pvncta(v){ return `&lt;span style=&quot;font-family:'Cinzel',serif;font-weight:700;font-size:13px;color:#9c3622&quot;&gt;${v} pvncta&lt;/span&gt;`; }\nfunction gradeLine(lv){ return `&lt;span style=&quot;font-size:8px;color:#2a1d12&quot;&gt;▦ grade ${roman(lv)}&lt;/span&gt;`; }\n\n/* ---------- HOME ---------- */\nconst VOICE = { charK:'Your leaf', tasksK:'Open findings', link:'All', browse:'Consult the Codex', post:'Inscribe a Leaf', fac:'Ephemerists' };\nfunction home(){\n  const v = VOICE;\n  const activeTasks = [\n    { t:'Somewhere No One Needs To Be', fac:'ephemerists', facName:'Ephemerists', pv:15, slots:'3 slots', prog:40 },\n    { t:'A Very Human Thing', fac:'everymen', facName:'Everymen', pv:20, slots:'1 / 20', prog:null }\n  ];\n  const rows = activeTasks.map(t=&gt;`\n    &lt;div class=&quot;trow&quot; role=&quot;button&quot; tabindex=&quot;0&quot;&gt;\n      &lt;span class=&quot;dot&quot; style=&quot;background:${FAC[t.fac]}&quot;&gt;&lt;/span&gt;\n      &lt;div class=&quot;tmid&quot;&gt;\n        &lt;div class=&quot;tt&quot;&gt;${t.t}&lt;/div&gt;\n        &lt;div class=&quot;tm&quot;&gt;&lt;span class=&quot;fac&quot;&gt;${t.facName}&lt;/span&gt;&lt;span&gt;·&lt;/span&gt;&lt;span class=&quot;pv&quot;&gt;${t.pv} pvncta&lt;/span&gt;&lt;span&gt;·&lt;/span&gt;&lt;span&gt;${t.slots}&lt;/span&gt;&lt;/div&gt;\n        ${t.prog!=null?`&lt;div class=&quot;mini-bar&quot;&gt;&lt;i style=&quot;width:${t.prog}%&quot;&gt;&lt;/i&gt;&lt;/div&gt;`:''}\n      &lt;/div&gt;\n      &lt;span class=&quot;chev&quot;&gt;›&lt;/span&gt;\n    &lt;/div&gt;`).join('');\n  return `\n  ${status()}\n  &lt;div class=&quot;appbar&quot;&gt;\n    &lt;div class=&quot;brand&quot;&gt;&lt;div class=&quot;brandmark&quot;&gt;&lt;/div&gt;\n      &lt;div class=&quot;title-wrap&quot;&gt;&lt;div class=&quot;k&quot;&gt;Ephemerists&lt;/div&gt;&lt;div class=&quot;t&quot;&gt;FieldDesk&lt;/div&gt;&lt;/div&gt;\n    &lt;/div&gt;\n    &lt;button class=&quot;iconbtn&quot;&gt;${ICON.bell}&lt;/button&gt;\n  &lt;/div&gt;\n  &lt;div class=&quot;body&quot;&gt;\n    &lt;section class=&quot;ephcard&quot;&gt;\n      ${eyebrow('finding · testament · codex')}\n      &lt;div style=&quot;padding:6px 16px 16px&quot;&gt;\n        &lt;div class=&quot;char-id&quot;&gt;\n          &lt;div class=&quot;ring&quot;&gt;&lt;div class=&quot;av&quot;&gt;M&lt;/div&gt;&lt;/div&gt;\n          &lt;div class=&quot;who&quot;&gt;\n            &lt;div class=&quot;name&quot;&gt;Molly &lt;span class=&quot;caret&quot;&gt;▾&lt;/span&gt;&lt;/div&gt;\n            &lt;div class=&quot;meta&quot;&gt;&lt;span style=&quot;color:#9c3622&quot;&gt;${v.fac}&lt;/span&gt; &lt;span class=&quot;sep&quot;&gt;·&lt;/span&gt; Grade IV&lt;/div&gt;\n          &lt;/div&gt;\n          &lt;div class=&quot;pts&quot;&gt;&lt;b&gt;340&lt;/b&gt;&lt;span&gt;pvncta&lt;/span&gt;&lt;/div&gt;\n        &lt;/div&gt;\n        &lt;div class=&quot;stats&quot;&gt;\n          &lt;div class=&quot;stat&quot;&gt;&lt;b&gt;340&lt;/b&gt;&lt;span&gt;Pvncta&lt;/span&gt;&lt;/div&gt;\n          &lt;div class=&quot;stat&quot;&gt;&lt;b&gt;12&lt;/b&gt;&lt;span&gt;Seals&lt;/span&gt;&lt;/div&gt;\n          &lt;div class=&quot;stat&quot;&gt;&lt;b&gt;III&lt;/b&gt;&lt;span&gt;Era&lt;/span&gt;&lt;/div&gt;\n        &lt;/div&gt;\n        &lt;div class=&quot;sechead&quot; style=&quot;margin:14px 0 0&quot;&gt;&lt;span class=&quot;k&quot;&gt;${v.charK}&lt;/span&gt;&lt;span class=&quot;rule&quot;&gt;&lt;/span&gt;&lt;span style=&quot;display:flex;gap:14px;flex:none&quot;&gt;&lt;a href=&quot;#&quot;&gt;Switch&lt;/a&gt;&lt;a href=&quot;#&quot;&gt;Edit&lt;/a&gt;&lt;/span&gt;&lt;/div&gt;\n      &lt;/div&gt;\n    &lt;/section&gt;\n\n    &lt;section class=&quot;ephcard&quot;&gt;\n      ${eyebrow('open findings · 2')}\n      &lt;div style=&quot;padding:2px 16px 8px&quot;&gt;\n        &lt;div class=&quot;sechead&quot; style=&quot;margin:4px 0 2px&quot;&gt;&lt;span class=&quot;k&quot;&gt;${v.tasksK}&lt;/span&gt;&lt;span class=&quot;rule&quot;&gt;&lt;/span&gt;&lt;a href=&quot;#&quot;&gt;${v.link}&lt;/a&gt;&lt;/div&gt;\n        &lt;div class=&quot;tasks&quot;&gt;${rows}&lt;/div&gt;\n      &lt;/div&gt;\n    &lt;/section&gt;\n\n    &lt;div class=&quot;actions&quot;&gt;\n      &lt;button class=&quot;btn primary&quot;&gt;${v.browse}&lt;/button&gt;\n      &lt;button class=&quot;btn ghost&quot;&gt;&lt;span class=&quot;plus&quot;&gt;+&lt;/span&gt; ${v.post}&lt;/button&gt;\n    &lt;/div&gt;\n  &lt;/div&gt;\n  &lt;div class=&quot;tabbar&quot;&gt;${tabbar(0)}&lt;/div&gt;`;\n}\n\n/* ---------- TASKS ---------- */\nconst TASKS = [\n  { t:'Somewhere No One Needs To Be', fac:'ephemerists', desc:'Go to a place with no purpose. Document the nothing you find there.', pv:15, lv:2, slots:'3 slots' },\n  { t:'Knowledge Is Free', fac:'ephemerists', desc:'Teach a real skill to someone for free. Proof is their words, not yours.', pv:25, lv:2, slots:'5 / 12' },\n  { t:'A Very Human Thing', fac:'everymen', desc:'Do something quietly kind for a stranger, then write it down.', pv:20, lv:1, slots:'1 / 20' },\n  { t:'Lacunae', fac:'singularity', desc:'Find a gap in a system  16px 12px;text-align:center&quot;&gt;\n        &lt;div class=&quot;eph-title&quot; style=&quot;font-size:26px&quot;&gt;${lapisLast('Somewhere No One Needs To Be')}&lt;/div&gt;\n        &lt;div style=&quot;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px&quot;&gt;${gradeLine(2)}&lt;span style=&quot;color:#8a6622&quot;&gt;·&lt;/span&gt;${pvncta(15)}&lt;span style=&quot;color:#8a6622&quot;&gt;·&lt;/span&gt;&lt;span class=&quot;metatxt&quot;&gt;3 slots&lt;/span&gt;&lt;/div&gt;\n      &lt;/div&gt;\n    &lt;/div&gt;\n    &lt;p class=&quot;para eph-dropcap&quot; style=&quot;margin-top:16px&quot;&gt;Go to a place with no purpose — a stairwell to nowhere, a lot behind a station — and set down the nothing you find there, exactly as it is. The account is the proof.&lt;/p&gt;\n    &lt;p class=&quot;para&quot;&gt;A solo finding. A short testament and, if the place allows, one leaf of evidence.&lt;/p&gt;\n    ${sec('Filed leaves · 3')}\n    &lt;div&gt;${proofs.map(p=&gt;`&lt;div class=&quot;cmt&quot; style=&quot;align-items:center&quot;&gt;&lt;div class=&quot;cav&quot; style=&quot;background:${p.av};color:#f1e8cf;font-family:'Cinzel',serif&quot;&gt;${p.a[0]}&lt;/div&gt;&lt;div class=&quot;cb&quot;&gt;&lt;div class=&quot;cn&quot;&gt;${p.a}&lt;/div&gt;&lt;div style=&quot;font-family:'Cinzel',serif;color:#9c3622;font-size:11px;letter-spacing:.1em&quot;&gt;${roman(p.r)} · sealed&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;media&quot; style=&quot;width:46px;height:46px;flex:none&quot;&gt;LEAF&lt;/div&gt;&lt;/div&gt;`).join('')}&lt;/div&gt;\n    ${sec('Glosses · 2')}\n    &lt;div class=&quot;cmt&quot;&gt;&lt;div class=&quot;cav&quot; style=&quot;background:${AVC[0]};color:#f1e8cf;font-family:'Cinzel',serif&quot;&gt;M&lt;/div&gt;&lt;div class=&quot;cb&quot;&gt;&lt;div class=&quot;cn&quot;&gt;Molly &lt;span style=&quot;color:var(--text-3);font-weight:400&quot;&gt;· 1d&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ct&quot;&gt;Triangulating. There's a corridor under the old market that goes nowhere.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;\n    &lt;div class=&quot;cmt&quot;&gt;&lt;div class=&quot;cav&quot; style=&quot;background:${AVC[1]};color:#f1e8cf;font-family:'Cinzel',serif&quot;&gt;R&lt;/div&gt;&lt;div class=&quot;cb&quot;&gt;&lt;div class=&quot;cn&quot;&gt;Reza &lt;span style=&quot;color:var(--text-3);font-weight:400&quot;&gt;· 3d&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ct&quot;&gt;The road does not return you to where you began.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;\n  &lt;/div&gt;\n  &lt;div class=&quot;sticky-cta&quot;&gt;&lt;button class=&quot;btn primary&quot; style=&quot;flex:1&quot;&gt;Triangulate the truth ▸&lt;/button&gt;&lt;/div&gt;`;\n}\n\n/* ---------- PRAXIS ---------- */\nconst PROOFS = [\n  { a:'Reza', av:AVC[1], fac:'ephemerists', t:'The empty lot behind the station', r:5, v:190, c:22, time:'2h' },\n  { a:'Ida', av:AVC[4], fac:'ephemerists', t:'A corridor that only goes down', r:4, v:151, c:18, time:'6h' },\n  { a:'Bo', av:AVC[5], fac:null, t:'Where the two maps disagree', r:4, v:77, c:9, time:'1d' }\n];\nfunction proofCard(p){\n  return `&lt;div class=&quot;pcard&quot; style=&quot;background:none;border:0;box-shadow:none;overflow:visible&quot;&gt;\n    &lt;div class=&quot;pcard-head&quot; style=&quot;padding:0 0 10px&quot;&gt;${pav(p.av,p.a[0])}&lt;div&gt;&lt;div class=&quot;nm&quot;&gt;${p.a}&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;span style=&quot;color:${p.fac?FAC[p.fac]:'var(--text-3)'}&quot;&gt;●&lt;/span&gt; ${p.fac?'Ephemerists':'Unaffiliated'} · ${p.time} ago&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;\n    &lt;div class=&quot;ephcard&quot;&gt;\n      ${eyebrow('')}\n      &lt;div style=&quot;margin:0 6px&quot;&gt;&lt;div class=&quot;media&quot; style=&quot;height:150px;border:1px solid #8a6622&quot;&gt;LEAF&lt;/div&gt;&lt;/div&gt;\n      &lt;div style=&quot;padding:10px 14px 12px;text-align:center&quot;&gt;\n        &lt;div class=&quot;eph-title&quot; style=&quot;font-size:17px&quot;&gt;${lapisLast(p.t)}&lt;/div&gt;\n        &lt;div style=&quot;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px&quot;&gt;&lt;span style=&quot;font-family:'Cinzel',serif;color:#9c3622;font-size:11px;letter-spacing:.08em&quot;&gt;${roman(p.r)} · ${['','apocryphal','disputed','plausible','corroborated','canonical'][p.r]}&lt;/span&gt;&lt;span class=&quot;votecount&quot;&gt;${p.v} seals&lt;/span&gt;&lt;/div&gt;\n      &lt;/div&gt;\n    &lt;/div&gt;\n  &lt;/div&gt;`;\n}\nfunction praxisFeed(){\n  return status() + appbar2('Praxis', searchBtn) +\n  `&lt;div class=&quot;body&quot;&gt;\n    &lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip2 on&quot;&gt;Recent&lt;/span&gt;&lt;span class=&quot;chip2&quot;&gt;Most canonical&lt;/span&gt;&lt;span class=&quot;chip2&quot;&gt;Following&lt;/span&gt;&lt;/div&gt;\n    ${PROOFS.map(proofCard).join('')}\n  &lt;/div&gt;` + `&lt;div class=&quot;tabbar&quot;&gt;${tabbar(2)}&lt;/div&gt;`;\n}\nfunction praxisDetail(){\n  return status() + topbar('', moreBtn) +\n  `&lt;div class=&quot;body&quot; style=&quot;padding-top:2px&quot;&gt;\n    &lt;div class=&quot;pcard-head&quot; style=&quot;padding:4px 0 12px&quot;&gt;${pav(AVC[1],'R')}&lt;div style=&quot;flex:1&quot;&gt;&lt;div class=&quot;nm&quot;&gt;Reza&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;span style=&quot;color:${FAC.ephemerists}&quot;&gt;●&lt;/span&gt; Ephemerists · 2h ago&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;chip2&quot;&gt;Follow&lt;/span&gt;&lt;/div&gt;\n    &lt;div class=&quot;ephcard&quot;&gt;${eyebrow('')}&lt;div style=&quot;margin:0 6px 6px&quot;&gt;&lt;div class=&quot;media&quot; style=&quot;height:210px;border:1px solid #8a6622&quot;&gt;LEAF&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;\n    &lt;div class=&quot;eph-title&quot; style=&quot;font-size:23px;margin:16px 0 4px;text-align:left&quot;&gt;${lapisLast('The empty lot behind the station')}&lt;/div&gt;\n    &lt;div class=&quot;mdprev&quot; style=&quot;margin-top:8px&quot;&gt;\n      &lt;p&gt;A rectangle of weeds the size of a house, fenced on three sides. Nobody goes in; the gate has been chained since before the map was drawn.&lt;/p&gt;\n      &lt;p&gt;I stood in it for an hour. The account is short because the place is honest: it is a place that does not need to be.&lt;/p&gt;\n    &lt;/div&gt;\n    &lt;div class=&quot;votebar&quot; style=&quot;margin:10px 0 4px;align-items:stretch;background:#e9dcbf;border:1px solid #8a6622&quot;&gt;\n      ${ephVote(5)}\n      &lt;div class=&quot;votelbl&quot; style=&quot;text-align:center;margin-top:12px;color:#6f5c3e&quot;&gt;Canonical · 190 seals&lt;/div&gt;\n    &lt;/div&gt;\n    ${sec('Glosses · 3')}\n    &lt;div class=&quot;cmt&quot;&gt;&lt;div class=&quot;cav&quot; style=&quot;background:${AVC[4]};color:#f1e8cf;font-family:'Cinzel',serif&quot;&gt;I&lt;/div&gt;&lt;div class=&quot;cb&quot;&gt;&lt;div class=&quot;cn&quot;&gt;Ida &lt;span style=&quot;color:var(--text-3);font-weight:400&quot;&gt;· 1h&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ct&quot;&gt;Filed a leaf next to yours. The chain is newer than the fence.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;\n    &lt;div class=&quot;cmt&quot;&gt;&lt;div class=&quot;cav&quot; style=&quot;background:${AVC[5]};color:#f1e8cf;font-family:'Cinzel',serif&quot;&gt;B&lt;/div&gt;&lt;div class=&quot;cb&quot;&gt;&lt;div class=&quot;cn&quot;&gt;Bo &lt;span style=&quot;color:var(--text-3);font-weight:400&quot;&gt;· 40m&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ct&quot;&gt;Sealed canonical. This is exactly a place that does not need to be.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;\n  &lt;/div&gt;\n  &lt;div class=&quot;sticky-cta&quot;&gt;&lt;div class=&quot;searchbar&quot; style=&quot;flex:1;border-radius:0&quot;&gt;Add a gloss…&lt;/div&gt;&lt;button class=&quot;btn primary&quot; style=&quot;flex:none;padding:13px 16px&quot;&gt;Seal&lt;/button&gt;&lt;/div&gt;`;\n}\nfunction composerWrite(){\n  return status() +\n  `&lt;div class=&quot;topbar&quot;&gt;&lt;a href=&quot;#&quot; class=&quot;act&quot; style=&quot;color:var(--text-2)&quot;&gt;Cancel&lt;/a&gt;&lt;div class=&quot;tt&quot; style=&quot;flex:1;text-align:center;font-size:18px&quot;&gt;Inscribe a Leaf&lt;/div&gt;&lt;a href=&quot;#&quot; class=&quot;act&quot;&gt;Seal&lt;/a&gt;&lt;/div&gt;\n  &lt;div class=&quot;body&quot; style=&quot;gap:14px&quot;&gt;\n    &lt;div class=&quot;seg&quot;&gt;&lt;button class=&quot;on&quot;&gt;Write&lt;/button&gt;&lt;button&gt;Preview&lt;/button&gt;&lt;/div&gt;\n    &lt;div class=&quot;forrow&quot;&gt;&lt;span&gt;RE: FINDING&lt;/span&gt;&lt;b&gt;Somewhere No One Needs To Be ▾&lt;/b&gt;&lt;/div&gt;\n    &lt;input class=&quot;field&quot; value=&quot;The empty lot behind the station&quot; /&gt;\n    &lt;textarea class=&quot;ta&quot;&gt;## The account\n\nA rectangle of weeds the size of a house, fenced on three sides. Nobody goes in.\n\n- gate chained since before the map\n- stood inside for one hour\n- it is a place that does not need to be&lt;/textarea&gt;\n    &lt;div&gt;&lt;label class=&quot;form-lbl&quot;&gt;Leaves&lt;/label&gt;&lt;div class=&quot;mgrid&quot;&gt;&lt;div class=&quot;media&quot;&gt;LEAF&lt;/div&gt;&lt;div class=&quot;media&quot;&gt;LEAF&lt;/div&gt;&lt;div class=&quot;madd&quot;&gt;+&lt;small&gt;Add&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;\n  &lt;/div&gt;\n  &lt;div class=&quot;kbd-acc&quot;&gt;&lt;span style=&quot;font-weight:700&quot;&gt;B&lt;/span&gt;&lt;span style=&quot;font-style:italic&quot;&gt;I&lt;/span&gt;&lt;span&gt;#&lt;/span&gt;&lt;span&gt;“ ”&lt;/span&gt;&lt;span&gt;≡&lt;/span&gt;&lt;span class=&quot;ph&quot;&gt;▦ Leaf&lt;/span&gt;&lt;/div&gt;\n  &lt;div class=&quot;kbd&quot;&gt;On-screen keyboard&lt;/div&gt;`;\n}\nfunction composerPreview(){\n  return status() +\n  `&lt;div class=&quot;topbar&quot;&gt;&lt;a href=&quot;#&quot; class=&quot;act&quot; style=&quot;color:var(--text-2)&quot;&gt;Cancel&lt;/a&gt;&lt;div class=&quot;tt&quot; style=&quot;flex:1;text-align:center;font-size:18px&quot;&gt;Inscribe a Leaf&lt;/div&gt;&lt;a href=&quot;#&quot; class=&quot;act&quot;&gt;Seal&lt;/a&gt;&lt;/div&gt;\n  &lt;div class=&quot;body&quot; style=&quot;gap:14px&quot;&gt;\n    &lt;div class=&quot;seg&quot;&gt;&lt;button&gt;Write&lt;/button&gt;&lt;button class=&quot;on&quot;&gt;Preview&lt;/button&gt;&lt;/div&gt;\n    &lt;div class=&quot;ephcard&quot;&gt;\n      ${eyebrow('finding · testament · codex')}\n      &lt;div style=&quot;margin:0 6px&quot;&gt;&lt;div class=&quot;media&quot; style=&quot;height:160px;border:1px solid #8a6622&quot;&gt;LEAF&lt;/div&gt;&lt;/div&gt;\n      &lt;div style=&quot;padding:10px 16px 14px&quot;&gt;\n        &lt;div class=&quot;eph-title&quot; style=&quot;font-size:19px;text-align:center;margin-bottom:8px&quot;&gt;${lapisLast('The empty lot behind the station')}&lt;/div&gt;\n        &lt;div class=&quot;mdprev&quot;&gt;\n          &lt;p&gt;A rectangle of weeds the size of a house, fenced on three sides. Nobody goes in.&lt;/p&gt;\n          &lt;ul style=&quot;margin:0;padding:0;list-style:none&quot;&gt;&lt;li&gt;· gate chained since before the map&lt;/li&gt;&lt;li&gt;· stood inside for one hour&lt;/li&gt;&lt;li&gt;· a place that does not need to be&lt;/li&gt;&lt;/ul&gt;\n        &lt;/div&gt;\n      &lt;/div&gt;\n    &lt;/div&gt;\n  &lt;/div&gt;\n  &lt;div class=&quot;sticky-cta&quot;&gt;&lt;button class=&quot;btn primary&quot; style=&quot;flex:1&quot;&gt;Seal this leaf ▸&lt;/button&gt;&lt;/div&gt;`;\n}\n\n/* ---------- UPDATES ---------- */\nfunction screenUpdates(){\n  const row = (unread,text,time) =&gt; `&lt;div class=&quot;up-row${unread?'':' read'}&quot;&gt;&lt;span class=&quot;udot&quot; style=&quot;${unread?'background:#9c3622':''}&quot;&gt;&lt;/span&gt;&lt;div class=&quot;ub&quot;&gt;&lt;div class=&quot;utext&quot;&gt;${text}&lt;/div&gt;&lt;div class=&quot;utime&quot; style=&quot;${unread?'color:#1d4f6e':''}&quot;&gt;${time}&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;`;\n  const day = (label) =&gt; `&lt;div class=&quot;up-group&quot;&gt;${label}&lt;/div&gt;&lt;div style=&quot;heigh ing:12px 16px 16px;text-align:center&quot;&gt;\n        &lt;div class=&quot;eph-title&quot; style=&quot;font-size:40px;line-height:.95&quot;&gt;${lapisLast('Ephemerists')}&lt;/div&gt;\n        &lt;div style=&quot;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:12px;color:#6f5c3e;margin-top:8px&quot;&gt;Wanderers who set down what is true before it passes.&lt;/div&gt;\n      &lt;/div&gt;\n    &lt;/div&gt;\n    &lt;div style=&quot;display:flex;gap:10px;margin-top:14px&quot;&gt;${statLeaf('97','Keepers')}${statLeaf('42','Findings')}${statLeaf('III','Era')}&lt;/div&gt;\n    &lt;p class=&quot;para eph-dropcap&quot; style=&quot;margin-top:16px&quot;&gt;Nothing keeps. We keep the record anyway. The Ephemerists map the roads, the lacunae and the places that do not need to be, and seal each account into the codex before it passes. Take the road and your whole app becomes vellum.&lt;/p&gt;\n    ${sec('Keepers of the road')}\n    &lt;div&gt;${PLAYERS.map((p,i)=&gt;`&lt;div class=&quot;prow2&quot;&gt;&lt;div class=&quot;rank&quot;&gt;${roman(i+1)}&lt;/div&gt;${pav(p.av,p.n[0])}&lt;div class=&quot;pinfo&quot;&gt;&lt;div class=&quot;n&quot;&gt;${p.n}&lt;/div&gt;&lt;div class=&quot;m&quot;&gt;&lt;i style=&quot;background:${FAC.ephemerists}&quot;&gt;&lt;/i&gt;Ephemerists · Gr ${roman(p.lv)}&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ppts2&quot;&gt;&lt;b&gt;${p.pts}&lt;/b&gt;&lt;span&gt;pvncta&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;`).join('')}&lt;/div&gt;\n    ${sec('Recent leaves')}\n    &lt;div class=&quot;thumbs&quot; style=&quot;margin-top:8px&quot;&gt;${Array.from({length:3}).map(()=&gt;`&lt;div class=&quot;media&quot; style=&quot;aspect-ratio:1;border:1px solid #8a6622&quot;&gt;LEAF&lt;/div&gt;`).join('')}&lt;/div&gt;\n  &lt;/div&gt;\n  &lt;div class=&quot;sticky-cta&quot;&gt;&lt;button class=&quot;btn primary&quot; style=&quot;flex:1&quot;&gt;Take the road ▸&lt;/button&gt;&lt;/div&gt;`;\n}\n\n/* ---------- render (Ephemerists · native light) ---------- */\nfunction renderRail(id, list){\n  document.getElementById(id).innerHTML = list.map(([label,fn])=&gt;`\n    &lt;div class=&quot;phone-wrap&quot;&gt;\n      &lt;div class=&quot;phone-tag&quot;&gt;&lt;b&gt;${label}&lt;/b&gt; · Light&lt;/div&gt;\n      &lt;div class=&quot;phone&quot;&gt;&lt;div class=&quot;screen&quot; data-theme=&quot;light&quot; data-treatment=&quot;ephemerists&quot;&gt;${fn()}&lt;/div&gt;&lt;/div&gt;\n    &lt;/div&gt;`).join('');\n}\nrenderRail('homeRail',    [['Home', home]]);\nrenderRail('tasksRail',   [['Browse', tasksBrowse], ['Detail', taskDetail]]);\nrenderRail('praxisRail',  [['Feed', praxisFeed], ['Detail', praxisDetail], ['Compose · Write', composerWrite], ['Compose · Preview', composerPreview]]);\nrenderRail('updatesRail', [['Ephemerides', screenUpdates]]);\nrenderRail('factionRail', [['Faction page', factionDetail]]);\n\n/* ---------- anatomy + kit specimens ---------- */\ndocument.getElementById('anatomy').innerHTML =\n  `&lt;div class=&quot;screen&quot; data-theme=&quot;light&quot; data-treatment=&quot;ephemerists&quot; style=&quot;border-radius:6px;overflow:hidden;height:auto;background:#ded0ab;padding:16px&quot;&gt;\n     &lt;div class=&quot;ephcard&quot;&gt;${eyebrow('finding · testament · codex')}${ephChart(140)}&lt;div style=&quot;padding:8px 14px 10px;text-align:center&quot;&gt;&lt;div class=&quot;eph-title&quot;&gt;${lapisLast('Lacunae')}&lt;/div&gt;&lt;div style=&quot;display:flex;align-items:center;justify-content:center;gap:7px;margin-top:6px&quot;&gt;${gradeLine(3)}&lt;span style=&quot;color:#8a6622&quot;&gt;·&lt;/span&gt;${pvncta(40)}&lt;/div&gt;&lt;/div&gt;&lt;button class=&quot;eph-signup&quot;&gt;Triangulate the truth ▸&lt;/button&gt;&lt;/div&gt;\n   &lt;/div&gt;`;\ndocument.getElementById('ephkit').innerHTML =\n  `&lt;div style=&quot;margin-bottom:12px;max-width:210px&quot;&gt;${ephChart(120)}&lt;/div&gt;${ephVote(3)}`;\n\n/* ---------- light interactivity ---------- */\ndocument.querySelectorAll('.rail, .spec').forEach(rail=&gt;{\n  rail.addEventListener('click',e=&gt;{\n    const tab = e.target.closest('.tab');\n    if(tab){ const bar = tab.closest('.tabbar'); bar.querySelectorAll('.tab').forEach(t=&gt;t.setAttribute('aria-selected', t===tab)); return; }\n    const seg = e.target.closest('.seg button');\n    if(seg){ seg.parentElement.querySelectorAll('button').forEach(b=&gt;b.classList.toggle('on', b===seg)); }\n  });\n});\n&lt;/script&gt;\n&lt;/body&gt;\n&lt;/html&gt;\n\"><\u002Fiframe><span class=\"hit\"><\u002Fspan><\u002Fdiv>\n    <div class=\"meta\"><div class=\"n\"><span class=\"dot\" style=\"background:#1d6e72\"><\u002Fspan><b>Ephemerists<\u002Fb><span class=\"mode light\">light<\u002Fspan><\u002Fdiv><p>The vellum codex — illuminated cartographic plates, Cinzel titles, concord seals, drop caps.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n<div class=\"card\">\n    <div class=\"frame\"><iframe scrolling=\"no\" tabindex=\"-1\" srcdoc=\"&lt;!DOCTYPE html&gt;\n&lt;html lang=&quot;en&quot;&gt;\n&lt;head&gt;\n&lt;meta charset=&quot;utf-8&quot;&gt;\n&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1&quot;&gt;\n&lt;title&gt;World Zero — Albescent Treatment · Mobile Field Kit&lt;/title&gt;\n&lt;link rel=&quot;preconnect&quot; href=&quot;https://fonts.googleapis.com&quot;&gt;\n&lt;link rel=&quot;preconnect&quot; href=&quot;https://fonts.gstatic.com&quot; crossorigin&gt;\n&lt;link href=&quot;https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&amp;family=Courier+Prime:wght@400;700&amp;family=Special+Elite&amp;display=swap&quot; rel=&quot;stylesheet&quot;&gt;\n&lt;style&gt;\n/* ============================================================\n   BOARD (review surface — not part of the product)\n   ============================================================ */\n*{box-sizing:border-box}\nhtml,body{margin:0}\nbody{\n  background:#26252c;\n  color:#e9e6df;\n  font-family:&quot;Courier Prime&quot;,monospace;\n  -webki ild{border-bottom:0}\n.ty .demo{color:#f4f1ea;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.ty .meta{font-size:10px;color:#807d89;text-align:right;flex:none;line-height:1.5}\n.ty .meta b{color:#c8c4cd;font-weight:400}\n\n.pattern-note{font-size:11px;line-height:1.7;color:#a5a1ac}\n.pattern-note b{color:#e9e6df;font-weight:400}\n.pill-legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}\n.pill-legend span{font-size:10px;letter-spacing:.06em;color:#c8c4cd;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:999px;padding:5px 11px}\n\n/* token cascade table */\n.cascade{width:100%;border-collapse:collapse;font-size:11px}\n.cascade th{text-align:left;font-weight:400;color:#807d89;letter-spacing:.1em;text-transform:uppercase;font-size:9px;padding:0 10px 10px;border-bottom:1px solid rgba(255,255,255,.1)}\n.cascade td{padding:9px 10px;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:middle;color:#c8c4cd}\n.cascade td code{color:#9d99a6;font-size:10px}\n.chip{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:middle;margin-right:7px;border:1px solid rgba(255,255,255,.18)}\n\n/* phone rail */\n.rail{display:flex;flex-wrap:wrap;gap:34px 30px;align-items:flex-start}\n.phone-wrap{display:flex;flex-direction:column;align-items:center;gap:14px}\n.phone-tag{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#8a8794}\n.phone-tag b{color:#e7b94f;font-weight:400}\n\n/* ============================================================\n   PHONE FRAME + PRODUCT\n   ============================================================ */\n.phone{\n  width:375px;height:770px;border-radius:46px;flex:none;position:relative;\n  background:#0a0a0d;padding:11px;\n  box-shadow:0 2px 4px rgba(0,0,0,.4),0 24px 60px rgba(0,0,0,.5),inset 0 0 0 2px rgba(255,255,255,.05);\n}\n.screen{\n  position:relative;width:100%;height:100%;border-radius:36px;overflow:hidden;\n  display:flex;flex-direction:co
