# Bot Bros config (https://github.com/pixieofhugs/bot-bros). `scripts/wz check` runs `bros check`.
base = "origin/main"

[[check]]
name = "ruff"
paths = ["backend/*"]
run = "scripts/wz test tests/unit/test_ruff_clean.py"

[[check]]
name = "pytest"
paths = ["backend/*"]
run = "scripts/wz test --deselect tests/unit/test_ruff_clean.py --cov=. --cov-fail-under=92"

[[check]]
name = "node_modules"
paths = ["frontend/*", ".design-sync/*"]
run = "test -x frontend/node_modules/.bin/tsc || { echo 'frontend/node_modules is missing: run scripts/wz prep.'; exit 1; }"

[[check]]
name = "lint"
paths = ["frontend/*", ".design-sync/*"]
run = "npm --prefix frontend run --silent lint"

[[check]]
name = "typecheck"
paths = ["frontend/*", ".design-sync/*"]
run = "npm --prefix frontend run --silent typecheck"

[[check]]
name = "typecheck:design-sync"
paths = ["frontend/*", ".design-sync/*"]
run = "npm --prefix frontend run --silent typecheck:design-sync"

[[check]]
name = "test"
paths = ["frontend/*", ".design-sync/*"]
run = "npm --prefix frontend run --silent test"

[[check]]
name = "build"
paths = ["frontend/*", ".design-sync/*"]
run = "npm --prefix frontend run --silent build"

[[check]]
name = "budget"
paths = ["frontend/*", ".design-sync/*"]
run = "npm --prefix frontend run --silent budget"

[[check]]
name = "comments"
paths = ["backend/*", "frontend/*", "scripts/*"]
run = "bros comments origin/main"

[comments]
skip = ["frontend/src/api/generated/", "backend/alembic/versions/"]

[pr_body]
words = 250

[bouncer]
ask = [".github/*"]
# Human-only: no agent edits the merge guard, its text or its logic.
deny = ["scripts/hooks/guard_pr_merge.py"]
