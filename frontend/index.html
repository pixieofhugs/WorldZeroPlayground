<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>World Zero</title>
    <script>
      // Pre-paint theme bootstrap (mirrors useTheme's getInitialTheme).
      // Applies the persisted [data-theme] before first paint so a mobile
      // refresh (MobileLayout never mounts useTheme) doesn't revert to light,
      // and desktop doesn't flash light before React hydrates. Keep this in
      // sync with THEME_STORAGE_KEY ('wz-theme') and DEFAULT_THEME in
      // src/hooks/useTheme.tsx — a disagreement is a visible flip on hydration.
      // Dark is the default and light is opt-in via the toggle (#1698), so the
      // OS scheme is deliberately not consulted. The attribute must be written
      // even when storage throws: the CSS default is light, so leaving it unset
      // would hand a private-mode visitor the theme this bootstrap exists to
      // prevent.
      (function () {
        var theme = 'dark'
        try {
          var stored = localStorage.getItem('wz-theme')
          if (stored === 'light' || stored === 'dark') theme = stored
        } catch (error) {
          /* localStorage can throw (private mode, blocked storage) — keep the default. */
        }
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>
    <!-- The API is a separate origin in production, so the first data request
         otherwise pays DNS + TCP + TLS before it can even be sent — about three
         round trips. Warming the connection here overlaps that with the bundle
         download. Harmless in dev, where the origin differs and the hint is
         simply unused. -->
    <link rel="preconnect" href="https://api.worldzero.org" crossorigin />
    <!-- The 18 faces used to be one render-blocking stylesheet on
         fonts.googleapis.com, which needed the two preconnects that stood here
         and still cost a serial hop: fetch Google's CSS, THEN discover the
         gstatic woff2 URLs inside it. They are self-hosted now (#1977) —
         `src/fonts.css` is @imported by index.css, so the SHELL's three
         families arrive inside the stylesheet the browser was already blocked
         on, from an origin it is already connected to. The other fifteen are in
         `src/fonts.faction.css`, which nothing @imports: it rides the chunk of
         whatever faction surface needs it (#2079), so it is deliberately absent
         from this file and must stay that way.

         Deliberately no `rel="preload"` for the faces themselves. Which of the
         41 a page needs depends on the visitor's faction and route, so a static
         preload list would either be wrong or download faces nobody renders;
         `font-display: swap` covers the gap. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
