<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Push can't turn on</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/wz/styles.css">
<script src="ds/wz/_ds_bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--color-accent-primary)}a:hover{color:var(--color-text-primary)}
</style>
</helmet>
<x-import component-from-global-scope="WZ.DSProvider">
<div style="width: 860px; height: 760px; box-sizing: border-box; padding: 24px; display: flex; gap: 32px; background: #d9d4cb;">
<sc-for list="{{sides}}" as="side" hint-placeholder-count="2">
  <div data-theme="{{side.theme}}" style="width: 390px; height: 712px; box-sizing: border-box; padding: 20px 16px; display: flex; flex-direction: column; gap: 14px; background: var(--color-bg-page); color: var(--color-text-primary); font-family: var(--font-body);">
    <p style="margin: 0; font-family: var(--font-accent); font-size: 15px; letter-spacing: 0.14em; color: var(--color-text-tertiary);">SETTINGS · TOP OF THE PUSH COLUMN</p>
    <sc-for list="{{states}}" as="st" hint-placeholder-count="3">
      <section style="background: var(--color-bg-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: 16px 18px; display: flex; flex-direction: column; gap: 10px;">
        <span style="font-family: var(--font-accent); font-size: 14px; letter-spacing: 0.14em; color: var(--color-text-tertiary);">{{st.when}}</span>
        <div style="display: flex; gap: 14px; align-items: flex-start; justify-content: space-between;">
          <div style="display: flex; flex-direction: column; gap: 4px;">
            <span style="font-family: var(--font-display); font-size: 17px; font-weight: 600; line-height: 1.3;">Push to this phone</span>
            <span id="{{st.id}}" style="font-size: 14px; line-height: 1.5; color: var(--color-text-secondary);">{{st.note}}</span>
          </div>
          <div style="width: 84px; display: flex; flex-direction: column; align-items: center; gap: 4px; flex-shrink: 0;">
            <x-import component-from-global-scope="WZ.SettingsSwitch" checked="{{no}}" disabled="{{yes}}" label="{{st.label}}" described-by-id="{{st.id}}" on-toggle="{{noop}}"></x-import>
            <span aria-hidden="true" style="font-size: 12px; color: var(--color-accent-primary);">Push</span>
          </div>
        </div>
        <sc-if value="{{st.action}}" hint-placeholder-val="{{false}}">
          <button type="button" class="btn-outline" style="min-height: 44px; align-self: flex-start;">{{st.action}}</button>
        </sc-if>
      </section>
    </sc-for>
  </div>
</sc-for>
</div>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":860,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    const states = [
      { when: 'IPHONE, NOT ON THE HOME SCREEN', id: 'ps-ios',
        note: 'iPhones only deliver notifications to the home-screen app. Put World Zero there first, then open it from the icon.',
        label: 'Push to this phone — add World Zero to your home screen first', action: 'Show me how' },
      { when: 'YOU SAID NO TO THE BROWSER', id: 'ps-denied',
        note: 'Your browser is blocking World Zero. Unblock notifications in this site’s settings, then come back. We can’t ask twice; browsers don’t let us.',
        label: 'Push to this phone — notifications are blocked in your browser settings', action: null },
      { when: 'NO PUSH KEYS ON THIS SERVER', id: 'ps-keys',
        note: 'Push isn’t set up on this server, so nothing will buzz. Updates and the rest still work.',
        label: 'Push to this phone — push is not set up on this server', action: null }
    ];
    return { states, yes: true, no: false, noop: () => {}, sides: [{ theme: 'light' }, { theme: 'dark' }] };
  }
}
</script>
</body>
</html>
