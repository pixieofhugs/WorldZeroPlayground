      <p style="margin: 0; font-size: 15px; line-height: 1.55; color: var(--color-text-secondary);">We'll buzz your phone when people rate it, comment on it, or call you out. Ambient chatter stays off unless you go looking for it in Settings.</p>
      <div style="display: flex; gap: 10px; flex-wrap: wrap;">
        <button type="button" class="btn-primary" style="min-height: 44px; border: 0; flex-grow: 1;">Turn on notifications</button>
        <button type="button" class="btn-outline" style="min-height: 44px;">Not now</button>
      </div>
      <p style="margin: 0; font-size: 13px; line-height: 1.5; color: var(--color-text-tertiary);">Your phone will ask too. That one is the one that counts.</p>
    </section>
  </div>
</sc-for>
