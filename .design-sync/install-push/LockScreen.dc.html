<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>What a push says</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/wz/styles.css">
<script src="ds/wz/_ds_bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 860px; height: 600px; box-sizing: border-box; padding: 24px; display: flex; gap: 32px; background: #d9d4cb;">
<sc-for list="{{sides}}" as="side" hint-placeholder-count="2">
  <div style="width: 390px; height: 552px; box-sizing: border-box; padding: 20px 14px; display: flex; flex-direction: column; gap: 10px; background: {{side.ground}}; border-radius: 28px; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;">
    <p style="margin: 0 0 6px 6px; font-size: 13px; letter-spacing: 0.04em; color: {{side.caption}};">{{side.name}}</p>
    <sc-for list="{{pushes}}" as="p" hint-placeholder-count="3">
      <div style="display: flex; gap: 12px; padding: 12px 14px; border-radius: 18px; background: {{side.tile}}; color: {{side.ink}};">
        <svg aria-hidden="true" width="38" height="38" viewBox="0 0 64 64" style="flex-shrink: 0;"><defs><linearGradient id="{{p.grad}}{{side.key}}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c1272d"></stop><stop offset="0.17" stop-color="#c2541f"></stop><stop offset="0.33" stop-color="#ca8a04"></stop><stop offset="0.5" stop-color="#16a34a"></stop><stop offset="0.67" stop-color="#1d6e72"></stop><stop offset="0.83" stop-color="#2563eb"></stop><stop offset="1" stop-color="#be185d"></stop></linearGradient></defs><rect x="0" y="0" width="64" height="64" rx="14" fill="#1a1209"></rect><text x="32.5" y="44.5" text-anchor="middle" font-family="Lora, Georgia, serif" font-style="italic" font-weight="700" font-size="34" fill="url(#{{p.grad}}{{side.key}})">WØ</text></svg>
        <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0; flex-grow: 1;">
          <div style="display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: {{side.sub}};">
            <span>World Zero · for {{p.who}}</span><span>{{p.ago}}</span>
          </div>
          <span style="font-size: 15px; font-weight: 600; line-height: 1.3;">{{p.title}}</span>
          <span style="font-size: 14px; line-height: 1.4; color: {{side.body}};">{{p.body}}</span>
        </div>
      </div>
    </sc-for>
    <p style="margin: 8px 6px 0; font-size: 12px; line-height: 1.5; color: {{side.caption}};">Ratings replace each other rather than stack: one banner, the count goes up.</p>
  </div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":860,"height":600}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      pushes: [
        { grad: 'g1', who: 'Agent Teacup', ago: 'now', title: '3 new ratings', body: 'Juniper and 2 others rated your praxis for Find a Cool Stick.' },
        { grad: 'g2', who: 'Agent Teacup', ago: '12m', title: 'Moss mentioned you', body: 'In a comment on Feed a Stranger.' },
        { grad: 'g3', who: 'Night Heron', ago: '1h', title: 'Bramble challenged you to a duel', body: 'Find a Cool Stick. Answer it from Updates.' },
        { grad: 'g4', who: 'Agent Teacup', ago: '3h', title: 'Wren wants to collaborate', body: 'Join their praxis for Plant Something Stubborn.' }
      ],
      sides: [
        { key: 'L', name: 'Phone in light mode', ground: '#c9c4bb', tile: 'rgba(255,255,255,0.86)', ink: '#141210', sub: '#4d4740', body: '#2b2620', caption: '#3a352e' },
        { key: 'D', name: 'Phone in dark mode', ground: '#16151c', tile: 'rgba(52,50,62,0.92)', ink: '#f2efe8', sub: '#b9b4c4', body: '#dcd8e2', caption: '#c9c4d4' }
      ]
    };
  }
}
</script>
</body>
</html>
