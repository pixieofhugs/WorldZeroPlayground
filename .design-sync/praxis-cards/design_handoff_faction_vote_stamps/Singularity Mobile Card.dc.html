<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { tick: 0, sel: 0, hov: 0 };
  componentDidMount(){ this._iv = setInterval(() => this.setState(s => ({ tick: s.tick + 1 })), 120); }
  componentWillUnmount(){ clearInterval(this._iv); }
  rand(seed){
    const M = 'ｱｲｳｴｵｶｷｸｹｺﾊﾋﾌﾍﾎﾐﾑ0123456789#%$*+=<>?/'.split('');
    const i = ((Math.floor(seed*131 + this.state.tick*71) % M.length) + M.length) % M.length;
    return M[i];
  }
  renderVals(){
    const e = React.createElement;
    const GREEN = '#4ade80', CYAN = '#60a5fa';
    const SIG = [{v:1,name:'Noise'},{v:2,name:'Weak'},{v:3,name:'Signal'},{v:4,name:'Clear'},{v:5,name:'Verified'}];
    const dens = ['·','+','*','#','█'];
    const { sel, hov } = this.state;
    const active = hov || sel;
    const setHov = v => this.setState({ hov: v });
    const pick = v => this.setState(s => ({ sel: s.sel === v ? 0 : v }));
    const btnBase = { border:'none', background:'transparent', padding:0, margin:0, cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center' };

    const rowEl = e('div', { style:{ display:'flex', gap:6, alignItems:'flex-end' } }, SIG.map(t => {
      const reached = active >= t.v, picked = sel === t.v, top = t.v === 5;
      const col = top ? CYAN : GREEN;
      const lines = [0,1,2].map(r => {
        const txt = reached ? dens[t.v-1].repeat(3)
          : this.rand(t.v*30+r*3+1) + this.rand(t.v*30+r*3+2) + this.rand(t.v*30+r*3+3);
        return e('div', { key:r, style:{ lineHeight:1 } }, txt);
      });
      return e('button', { key:t.v, onClick:()=>pick(t.v), onMouseEnter:()=>setHov(t.v),
        'aria-label':'Rate '+t.v, style:{ ...btnBase, flexDirection:'column', gap:1,
          width:52, height:48, padding:'3px 0', borderRadius:2,
          fontFamily:"'Share Tech Mono', monospace", fontSize:13, letterSpacing:'2px',
          color: reached ? col : 'rgba(74,222,128,0.24)',
          textShadow: reached ? '0 0 8px '+col : 'none',
          background: reached ? 'rgba(74,222,128,0.05)' : 'transparent',
          outline: picked ? '1px solid '+col : 'none', outlineOffset:2, transition:'color 120ms, background 120ms' } }, lines);
    }));

    const label = active ? SIG[active-1].name : 'no signal';
    const caption = e('div', { style:{ height:18, display:'flex', alignItems:'center', gap:8, marginTop:12 } }, [
      e('span', { key:'l', style:{ fontFamily:"'Share Tech Mono', monospace", fontSize:13, letterSpacing:'0.08em',
        color: active ? GREEN : '#3f7a58', transition:'color 140ms' } }, label),
      sel ? e('span', { key:'d', style:{ fontFamily:"'Share Tech Mono', monospace", fontSize:8,
        letterSpacing:'0.14em', textTransform:'uppercase', color:'#3f7a58' } }, '· locked') : null,
    ]);

    const voteWidget = e('div', { onMouseLeave:()=>setHov(0), style:{ display:'flex', flexDirection:'column' } }, [
      e('div', { key:'r' }, rowEl), caption ]);
    return { voteWidget };
  }
}
</script>
