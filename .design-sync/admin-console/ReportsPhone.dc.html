<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin — Reports at phone width</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/wz/styles.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<div class="adm" data-theme="{{theme}}" style="width:390px;height:844px;flex-direction:column;flex-wrap:nowrap">
  <header style="display:flex;align-items:center;justify-content:space-between;padding:0 var(--space-sm);min-height:56px;border-bottom:1px solid var(--color-border);background:var(--color-bg-surface-alt)">
    <a href="ModMode.dc.html" class="rail-back" style="padding:0">← World Zero</a>
    <span style="font-family:var(--font-display);font-size:18px;font-weight:700;display:flex;align-items:center;gap:6px">Reports <span class="count">1</span></span>
    <button class="btn" aria-label="Admin menu" aria-expanded="false">Menu</button>
  </header>
  <main style="flex-grow:1;overflow:auto;padding:var(--space-md);display:flex;flex-direction:column;gap:var(--space-sm)">
    <div class="photo" role="img" aria-label="The praxis photo" style="flex:0 0 200px;height:200px">[praxis photo]</div>
    <span class="reason">Not real</span>
    <a href="#" style="font-family:var(--font-display);font-size:20px;font-weight:700">Walked a new street (I didn't)</a>
    <span class="muted">by Moss Tern · on “Walk a New Street” · 12m ago</span>
    <blockquote class="quote">“Photo is a stock image.” <span class="muted">— Ada Quill</span></blockquote>
    <label class="field">Reason the author sees<input class="input" placeholder="One line, for Remove or Doesn't meet the task"></label>
    <a href="People.dc.html" class="btn" style="align-self:flex-start">More about Moss Tern →</a>
  </main>
  <footer style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-xs);padding:var(--space-sm) var(--space-md) var(--space-md);border-top:1px solid var(--color-border)">
    <button class="btn" style="justify-content:center">Keep</button>
    <button class="btn btn-dng" style="justify-content:center">Remove</button>
    <button class="btn btn-wrn" style="justify-content:center;padding:0 var(--space-xs)">Not met</button>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return { theme: this.props.theme ?? 'dark' }; }
}
</script>
</body>
</html>
