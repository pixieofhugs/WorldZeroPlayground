<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin rail</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/wz/styles.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<nav aria-label="Admin" class="rail" style="min-height:940px;max-width:none;width:260px">
  <a href="ModMode.dc.html" class="rail-back">← Back to World Zero</a>
  <div class="rail-brand">
    <span class="rail-word">World Zero</span>
    <span class="rail-spectrum"></span>
    <span class="muted" style="font-size:12px;margin-top:4px">Admin · Era 1, Renaissance</span>
  </div>
  <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
    <div class="grp">{{g.label}}</div>
    <sc-for list="{{g.items}}" as="it" hint-placeholder-count="3">
      <a href="{{it.href}}" class="{{it.cls}}" aria-current="{{it.current}}">
        <span>{{it.label}}</span>
        <sc-if value="{{it.count}}" hint-placeholder-val="{{true}}"><span class="{{it.countCls}}">{{it.count}}</span></sc-if>
        <sc-if value="{{it.tally}}" hint-placeholder-val="{{false}}"><span class="tally">{{it.tally}}</span></sc-if>
      </a>
    </sc-for>
  </sc-for>
  <div style="flex-grow:1;min-height:32px"></div>
  <hr class="rule">
  <div class="grp grp-danger">Danger</div>
  <a href="EraRoll.dc.html" class="{{eraCls}}" aria-current="{{eraCurrent}}"><span>Roll into a new era…</span></a>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["reports","messages","proposals","praxis","tasks","people","smallworld","modlog","era"],"default":"reports"},"reports":{"editor":"int","default":1},"$preview":{"width":260,"height":940}}'>
class Component extends DCLogic {
renderVals() {
const active = this.props.active ?? 'reports';
const item = (key, label, href, extra) => Object.assign({
  label, href,
  cls: 'nav' + (key === active ? ' nav-on' : ''),
  current: key === active ? 'page' : 'false',
  count: null, countCls: 'count', tally: null
}, extra || {});
return {
  groups: [
    { label: 'Needs you', items: [
      item('reports', 'Reports', 'Main.dc.html', { count: (this.props.reports ?? 1) || null }),
      item('messages', 'Messages', '#', { count: 1, countCls: 'count count-q' }),
      item('proposals', 'Task proposals', 'Tasks.dc.html', { count: 2, countCls: 'count count-q' })
    ]},
    { label: 'Run the game', items: [
      item('praxis', 'Praxis', '#', { tally: '38' }),
      item('tasks', 'Tasks', 'Tasks.dc.html', { tally: '10' }),
      item('people', 'People', 'People.dc.html', { tally: '21' }),
      item('smallworld', 'Small world', 'SmallWorld.dc.html'),
      item('modlog', 'Mod log', 'ModLog.dc.html')
    ]},
    { label: 'Words', items: [
      item('factioncopy', 'Faction copy', '#'),
      item('levelcopy', 'Level-up copy', '#')
    ]}
  ],
  eraCls: 'nav nav-danger' + (active === 'era' ? ' nav-on' : ''),
  eraCurrent: active === 'era' ? 'page' : 'false'
};
}
}
</script>
</body>
</html>
