<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin — Mod log</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/wz/styles.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<div class="adm" data-theme="{{theme}}" style="min-height:1000px">
  <dc-import name="Rail" active="modlog" hint-size="260px,1000px"></dc-import>
  <main class="main">
    <header class="head">
      <div>
        <h1 class="h1">Mod log</h1>
        <p class="lede">Every decision any mod made, newest first. Saved, so nobody handles the same thing twice.</p>
      </div>
    </header>
    <div class="toolbar" role="toolbar" aria-label="Filter the log">
      <label class="search"><span class="sr">Search the log</span><input class="input input-round" placeholder="Search a player, task or reason…"></label>
      <div class="segs" role="tablist" aria-label="Kind">
        <button class="seg seg-on" role="tab" aria-selected="true">All</button>
        <button class="seg" role="tab" aria-selected="false">Reports</button>
        <button class="seg" role="tab" aria-selected="false">Tasks</button>
        <button class="seg" role="tab" aria-selected="false">People</button>
        <button class="seg" role="tab" aria-selected="false">Rules</button>
      </div>
      <button class="chip">Mod: anyone ▾</button>
    </div>
    <div class="card scroll">
      <table class="tbl">
        <thead><tr><th class="th">When</th><th class="th">Mod</th><th class="th">Did</th><th class="th">To</th><th class="th">Reason the author saw</th></tr></thead>
        <tbody>
          <sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
            <tr><td class="td muted">{{r.when}}</td><td class="td">{{r.mod}}</td><td class="td"><span class="{{r.tag}}">{{r.did}}</span></td><td class="td">{{r.to}}</td><td class="td muted">{{r.why}}</td></tr>
          </sc-for>
        </tbody>
      </table>
    </div>
    <p class="muted" style="margin:0">Mods see this log; players never do. Rules rows come from the Small world switches.</p>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
renderVals() {
const r = (when, mod, did, tag, to, why) => ({ when, mod, did, tag: 'tag ' + tag, to, why });
return {
  theme: this.props.theme ?? 'dark',
  rows: [
    r('yesterday', 'Rook', 'removed', 'tag-bad', 'comment by Pell Gray', 'Name-calling. Say what you think of the praxis, not the person.'),
    r('yesterday', 'You', 'switched', 'tag-wait', 'Flagging → full game (level 4)', '—'),
    r('Tue', 'You', 'kept', 'tag-ok', "“Learn a Bird’s Name” by Juniper Vale", '—'),
    r('Tue', 'Rook', "doesn't meet the task", 'tag-wait', '“Refilled my water bottle” by Moss Tern', 'The task asks for something that should not be empty. A water bottle is meant to run out.'),
    r('Mon', 'You', 'activated', 'tag-ok', 'task “Mend a Small Thing” by Ada Quill', '—'),
    r('Mon', 'You', 'retired', 'tag-wait', 'task “Lick a Battery” by Pell Gray', 'Not safe to ask anyone to do.'),
    r('Nov 14', 'Rook', 'banned', 'tag-bad', 'character Spamlord', 'Posted the same link nine times.'),
    r('Nov 14', 'Rook', 'removed all flagged', 'tag-bad', '3 praxis by Spamlord', 'Posted the same link nine times.')
  ]
};
}
}
</script>
</body>
</html>
