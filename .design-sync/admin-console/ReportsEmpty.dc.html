<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin — Reports, nothing open</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/wz/styles.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<dc-import name="Main" theme="{{theme}}" empty="{{yes}}" hint-size="100%,1000px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
renderVals() { return { theme: this.props.theme ?? 'dark', yes: true }; }
}
</script>
</body>
</html>
